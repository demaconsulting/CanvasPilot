---
version: 2
updates:
  # Maintain dependencies for NuGet
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      nuget-dependencies:
        patterns:
          - "*"
    ignore:
      # xunit.v3 4.x and xunit.runner.visualstudio 4.x are held back: xunit.v3 4.x runs only on
      # Microsoft.Testing.Platform and changes the extensibility API, and the latest
      # Avalonia.Headless.XUnit (built against xunit.v3 3.x) fails test discovery against it with a
      # MissingMethodException, so the headless UiTests cannot run. Remove these rules once
      # Avalonia.Headless.XUnit supports xunit.v3 4.x.
      - dependency-name: "xunit.v3"
        update-types: ["version-update:semver-major"]
      - dependency-name: "xunit.runner.visualstudio"
        update-types: ["version-update:semver-major"]
      # Microsoft.CodeAnalysis.NetAnalyzers stays on the major version of the .NET SDK installed
      # by CI and of the target framework (net10.0); the 11.x analyzers belong to the .NET 11 SDK.
      - dependency-name: "Microsoft.CodeAnalysis.NetAnalyzers"
        update-types: ["version-update:semver-major"]

  # Maintain dependencies for GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      github-actions-dependencies:
        patterns:
          - "*"

  # Maintain dependencies for Python tooling (pip-requirements.txt: yamllint and yamlfix
  # for lint.ps1/fix.ps1)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 10
    groups:
      pip-dependencies:
        patterns:
          - "*"
