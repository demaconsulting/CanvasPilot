---
# CodeQL configuration for CanvasPilot
# Suppresses intentional generic catch clauses

name: "CanvasPilot CodeQL Config"

# Query filters to disable specific queries for certain paths
query-filters:
  - exclude:
      id: cs/catch-of-all-exceptions
    paths:
      - src/DemaConsulting.CanvasPilot/Context.cs
      - src/DemaConsulting.CanvasPilot/Validation.cs
  # Exclude path-combine warnings in PathHelpers (validated safe usage)
  - exclude:
      id: cs/path-combine
    paths:
      - src/DemaConsulting.CanvasPilot/PathHelpers.cs
