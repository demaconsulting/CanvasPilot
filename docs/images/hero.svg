<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="640" viewBox="0 0 1600 640">
  <!-- The README hero banner. It shows a typed or spoken request, files dropped in, marks on a picture, and the
       source formats CanvasNet draws flowing into the CanvasPilot AI copilot, and a standalone picture, a PNG
       file, an email, and a slide coming out.
       The definitions and the left panel follow the shared DEMA Consulting hero (CanvasNet and BuildMark).
       This file is docs/images/hero.svg, beside its rendered docs/images/hero.png (matching base names, per the
       diagram documentation standard); the files it embeds are in docs/images/hero/. -->
  <defs>
    <style>
      .word { font: bold 86px sans-serif; fill: #ffffff; }
      .eyebrow { font: bold 25px sans-serif; fill: #a5b4fc; }
      .tag { font: bold 36px sans-serif; fill: #f8fafc; }
      .body { font: 25px sans-serif; fill: #cbd5e1; }
      .cmd { font: 25px monospace; fill: #e2e8f0; }
      .prompt { fill: #5eead4; }
      .file { fill: #f9a8d4; }
      .brandText { fill: url(#brand); }
      .note { font: italic 25px sans-serif; fill: #94a3b8; }
      .label { font: bold 25px sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .engine { font: bold 32px monospace; fill: #ffffff; }
      .api { font: bold 25px sans-serif; fill: #c4b5fd; }
      .card { fill: url(#glass); stroke: url(#rim); stroke-width: 1.5; filter: url(#shadow); }
      .panel { fill: #0a1022; stroke: #ffffff; stroke-opacity: 0.06; }
      .flow { fill: none; stroke-width: 3; stroke-linecap: round; }
      .page { fill: #ffffff; filter: url(#paper); }
    </style>

    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070b1f"/>
      <stop offset="0.55" stop-color="#130f3b"/>
      <stop offset="1" stop-color="#071a2e"/>
    </linearGradient>
    <radialGradient id="glowViolet" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#7c3aed" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#7c3aed" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCyan" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#06b6d4" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#06b6d4" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowPink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#db2777" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#db2777" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#a5b4fc" fill-opacity="0.16"/>
    </pattern>
    <linearGradient id="brand" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="0.5" stop-color="#a78bfa"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.04"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0.08"/>
    </linearGradient>
    <linearGradient id="engineFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e1b4b"/>
      <stop offset="1" stop-color="#0b1022"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#000000" flood-opacity="0.45"/>
    </filter>
    <filter id="paper" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
    <filter id="blur" x="-30%" y="-150%" width="160%" height="400%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="heat" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>

    <marker id="headPink" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#f472b6"/>
    </marker>
    <marker id="headAmber" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#fbbf24"/>
    </marker>
    <marker id="headCyan" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#22d3ee"/>
    </marker>
    <marker id="headViolet" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#a78bfa"/>
    </marker>
    <marker id="headBlue" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#60a5fa"/>
    </marker>
    <marker id="headMint" viewBox="0 0 10 10" refX="2.5" refY="5" markerWidth="4" markerHeight="4" orient="auto">
      <path d="M0,0 L10,5 L0,10 L2.5,5 z" fill="#5eead4"/>
    </marker>

    <!-- The text and shapes inside the mini illustrations -->
    <style>
      .mini { font: bold 22px sans-serif; }
      .miniMono { font: bold 22px monospace; }
      .bar { fill: #cbd5e1; }
      .ink { fill: #1e293b; }
    </style>
  </defs>

  <!-- Background: deep gradient, soft glows, and a dot grid -->
  <rect width="1600" height="640" fill="url(#bg)"/>
  <ellipse cx="250" cy="170" rx="420" ry="300" fill="url(#glowViolet)"/>
  <ellipse cx="1070" cy="294" rx="420" ry="220" fill="url(#glowCyan)"/>
  <ellipse cx="1480" cy="620" rx="380" ry="260" fill="url(#glowPink)"/>
  <rect width="1600" height="640" fill="url(#dots)"/>

  <!-- Wordmark and tagline. The name is 86px (not 92px) so that "CanvasPilot" ends before the cards at x = 580. -->
  <image href="hero/dc-logo-dark.svg" x="46" y="54" width="50" height="50"/>
  <text class="eyebrow" x="100" y="90">DEMA Consulting</text>
  <text class="word" x="52" y="176">Canvas</text>
  <text class="word brandText" x="357.9" y="176">Pilot</text>
  <rect x="58" y="200" width="132" height="6" rx="3" fill="url(#brand)"/>
  <text class="tag" x="56" y="266">AI-assisted drawing</text>
  <text class="tag" x="56" y="314" style="fill: #a5b4fc">creation with CanvasNet.</text>
  <text class="body" x="58" y="368">Type or speak a request; an AI copilot</text>
  <text class="body" x="58" y="402">composes SVG, charts, pages, and</text>
  <text class="body" x="58" y="436">images into a picture ready to share.</text>
  <rect x="56" y="468" width="480" height="54" rx="12" fill="#0a1022" fill-opacity="0.8" stroke="#a78bfa" stroke-opacity="0.45" stroke-width="1.5"/>
  <text class="cmd file" x="78" y="503">"Draw our release flow"</text>
  <text class="note" x="58" y="568">A Windows desktop app.</text>

  <!-- Input cards -->
  <g>
    <!-- Input one: typed or spoken request, a chat bubble, the F9 key, and a microphone -->
    <rect class="card" x="580" y="40" width="236" height="160" rx="16"/>
    <rect x="642" y="40" width="112" height="3" rx="1.5" fill="#fbbf24"/>
    <rect class="panel" x="588" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(588 48)">
      <rect class="page" x="14" y="10" width="140" height="48" rx="12"/>
      <path d="M30 56 L24 74 L48 56 Z" fill="#ffffff"/>
      <rect x="28" y="24" width="92" height="6" rx="3" fill="#fbbf24"/>
      <rect class="bar" x="28" y="38" width="64" height="6" rx="3"/>
      <rect x="68" y="70" width="64" height="32" rx="8" fill="#fbbf24" fill-opacity="0.16" stroke="#fbbf24" stroke-width="1.5"/>
      <text class="mini" x="100" y="93" fill="#fde68a" text-anchor="middle">F9</text>
      <rect x="170" y="18" width="22" height="40" rx="11" fill="#fbbf24"/>
      <path d="M162 46 C162 72 200 72 200 46" fill="none" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <line x1="181" y1="68" x2="181" y2="82" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
      <line x1="170" y1="84" x2="192" y2="84" stroke="#fbbf24" stroke-width="3" stroke-linecap="round"/>
    </g>
    <text class="label" x="698" y="190">Type or speak</text>

    <!-- Input two: files dropped in, a picture card and a drop arrow -->
    <rect class="card" x="828" y="40" width="236" height="160" rx="16"/>
    <rect x="890" y="40" width="112" height="3" rx="1.5" fill="#22d3ee"/>
    <rect class="panel" x="836" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(836 48)">
      <rect class="page" x="24" y="10" width="92" height="74" rx="8" fill-opacity="0.5"/>
      <rect class="page" x="40" y="22" width="108" height="76" rx="8"/>
      <rect x="48" y="30" width="92" height="60" rx="5" fill="#e0f2fe"/>
      <circle cx="66" cy="46" r="7" fill="#f59e0b"/>
      <path d="M48 90 L76 62 L94 78 L112 56 L140 90 Z" fill="#38bdf8"/>
      <line x1="178" y1="18" x2="178" y2="74" stroke="#22d3ee" stroke-width="5" stroke-linecap="round"/>
      <path d="M163 62 L178 80 L193 62 Z" fill="#22d3ee"/>
      <line x1="164" y1="96" x2="192" y2="96" stroke="#22d3ee" stroke-width="4" stroke-linecap="round"/>
    </g>
    <text class="label" x="946" y="190">Drop in files</text>

    <!-- Input three: marks on a picture, an ellipse with a numbered badge -->
    <rect class="card" x="1076" y="40" width="236" height="160" rx="16"/>
    <rect x="1138" y="40" width="112" height="3" rx="1.5" fill="#f472b6"/>
    <rect class="panel" x="1084" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1084 48)">
      <rect class="page" x="20" y="12" width="180" height="90" rx="8"/>
      <rect x="36" y="38" width="52" height="34" rx="6" fill="#cbd5e1"/>
      <line x1="88" y1="55" x2="122" y2="55" stroke="#94a3b8" stroke-width="3"/>
      <rect x="122" y="34" width="56" height="42" rx="6" fill="#cbd5e1"/>
      <ellipse cx="150" cy="55" rx="40" ry="31" fill="none" stroke="#db2777" stroke-width="3.5"/>
      <circle cx="116" cy="30" r="14" fill="#db2777"/>
      <text class="mini" x="116" y="38" fill="#ffffff" text-anchor="middle">1</text>
    </g>
    <text class="label" x="1194" y="190">Mark problems</text>

    <!-- Input four: the formats CanvasNet draws, as chips -->
    <rect class="card" x="1324" y="40" width="236" height="160" rx="16"/>
    <rect x="1386" y="40" width="112" height="3" rx="1.5" fill="#60a5fa"/>
    <rect class="panel" x="1332" y="48" width="220" height="112" rx="10"/>
    <g transform="translate(1332 48)">
      <g fill="#60a5fa" fill-opacity="0.16" stroke="#60a5fa" stroke-width="1.5">
        <rect x="10" y="6" width="62" height="30" rx="8"/>
        <rect x="80" y="6" width="62" height="30" rx="8"/>
        <rect x="150" y="6" width="62" height="30" rx="8"/>
        <rect x="10" y="41" width="104" height="30" rx="8"/>
        <rect x="122" y="41" width="80" height="30" rx="8"/>
        <rect x="10" y="76" width="126" height="30" rx="8"/>
        <rect x="144" y="76" width="58" height="30" rx="8"/>
      </g>
      <g class="mini" fill="#bfdbfe" text-anchor="middle">
        <text x="41" y="29">SVG</text>
        <text x="111" y="29">PNG</text>
        <text x="181" y="29">PDF</text>
        <text x="62" y="64">Mermaid</text>
        <text x="162" y="64">PPTX</text>
        <text x="73" y="99">Vega-Lite</text>
        <text x="173" y="99">3D</text>
      </g>
    </g>
    <text class="label" x="1442" y="190">Many formats</text>
  </g>

  <!-- Flows into the engine -->
  <g class="flow">
    <path d="M698,206 C698,236 950,226 950,253" stroke="#fbbf24" marker-end="url(#headAmber)"/>
    <path d="M946,206 C946,236 1030,226 1030,253" stroke="#22d3ee" marker-end="url(#headCyan)"/>
    <path d="M1194,206 C1194,236 1110,226 1110,253" stroke="#f472b6" marker-end="url(#headPink)"/>
    <path d="M1442,206 C1442,236 1190,226 1190,253" stroke="#60a5fa" marker-end="url(#headBlue)"/>
  </g>
  <g stroke="#0a1022" stroke-width="2">
    <circle cx="698" cy="206" r="5" fill="#fbbf24"/>
    <circle cx="946" cy="206" r="5" fill="#22d3ee"/>
    <circle cx="1194" cy="206" r="5" fill="#f472b6"/>
    <circle cx="1442" cy="206" r="5" fill="#60a5fa"/>
  </g>

  <!-- The engine: CanvasPilot, the AI copilot. The pill is wider than the shared one for the longer name. -->
  <rect x="830" y="262" width="480" height="64" rx="32" fill="url(#brand)" opacity="0.55" filter="url(#blur)"/>
  <rect x="830" y="262" width="480" height="64" rx="32" fill="url(#engineFill)" stroke="url(#brand)" stroke-width="2.5"/>
  <rect x="854" y="276" width="36" height="36" rx="9" fill="url(#brand)"/>
  <path d="M872 281 L876.5 289.5 L885 294 L876.5 298.5 L872 307 L867.5 298.5 L859 294 L867.5 289.5 Z" fill="#ffffff"/>
  <text class="engine" x="906" y="305">CanvasPilot</text>
  <line x1="1129" y1="278" x2="1129" y2="310" stroke="#ffffff" stroke-opacity="0.25" stroke-width="1.5"/>
  <text class="api" x="1149" y="303">AI copilot</text>

  <!-- Flows out of the engine -->
  <g class="flow" stroke="#5eead4">
    <path d="M980,330 C980,356 728,356 728,381" marker-end="url(#headMint)"/>
    <path d="M1040,330 C1040,356 999,356 999,381" marker-end="url(#headMint)"/>
    <path d="M1100,330 C1100,356 1232,356 1232,381" marker-end="url(#headMint)"/>
    <path d="M1160,330 C1160,356 1457,356 1457,381" marker-end="url(#headMint)"/>
  </g>
  <g fill="#5eead4" stroke="#0a1022" stroke-width="2">
    <circle cx="980" cy="330" r="5"/>
    <circle cx="1040" cy="330" r="5"/>
    <circle cx="1100" cy="330" r="5"/>
    <circle cx="1160" cy="330" r="5"/>
  </g>

  <!-- Output tiles -->
  <g>
    <!-- Output one: the standalone picture, a flowchart, a chart, and nested pictures composed on one page -->
    <rect class="card" x="580" y="390" width="296" height="210" rx="16"/>
    <rect class="panel" x="588" y="398" width="280" height="152" rx="10"/>
    <rect class="page" x="610" y="408" width="240" height="132" rx="10"/>
    <rect x="624" y="420" width="70" height="26" rx="6" fill="#4f46e5"/>
    <rect x="634" y="430" width="50" height="6" rx="3" fill="#ffffff"/>
    <line x1="659" y1="446" x2="659" y2="466" stroke="#64748b" stroke-width="3"/>
    <path d="M651 464 L667 464 L659 478 Z" fill="#64748b"/>
    <rect x="624" y="478" width="70" height="26" rx="6" fill="#0891b2"/>
    <rect x="634" y="488" width="50" height="6" rx="3" fill="#ffffff"/>
    <rect class="bar" x="712" y="422" width="52" height="6" rx="3"/>
    <line x1="710" y1="510" x2="768" y2="510" stroke="#94a3b8" stroke-width="3"/>
    <rect x="716" y="486" width="12" height="24" fill="#f59e0b"/>
    <rect x="734" y="464" width="12" height="46" fill="#db2777"/>
    <rect x="752" y="476" width="12" height="34" fill="#0891b2"/>
    <rect x="778" y="418" width="62" height="52" rx="6" fill="#e0f2fe" stroke="#0ea5e9" stroke-width="2"/>
    <circle cx="794" cy="433" r="6" fill="#f59e0b"/>
    <path d="M780 468 L798 448 L810 460 L822 444 L838 468 Z" fill="#38bdf8"/>
    <rect x="778" y="480" width="62" height="50" rx="6" fill="#fef3c7" stroke="#f59e0b" stroke-width="2"/>
    <rect x="790" y="490" width="38" height="30" rx="3" fill="#ffffff" stroke="#d97706" stroke-width="2"/>
    <text class="label" x="728" y="585">Standalone picture</text>

    <!-- Output two: a PNG file with a picture in it -->
    <rect class="card" x="889" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="897" y="398" width="204" height="152" rx="10"/>
    <polygon class="page" points="952,408 1034,408 1050,424 1050,542 952,542"/>
    <path d="M1034 408 L1034 424 L1050 424 Z" fill="#cbd5e1"/>
    <rect x="964" y="436" width="74" height="50" rx="4" fill="#e0f2fe"/>
    <circle cx="982" cy="452" r="6" fill="#f59e0b"/>
    <path d="M964 486 L984 466 L998 478 L1012 462 L1038 486 Z" fill="#38bdf8"/>
    <rect x="986" y="500" width="70" height="32" rx="8" fill="#0f766e" stroke="#5eead4" stroke-width="1.5"/>
    <text class="mini" x="1021" y="523" fill="#ffffff" text-anchor="middle">PNG</text>
    <text class="label" x="999" y="585">PNG file</text>

    <!-- Output three: an email with the picture attached -->
    <rect class="card" x="1122" y="390" width="220" height="210" rx="16"/>
    <rect class="panel" x="1130" y="398" width="204" height="152" rx="10"/>
    <rect class="page" x="1146" y="408" width="172" height="134" rx="10"/>
    <rect class="bar" x="1160" y="422" width="100" height="6" rx="3"/>
    <rect class="bar" x="1160" y="438" width="70" height="6" rx="3"/>
    <rect x="1160" y="454" width="84" height="76" rx="5" fill="#e0f2fe"/>
    <circle cx="1180" cy="472" r="7" fill="#f59e0b"/>
    <path d="M1160 530 L1186 502 L1204 518 L1222 496 L1244 530 Z" fill="#38bdf8"/>
    <rect x="1256" y="498" width="48" height="32" rx="8" fill="#4f46e5"/>
    <path d="M1268 522 L1292 514 L1268 506 L1272 514 Z" fill="#ffffff"/>
    <text class="label" x="1232" y="585">Email</text>

    <!-- Output four: a presentation slide with the picture on it -->
    <rect class="card" x="1355" y="390" width="205" height="210" rx="16"/>
    <rect class="panel" x="1363" y="398" width="189" height="152" rx="10"/>
    <rect class="page" x="1375" y="424" width="165" height="100" rx="6"/>
    <rect x="1388" y="436" width="70" height="8" rx="4" fill="#7c3aed"/>
    <rect x="1388" y="452" width="76" height="60" rx="4" fill="#e0f2fe"/>
    <circle cx="1404" cy="466" r="6" fill="#f59e0b"/>
    <path d="M1388 512 L1410 490 L1426 502 L1442 484 L1464 512 Z" fill="#38bdf8"/>
    <rect class="bar" x="1476" y="456" width="50" height="5" rx="2.5"/>
    <rect class="bar" x="1476" y="470" width="40" height="5" rx="2.5"/>
    <rect class="bar" x="1476" y="484" width="46" height="5" rx="2.5"/>
    <text class="label" x="1457" y="585">Slides</text>
  </g>
</svg>
