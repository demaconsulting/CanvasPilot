<svg xmlns="http://www.w3.org/2000/svg" width="960" height="1100" viewBox="0 0 960 1100" font-family="Segoe UI, Arial, sans-serif">
  <title>CanvasPilot architecture</title>
  <desc>The Desktop head starts the Avalonia application. The library holds the AppShell subsystem, which builds and hosts the other thirteen subsystems: Chat, Composer, Payload, and Annotation for the conversation, Project, Preview, Settings, and Speech for the files, the picture, and the choices, Knowledge, the drawing guide of cards that the copilot reads, Style, the style kits with their window, picker, and check of a picture against a palette, and Agent, the AI copilot. Chat uses Composer, Payload, Annotation, and Speech, and reaches Agent only through IAgentService and the events of a turn; Payload and Annotation read the pictures of Preview; Preview follows the Project explorer, and Speech and Style add pages to the Settings dialog. Agent uses Settings, Project, Payload, Knowledge, Style, and Preview, and implements the connection check that Settings declares, so Settings does not use Agent. Style depends on Project, Settings, Preview, and Knowledge, and none of them depends on Style. The subsystems that write a log use Logging (Knowledge, Payload, and Utilities write none), and the subsystems that build file locations use Utilities. Chat draws the completed replies of the copilot with its own ReplyMarkdown unit. Third-party items, including the AI libraries, and the local data the application reads and writes, including the chat history and the Copilot runtime data outside the project, are shown below.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="956" height="1096" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">CanvasPilot architecture</text>

  <!-- Library container -->
  <rect x="20" y="70" width="920" height="696" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="36" y="92" font-size="13" font-weight="600" fill="#1d4ed8">DemaConsulting.CanvasPilot (application library)</text>

  <!-- Desktop head -->
  <rect x="560" y="14" width="380" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="750" y="31" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">CanvasPilot.exe (Desktop head)</text>
  <text x="750" y="47" font-size="11" fill="#334155" text-anchor="middle">starts the Avalonia application</text>
  <line x1="750" y1="54" x2="750" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- AppShell -->
  <rect x="40" y="104" width="880" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="127" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">AppShell</text>
  <text x="480" y="147" font-size="12" fill="#166534" text-anchor="middle">MainWindowShell, ProjectWorkspace, AboutDialog, and the composition root that builds and hosts every subsystem below</text>

  <!-- Arrows from AppShell to the subsystems -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="142" y1="168" x2="142" y2="196"/>
    <line x1="369" y1="168" x2="369" y2="196"/>
    <line x1="596" y1="168" x2="596" y2="196"/>
    <line x1="823" y1="168" x2="823" y2="196"/>
  </g>

  <!-- Row 1: the conversation. Chat -->
  <rect x="40" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="142" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Chat</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="142" y="240">ChatPanel</text>
    <text x="142" y="255">PayloadInspector</text>
    <text x="142" y="270">ReplyMarkdown</text>
  </g>

  <!-- Composer -->
  <rect x="267" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="369" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Composer</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="369" y="238">ComposerDocument, ComposerHistory</text>
    <text x="369" y="252">AttachmentIntake, AttachmentStore</text>
    <text x="369" y="266">ComposerViewModel, ComposerEditor</text>
  </g>

  <!-- Payload -->
  <rect x="494" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="596" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Payload</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="596" y="240">MessagePayload, PayloadBuilder</text>
    <text x="596" y="255">MarkImageComposer</text>
    <text x="596" y="270">PayloadDescriber</text>
  </g>

  <!-- Annotation -->
  <rect x="721" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="823" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Annotation</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="823" y="240">MarkRegistry</text>
    <text x="823" y="255">MarkSourceResolver</text>
    <text x="823" y="270">AnnotationOverlay</text>
  </g>

  <!-- Dependencies between neighbors: Chat uses Composer, Payload uses Composer and Annotation -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="245" y1="240" x2="267" y2="240"/>
    <line x1="494" y1="240" x2="472" y2="240"/>
    <line x1="699" y1="240" x2="721" y2="240"/>
  </g>

  <!-- Row 2: files, the picture, and the choices. Project -->
  <rect x="40" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="142" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Project</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="142" y="348">ProjectService</text>
    <text x="142" y="363">RecentProjects</text>
    <text x="142" y="378">NewProjectDialog</text>
    <text x="142" y="393">ProjectExplorer</text>
  </g>

  <!-- Preview -->
  <rect x="267" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="369" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Preview</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="369" y="348">ImageRenderService</text>
    <text x="369" y="363">PreviewPane</text>
    <text x="369" y="378">ImageExporter</text>
    <text x="369" y="393">ImageDragSource</text>
    <text x="369" y="408">ExportPresetDialog</text>
  </g>

  <!-- Settings -->
  <rect x="494" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="596" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Settings</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="596" y="348">SettingsService</text>
    <text x="596" y="363">SettingsDialog</text>
    <text x="596" y="378">AiProviderSettingsPage</text>
  </g>

  <!-- Speech -->
  <rect x="721" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="823" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Speech</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="823" y="345">AudioDeviceService</text>
    <text x="823" y="359">SpeechModelService</text>
    <text x="823" y="373">DictationService</text>
    <text x="823" y="387">DeviceSelection, ModelCatalogPanel</text>
    <text x="823" y="401">ModelParameterEditor</text>
    <text x="823" y="415">SpeechSettingsPage</text>
  </g>

  <!-- Dependencies between neighbors: Preview follows the Project explorer, Speech contributes a Settings page -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="267" y1="364" x2="245" y2="364"/>
    <line x1="721" y1="364" x2="699" y2="364"/>
  </g>

  <!-- Notes on the dependencies that are not between neighbors -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="480" y="444">Chat also uses Annotation, Payload, and Speech; Annotation and Payload read the pictures of Preview.</text>
    <text x="480" y="458">Style uses Project, Settings, Preview, and Knowledge (only the descriptor of a tool); none of them uses Style.</text>
    <text x="480" y="472">The subsystems that write a log use Logging (Knowledge, Payload, and Utilities write none); those that build file locations use Utilities.</text>
    <text x="480" y="486">Chat reaches Agent only through IAgentService; Agent uses Settings, Project, Payload, Knowledge, Style, and Preview, and Settings never uses Agent.</text>
  </g>

  <!-- Row 3: the AI copilot. Agent -->
  <rect x="40" y="498" width="880" height="92" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="519" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Agent</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="480" y="536">AgentContract (IAgentService), AgentService, AgentReadiness, CopilotCliLocator, CopilotRuntimeStarter, AgentProviderFactory</text>
    <text x="480" y="550">AgentToolRegistry, ProjectTools (confined to the project), AgentInstructions, PayloadMessageMapper, AgentEventMapper</text>
    <text x="480" y="566">Ollama and GitHub Copilot (on the installed Copilot CLI) work end to end</text>
    <text x="480" y="580">no tool outside the project; no Copilot runtime in the installer</text>
  </g>

  <!-- Rows 4 and 5, moved down: the drawing knowledge, the style kits, Logging, and Utilities -->
  <g transform="translate(0,120)">
  <!-- Row 4: the drawing knowledge and the style kits. Knowledge -->
  <rect x="40" y="484" width="430" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="255" y="505" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Knowledge</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="255" y="522">KnowledgeCatalog, KnowledgeSearch, KnowledgePromptBuilder,</text>
    <text x="255" y="536">KnowledgeTools, KnowledgeSkills</text>
    <text x="255" y="550">no user interface, no language model</text>
  </g>

  <!-- Style -->
  <rect x="490" y="484" width="430" height="78" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="705" y="505" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Style</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="705" y="522">StyleKitDocument, StyleKitCatalog, StyleKitArchive, StyleSelection,</text>
    <text x="705" y="536">StyleGuidance, StyleChecker, StyleTools, StylePicker,</text>
    <text x="705" y="550">StyleSettingsPage, StyleKitEditor, StyleKitManager; no language model</text>
  </g>

  <!-- Style uses Utilities -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="705" y1="562" x2="705" y2="580"/>
  </g>
  <!-- Logging and Utilities -->
  <rect x="40" y="580" width="430" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="602" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Logging</text>
  <text x="255" y="620" font-size="11" fill="#1e40af" text-anchor="middle">RollingFileLogger: local rolling log files</text>
  <rect x="490" y="580" width="430" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="705" y="602" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Utilities</text>
  <text x="705" y="620" font-size="11" fill="#1e40af" text-anchor="middle">PathHelpers: safe path combination</text>
  </g>

  <!-- Third-party items -->
  <g transform="translate(0,120)">
  <text x="24" y="676" font-size="13" font-weight="600" fill="#0f172a">Third-party (OTS) items used by the library</text>
  <g>
    <rect x="20" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="104" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Avalonia</text>
    <text x="104" y="726" font-size="11" fill="#92400e" text-anchor="middle">windows, menus, dialogs</text>
    <rect x="198" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="282" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">AvaloniaEdit</text>
    <text x="282" y="726" font-size="11" fill="#92400e" text-anchor="middle">the message editor</text>
    <rect x="376" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="460" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">CommunityToolkit.Mvvm</text>
    <text x="460" y="726" font-size="11" fill="#92400e" text-anchor="middle">view model generators</text>
    <rect x="554" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="638" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">CanvasNet</text>
    <text x="638" y="726" font-size="11" fill="#92400e" text-anchor="middle">draws files, help cards</text>
    <rect x="732" y="686" width="208" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="836" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">DemaConsulting.Speech</text>
    <text x="836" y="726" font-size="11" fill="#92400e" text-anchor="middle">audio devices and speech models</text>
    <rect x="20" y="754" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="104" y="776" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">AgentKit</text>
    <text x="104" y="794" font-size="11" fill="#92400e" text-anchor="middle">tool packs, agent factories</text>
    <rect x="198" y="754" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="282" y="776" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Copilot SDK</text>
    <text x="282" y="794" font-size="11" fill="#92400e" text-anchor="middle">client; runtime not bundled</text>
    <rect x="376" y="754" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="460" y="776" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Agent Framework</text>
    <text x="460" y="794" font-size="11" fill="#92400e" text-anchor="middle">agents, streamed turns</text>
    <rect x="554" y="754" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="638" y="776" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Extensions.AI</text>
    <text x="638" y="794" font-size="11" fill="#92400e" text-anchor="middle">messages, tools, pictures</text>
    <rect x="732" y="754" width="208" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="836" y="776" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">OllamaSharp</text>
    <text x="836" y="794" font-size="11" fill="#92400e" text-anchor="middle">client of the Ollama server</text>
  </g>
  </g>

  <!-- Local data -->
  <g transform="translate(0,188)">
  <text x="24" y="770" font-size="13" font-weight="600" fill="#0f172a">Local data read and written by the application</text>
  <g>
    <rect x="20" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="127" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Project folder</text>
    <text x="127" y="819" font-size="11" fill="#334155" text-anchor="middle">{name}.canvaspilot, images, styles</text>
    <rect x="255" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="362" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">settings.json, styles</text>
    <text x="362" y="819" font-size="11" fill="#334155" text-anchor="middle">%APPDATA%\CanvasPilot</text>
    <rect x="490" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="597" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Log files</text>
    <text x="597" y="819" font-size="11" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\CanvasPilot\logs</text>
    <rect x="725" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="832" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Speech model store</text>
    <text x="832" y="819" font-size="10" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\DemaConsulting.Speech</text>
    <rect x="20" y="844" width="300" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="170" y="865" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Chat history (text only, per project)</text>
    <text x="170" y="883" font-size="10" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\CanvasPilot\history\{key}</text>
    <rect x="340" y="844" width="300" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="490" y="865" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Copilot runtime data</text>
    <text x="490" y="883" font-size="10" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\CanvasPilot\copilot</text>
  </g>
  </g>
</svg>
