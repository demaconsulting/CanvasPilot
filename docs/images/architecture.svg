<svg xmlns="http://www.w3.org/2000/svg" width="960" height="600" viewBox="0 0 960 600" font-family="Segoe UI, Arial, sans-serif">
  <title>CanvasPilot architecture</title>
  <desc>The Desktop head starts the Avalonia application. The library holds the AppShell subsystem, which builds and hosts the Project, Preview, Settings, and Speech subsystems, above the Logging and Utilities subsystems. Preview follows the Project explorer, and Speech adds a page to the Settings dialog. Third-party items and the local data the application reads and writes are shown below.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="956" height="596" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">CanvasPilot architecture</text>

  <!-- Library container -->
  <rect x="20" y="70" width="920" height="334" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="36" y="92" font-size="13" font-weight="600" fill="#1d4ed8">DemaConsulting.CanvasPilot (application library)</text>

  <!-- Desktop head -->
  <rect x="560" y="14" width="380" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="750" y="31" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">CanvasPilot.exe (Desktop head)</text>
  <text x="750" y="47" font-size="11" fill="#334155" text-anchor="middle">starts the Avalonia application</text>
  <line x1="750" y1="54" x2="750" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- AppShell -->
  <rect x="40" y="104" width="880" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="127" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">AppShell</text>
  <text x="480" y="147" font-size="12" fill="#166534" text-anchor="middle">MainWindowShell, ProjectWorkspace, AboutDialog, and the composition root that builds every unit</text>

  <!-- Arrows from AppShell to the four subsystems -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="142" y1="168" x2="142" y2="196"/>
    <line x1="369" y1="168" x2="369" y2="196"/>
    <line x1="596" y1="168" x2="596" y2="196"/>
    <line x1="823" y1="168" x2="823" y2="196"/>
  </g>

  <!-- Project -->
  <rect x="40" y="196" width="205" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="142" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Project</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="142" y="240">ProjectService</text>
    <text x="142" y="255">RecentProjects</text>
    <text x="142" y="270">NewProjectDialog</text>
    <text x="142" y="285">ProjectExplorer</text>
  </g>

  <!-- Preview -->
  <rect x="267" y="196" width="205" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="369" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Preview</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="369" y="240">ImageRenderService</text>
    <text x="369" y="255">PreviewPane</text>
    <text x="369" y="270">ImageExporter</text>
  </g>

  <!-- Settings -->
  <rect x="494" y="196" width="205" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="596" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Settings</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="596" y="240">SettingsService</text>
    <text x="596" y="255">SettingsDialog</text>
    <text x="596" y="270">AiProviderSettingsPage</text>
  </g>

  <!-- Speech -->
  <rect x="721" y="196" width="205" height="112" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="823" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Speech</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="823" y="238">AudioDeviceService</text>
    <text x="823" y="252">SpeechModelService</text>
    <text x="823" y="266">DeviceSelection, ModelCatalogPanel</text>
    <text x="823" y="280">ModelParameterEditor</text>
    <text x="823" y="294">SpeechSettingsPage</text>
  </g>

  <!-- Dependencies between neighbors: Preview follows the Project explorer, Speech contributes a Settings page -->
  <line x1="267" y1="300" x2="245" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>
  <line x1="721" y1="300" x2="699" y2="300" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <text x="480" y="328" font-size="11" fill="#334155" text-anchor="middle">Every subsystem above logs through Logging; Project, Settings, and Logging resolve file paths through Utilities.</text>

  <!-- Logging and Utilities -->
  <rect x="40" y="340" width="430" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="362" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Logging</text>
  <text x="255" y="380" font-size="11" fill="#1e40af" text-anchor="middle">RollingFileLogger: local rolling log files</text>
  <rect x="490" y="340" width="430" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="705" y="362" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Utilities</text>
  <text x="705" y="380" font-size="11" fill="#1e40af" text-anchor="middle">PathHelpers: safe path combination</text>

  <!-- Third-party items -->
  <text x="24" y="430" font-size="13" font-weight="600" fill="#0f172a">Third-party (OTS) items used by the library</text>
  <g>
    <rect x="20" y="440" width="215" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="127" y="462" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Avalonia</text>
    <text x="127" y="480" font-size="11" fill="#92400e" text-anchor="middle">windows, menus, dialogs, bitmaps</text>
    <rect x="255" y="440" width="215" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="362" y="462" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">CommunityToolkit.Mvvm</text>
    <text x="362" y="480" font-size="11" fill="#92400e" text-anchor="middle">view model source generators</text>
    <rect x="490" y="440" width="215" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="597" y="462" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">CanvasNet</text>
    <text x="597" y="480" font-size="11" fill="#92400e" text-anchor="middle">draws image files (Preview, Project)</text>
    <rect x="725" y="440" width="215" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="832" y="462" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">DemaConsulting.Speech</text>
    <text x="832" y="480" font-size="11" fill="#92400e" text-anchor="middle">audio devices and speech models</text>
  </g>

  <!-- Local data -->
  <text x="24" y="524" font-size="13" font-weight="600" fill="#0f172a">Local data read and written by the application</text>
  <g>
    <rect x="20" y="534" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="127" y="555" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Project folder</text>
    <text x="127" y="573" font-size="11" fill="#334155" text-anchor="middle">{name}.canvaspilot, image files</text>
    <rect x="255" y="534" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="362" y="555" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">settings.json</text>
    <text x="362" y="573" font-size="11" fill="#334155" text-anchor="middle">%APPDATA%\CanvasPilot</text>
    <rect x="490" y="534" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="597" y="555" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Log files</text>
    <text x="597" y="573" font-size="11" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\CanvasPilot\logs</text>
    <rect x="725" y="534" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="832" y="555" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Speech model store</text>
    <text x="832" y="573" font-size="10" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\DemaConsulting.Speech</text>
  </g>
</svg>
