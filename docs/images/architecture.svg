<svg xmlns="http://www.w3.org/2000/svg" width="960" height="844" viewBox="0 0 960 844" font-family="Segoe UI, Arial, sans-serif">
  <title>CanvasPilot architecture</title>
  <desc>The Desktop head starts the Avalonia application. The library holds the AppShell subsystem, which builds and hosts the other eleven subsystems: Chat, Composer, Payload, and Annotation for the conversation, Project, Preview, Settings, and Speech for the files, the picture, and the choices, and Knowledge, the drawing guide of cards with its browser. Chat uses Composer, Payload, Annotation, and Speech; Payload and Annotation read the pictures of Preview; Preview follows the Project explorer, and Speech adds a page to the Settings dialog. Every subsystem logs through Logging, and the subsystems that build file locations use Utilities. Third-party items and the local data the application reads and writes are shown below.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="956" height="840" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>

  <text x="24" y="36" font-size="20" font-weight="700" fill="#0f172a">CanvasPilot architecture</text>

  <!-- Library container -->
  <rect x="20" y="70" width="920" height="576" rx="14" fill="#f8fafc" stroke="#2563eb" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="36" y="92" font-size="13" font-weight="600" fill="#1d4ed8">DemaConsulting.CanvasPilot (application library)</text>

  <!-- Desktop head -->
  <rect x="560" y="14" width="380" height="40" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
  <text x="750" y="31" font-size="13" font-weight="600" fill="#0f172a" text-anchor="middle">CanvasPilot.exe (Desktop head)</text>
  <text x="750" y="47" font-size="11" fill="#334155" text-anchor="middle">starts the Avalonia application</text>
  <line x1="750" y1="54" x2="750" y2="104" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- AppShell -->
  <rect x="40" y="104" width="880" height="64" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <text x="480" y="127" font-size="15" font-weight="700" fill="#166534" text-anchor="middle">AppShell</text>
  <text x="480" y="147" font-size="12" fill="#166534" text-anchor="middle">MainWindowShell, ProjectWorkspace, AboutDialog, and the composition root that builds and hosts every subsystem below</text>

  <!-- Arrows from AppShell to the subsystems -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="142" y1="168" x2="142" y2="196"/>
    <line x1="369" y1="168" x2="369" y2="196"/>
    <line x1="596" y1="168" x2="596" y2="196"/>
    <line x1="823" y1="168" x2="823" y2="196"/>
  </g>

  <!-- Row 1: the conversation. Chat -->
  <rect x="40" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="142" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Chat</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="142" y="240">ChatPanel</text>
    <text x="142" y="255">PayloadInspector</text>
  </g>

  <!-- Composer -->
  <rect x="267" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="369" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Composer</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="369" y="238">ComposerDocument, ComposerHistory</text>
    <text x="369" y="252">AttachmentIntake, AttachmentStore</text>
    <text x="369" y="266">ComposerViewModel, ComposerEditor</text>
  </g>

  <!-- Payload -->
  <rect x="494" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="596" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Payload</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="596" y="240">MessagePayload, PayloadBuilder</text>
    <text x="596" y="255">MarkImageComposer</text>
    <text x="596" y="270">PayloadDescriber</text>
  </g>

  <!-- Annotation -->
  <rect x="721" y="196" width="205" height="88" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="823" y="220" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Annotation</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="823" y="240">MarkRegistry</text>
    <text x="823" y="255">MarkSourceResolver</text>
    <text x="823" y="270">AnnotationOverlay</text>
  </g>

  <!-- Dependencies between neighbors: Chat uses Composer, Payload uses Composer and Annotation -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="245" y1="240" x2="267" y2="240"/>
    <line x1="494" y1="240" x2="472" y2="240"/>
    <line x1="699" y1="240" x2="721" y2="240"/>
  </g>

  <!-- Row 2: files, the picture, and the choices. Project -->
  <rect x="40" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="142" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Project</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="142" y="348">ProjectService</text>
    <text x="142" y="363">RecentProjects</text>
    <text x="142" y="378">NewProjectDialog</text>
    <text x="142" y="393">ProjectExplorer</text>
  </g>

  <!-- Preview -->
  <rect x="267" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="369" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Preview</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="369" y="348">ImageRenderService</text>
    <text x="369" y="363">PreviewPane</text>
    <text x="369" y="378">ImageExporter</text>
    <text x="369" y="393">ImageDragSource</text>
  </g>

  <!-- Settings -->
  <rect x="494" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="596" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Settings</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="596" y="348">SettingsService</text>
    <text x="596" y="363">SettingsDialog</text>
    <text x="596" y="378">AiProviderSettingsPage</text>
  </g>

  <!-- Speech -->
  <rect x="721" y="302" width="205" height="124" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="823" y="326" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Speech</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="823" y="345">AudioDeviceService</text>
    <text x="823" y="359">SpeechModelService</text>
    <text x="823" y="373">DictationService</text>
    <text x="823" y="387">DeviceSelection, ModelCatalogPanel</text>
    <text x="823" y="401">ModelParameterEditor</text>
    <text x="823" y="415">SpeechSettingsPage</text>
  </g>

  <!-- Dependencies between neighbors: Preview follows the Project explorer, Speech contributes a Settings page -->
  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="267" y1="364" x2="245" y2="364"/>
    <line x1="721" y1="364" x2="699" y2="364"/>
  </g>

  <!-- Notes on the dependencies that are not between neighbors -->
  <g font-size="11" fill="#334155" text-anchor="middle">
    <text x="480" y="450">Chat also uses Annotation, Payload, and Speech; Annotation and Payload read the pictures of Preview.</text>
    <text x="480" y="466">Every subsystem logs through Logging, and the subsystems that build file locations use Utilities.</text>
  </g>

  <!-- Row 3: the drawing knowledge. Knowledge -->
  <rect x="40" y="480" width="880" height="74" rx="10" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <text x="480" y="503" font-size="14" font-weight="700" fill="#4c1d95" text-anchor="middle">Knowledge</text>
  <g font-size="11" fill="#5b21b6" text-anchor="middle">
    <text x="480" y="522">KnowledgeCatalog, KnowledgeSearch, KnowledgePromptBuilder, KnowledgeTools, KnowledgeSkills, KnowledgeMarkdown</text>
    <text x="480" y="538">KnowledgeBrowser (the Help &gt; Drawing Knowledge window); no language model is referenced</text>
  </g>

  <!-- Knowledge logs through Logging -->
  <line x1="255" y1="554" x2="255" y2="578" stroke="#475569" stroke-width="2" marker-end="url(#a)"/>

  <!-- Logging and Utilities -->
  <rect x="40" y="578" width="430" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="255" y="600" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Logging</text>
  <text x="255" y="618" font-size="11" fill="#1e40af" text-anchor="middle">RollingFileLogger: local rolling log files</text>
  <rect x="490" y="578" width="430" height="50" rx="10" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <text x="705" y="600" font-size="14" font-weight="700" fill="#1e3a8a" text-anchor="middle">Utilities</text>
  <text x="705" y="618" font-size="11" fill="#1e40af" text-anchor="middle">PathHelpers: safe path combination</text>

  <!-- Third-party items -->
  <text x="24" y="676" font-size="13" font-weight="600" fill="#0f172a">Third-party (OTS) items used by the library</text>
  <g>
    <rect x="20" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="104" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">Avalonia</text>
    <text x="104" y="726" font-size="11" fill="#92400e" text-anchor="middle">windows, menus, dialogs</text>
    <rect x="198" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="282" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">AvaloniaEdit</text>
    <text x="282" y="726" font-size="11" fill="#92400e" text-anchor="middle">the message editor</text>
    <rect x="376" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="460" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">CommunityToolkit.Mvvm</text>
    <text x="460" y="726" font-size="11" fill="#92400e" text-anchor="middle">view model generators</text>
    <rect x="554" y="686" width="168" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="638" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">CanvasNet</text>
    <text x="638" y="726" font-size="11" fill="#92400e" text-anchor="middle">draws files, help cards</text>
    <rect x="732" y="686" width="208" height="58" rx="10" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
    <text x="836" y="708" font-size="13" font-weight="700" fill="#92400e" text-anchor="middle">DemaConsulting.Speech</text>
    <text x="836" y="726" font-size="11" fill="#92400e" text-anchor="middle">audio devices and speech models</text>
  </g>

  <!-- Local data -->
  <text x="24" y="770" font-size="13" font-weight="600" fill="#0f172a">Local data read and written by the application</text>
  <g>
    <rect x="20" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="127" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Project folder</text>
    <text x="127" y="819" font-size="11" fill="#334155" text-anchor="middle">{name}.canvaspilot, image files</text>
    <rect x="255" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="362" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">settings.json</text>
    <text x="362" y="819" font-size="11" fill="#334155" text-anchor="middle">%APPDATA%\CanvasPilot</text>
    <rect x="490" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="597" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Log files</text>
    <text x="597" y="819" font-size="11" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\CanvasPilot\logs</text>
    <rect x="725" y="780" width="215" height="52" rx="10" fill="#f1f5f9" stroke="#64748b" stroke-width="2"/>
    <text x="832" y="801" font-size="12" font-weight="700" fill="#0f172a" text-anchor="middle">Speech model store</text>
    <text x="832" y="819" font-size="10" fill="#334155" text-anchor="middle">%LOCALAPPDATA%\DemaConsulting.Speech</text>
  </g>
</svg>
