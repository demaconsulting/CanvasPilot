<svg xmlns="http://www.w3.org/2000/svg" width="1076" height="330" viewBox="0 0 1076 330" font-family="Segoe UI, Arial, sans-serif">
  <title>CanvasPilot workflow</title>
  <desc>The user creates or opens a project folder, puts image source files in it, selects a file to see its preview with any notes or errors, and exports it as a PNG file or copies it to the clipboard for use in email and presentations. An AI chat assistant is planned for a later version.</desc>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#475569"/>
    </marker>
  </defs>
  <rect x="2" y="2" width="1072" height="326" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <text x="28" y="40" font-size="20" font-weight="700" fill="#0f172a">From a project to a picture you can use</text>

  <!-- Step 1 -->
  <rect x="28" y="64" width="224" height="150" rx="12" fill="#dcfce7" stroke="#16a34a" stroke-width="2"/>
  <circle cx="58" cy="94" r="14" fill="#16a34a"/>
  <text x="58" y="99" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
  <text x="82" y="99" font-size="15" font-weight="700" fill="#166534">Create or open</text>
  <g font-size="12" fill="#166534">
    <text x="44" y="130">File &gt; New Project... makes a</text>
    <text x="44" y="148">folder with a .canvaspilot file.</text>
    <text x="44" y="172">File &gt; Open Project... or</text>
    <text x="44" y="190">Recent Projects returns to one.</text>
  </g>

  <!-- Step 2 -->
  <rect x="284" y="64" width="224" height="150" rx="12" fill="#ede9fe" stroke="#7c3aed" stroke-width="2"/>
  <circle cx="314" cy="94" r="14" fill="#7c3aed"/>
  <text x="314" y="99" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
  <text x="338" y="99" font-size="15" font-weight="700" fill="#4c1d95">Add image sources</text>
  <g font-size="12" fill="#4c1d95">
    <text x="300" y="130">Put SVG, Mermaid, Vega-Lite,</text>
    <text x="300" y="148">OpenSCAD, and other files in</text>
    <text x="300" y="166">the project folder, with any</text>
    <text x="300" y="184">editor. The explorer lists them.</text>
  </g>

  <!-- Step 3 -->
  <rect x="540" y="64" width="224" height="150" rx="12" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
  <circle cx="570" cy="94" r="14" fill="#2563eb"/>
  <text x="570" y="99" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
  <text x="594" y="99" font-size="15" font-weight="700" fill="#1e3a8a">Preview</text>
  <g font-size="12" fill="#1e3a8a">
    <text x="556" y="130">Select a file to see its picture.</text>
    <text x="556" y="148">It redraws when files change.</text>
    <text x="556" y="172">Notes and errors, with a hint,</text>
    <text x="556" y="190">appear below the picture.</text>
  </g>

  <!-- Step 4 -->
  <rect x="796" y="64" width="252" height="150" rx="12" fill="#fef3c7" stroke="#d97706" stroke-width="2"/>
  <circle cx="826" cy="94" r="14" fill="#d97706"/>
  <text x="826" y="99" font-size="14" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
  <text x="850" y="99" font-size="15" font-weight="700" fill="#92400e">Export or copy</text>
  <g font-size="12" fill="#92400e">
    <text x="812" y="130">Image &gt; Export as PNG... saves</text>
    <text x="812" y="148">a file. Image &gt; Copy Image</text>
    <text x="812" y="172">puts the picture on the</text>
    <text x="812" y="190">clipboard for email or slides.</text>
  </g>

  <g stroke="#475569" stroke-width="2" marker-end="url(#a)">
    <line x1="252" y1="139" x2="282" y2="139"/>
    <line x1="508" y1="139" x2="538" y2="139"/>
    <line x1="764" y1="139" x2="794" y2="139"/>
  </g>

  <!-- Later increment -->
  <rect x="28" y="242" width="1020" height="62" rx="12" fill="#f1f5f9" stroke="#64748b" stroke-width="2" stroke-dasharray="8 5"/>
  <text x="48" y="268" font-size="14" font-weight="700" fill="#0f172a">Planned for a later version</text>
  <text x="48" y="288" font-size="12" fill="#334155">An AI chat assistant, by text or speech, that creates and edits the image source files for you. This version stores the provider and speech choices, but has no chat yet.</text>
</svg>
