---
# CanvasPilot System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the application to provide
# - These requirements capture the externally visible behavior of the complete system
# - System requirements are validated through system-level tests that compose real units
#   without opening a window
#
# NOTE: The system requirements cover operational logging, safe file handling, persisted user settings, AI provider
# and speech configuration, projects, image browsing and file management, preview and export, marking pictures,
# composing a message, dictating a message, the speech runtime in the installed application, the drawing knowledge,
# style kits, the desktop shell, the Windows installer, and application startup. The AI agent that will answer the
# messages is not covered.

sections:
  - title: CanvasPilot Requirements
    requirements:
      - id: CanvasPilot-System-OperationalLogging
        title: >-
          The application shall record operational events and failures to local log files that
          users can attach to bug reports.
        tags: [system]
        justification: |
          A desktop application has no console or server-side log to consult when something goes
          wrong. A bounded set of local log files gives users and maintainers the diagnostic
          evidence needed to troubleshoot problems without telemetry or unbounded disk growth.
        children:
          - CanvasPilot-Logging-PersistOperationalEvents
          - CanvasPilot-Logging-RetainRecentHistory
          - CanvasPilot-Logging-ConfinedLogFiles
        tests:
          - CanvasPilot_OperationalLogging_ApplicationEvent_WritesLocalLog

      - id: CanvasPilot-System-SafeFileHandling
        title: >-
          The application shall confine file locations built from caller-supplied names to their
          intended folders.
        tags: [system]
        justification: |
          The application builds file locations from names that originate outside the code, such as
          project names and file names. Rejecting traversal sequences and absolute paths prevents
          those names from reading or overwriting files outside the intended folder.
        children:
          - CanvasPilot-Utilities-SafePaths
        tests:
          - CanvasPilot_SafeFileHandling_TraversalName_IsRejected

      - id: CanvasPilot-System-PersistUserSettings
        title: >-
          The application shall remember the user's settings between runs, including the layout of its window and its
          theme, and shall keep working when the stored settings are damaged.
        tags: [system]
        justification: |
          Users expect to configure the application once. A settings file that is damaged, edited by
          hand, or written by another version must never stop the application from starting or the
          user from changing settings.
        children:
          - CanvasPilot-Settings-PersistUserSettings
          - CanvasPilot-Settings-ToleratePoorSettingsFiles
          - CanvasPilot-Settings-EditSettingsInDialog
          - CanvasPilot-Settings-RememberLayoutAndAppearance
        tests:
          - CanvasPilot_PersistUserSettings_SaveAndReload_RestoresSettingsAndToleratesDamage

      - id: CanvasPilot-System-ConfigureAiProvider
        title: >-
          The application shall let the user choose and store which AI provider, model, and reasoning level it uses, with
          a context window of 32768 tokens for settings that do not state one and the context window that the user stored
          kept as it is, warn about a small context window, not offer the unrestricted agent tools, and let the user check
          the connection to the provider before saving.
        tags: [system]
        justification: |
          The application's AI assistance can use different providers, and the choice, with its
          model and limits, belongs to the user. Storing the choices lets them be configured before
          the assistant is used, and a connection check shows at the dialog whether the choice works. Drawings with
          pictures and tools need a large context window, so a new installation starts with 32768 tokens; a smaller
          value that the user chose, or that an earlier build stored, is a deliberate choice and is not replaced. A
          choice that nothing acts on must not look like one that does, so it is not offered.
        children:
          - CanvasPilot-Settings-ConfigureAiProvider
        tests:
          - CanvasPilot_ConfigureAiProvider_DialogOk_StoresChoicesAndKeepsToolsOptIn
          - CanvasPilot_ConfigureAiProvider_FreshAndStoredContextWindow_UsesNewDefaultAndKeepsStoredValue
          - CanvasPilot_ReportProviderReadiness_CheckConnection_OllamaStubAndCopilotFakeMachine_ShowOneSentenceEach

      - id: CanvasPilot-System-ChooseModel
        title: >-
          The application shall let the user choose the model of the AI provider from the models that the provider offers,
          each with what it can do (tool calling, pictures, reasoning levels, context window) and a warning for what it
          lacks, shall let the user choose a reasoning level only among the levels that the chosen model offers, shall
          still let the user type a model name when the models cannot be listed, and shall refuse model settings that
          cannot work (a model that cannot call tools, or that is not offered, or a level that it does not offer) with the
          explanation of the provider before the first turn.
        tags: [system]
        justification: |
          Every drawing is made by calling tools, and a model that cannot see pictures cannot see the marks of the user or
          its own result, so the model matters more than anything else in the settings. Nobody remembers model ids, and
          the models and the levels that they offer differ from account to account and from model to model. Listing the
          models with what they can do, warning about what they lack, and offering only the levels that the model has
          lets the user choose well; checking the choice when the conversation starts turns a failure in the middle of a
          turn into a sentence that names what is supported. The typed name keeps the application usable when the provider
          cannot be asked.
        children:
          - CanvasPilot-Agent-ListModelsAndValidateSettings
          - CanvasPilot-OTS-AgentKit-ValidateModelSettings
          - CanvasPilot-OTS-AgentKit-DescribeOllamaModels
        tests:
          - CanvasPilot_ChooseModel_CopilotModelAndReasoningLevel_AreStoredAndReachTheAgent
          - CanvasPilot_ChooseModel_SettingsThatCannotWork_BannerSaysSoBeforeTheFirstTurn

      - id: CanvasPilot-System-ConfigureSpeech
        title: >-
          The application shall let the user choose and store the microphone, speakers, and speech models it
          uses, download the models with visible progress, and shall keep working on machines without audio
          hardware or network access.
        tags: [system]
        justification: |
          Conversation by speech needs devices and models that depend on the user's machine. Choosing them
          before speech is used lets the user set it up once, and the application must stay usable on machines
          that cannot use speech, so every problem is explained instead of causing a failure.
        children:
          - CanvasPilot-Speech-ConfigureSpeechSettings
          - CanvasPilot-Speech-DownloadSpeechModels
          - CanvasPilot-Speech-ToleratePoorMachines
        tests:
          - CanvasPilot_ConfigureSpeech_DialogOk_StoresChoicesAndRestoresThemNextRun

      - id: CanvasPilot-System-ManageProjects
        title: >-
          The application shall let the user create, open, save, and close projects, each a folder with
          a project file, and quickly reopen recently used projects.
        tags: [system]
        justification: |
          Users organize their drawings in projects. A project folder keeps a drawing's images and
          assets together where other tools can also reach them, and a list of recent projects gets
          the user back to their work with one choice. Problems such as an invalid name, a damaged
          file, or a file from a newer version must be explained rather than cause a failure.
        children:
          - CanvasPilot-Project-ManageProjectFiles
          - CanvasPilot-Project-CreateNewProject
          - CanvasPilot-Project-RememberRecentProjects
        tests:
          - CanvasPilot_ManageProjects_NewProject_CreatesReopensAndRemembersProject

      - id: CanvasPilot-System-BrowseProjectImages
        title: >-
          The application shall show the folders and the image source files of the open project as a tree, with a
          small picture for each file it draws, so the user can choose one to work on, keeping the tree current as files
          change.
        tags: [system]
        justification: |
          The user works on one image source file at a time, and needs to see which files the project
          holds, including files added or changed by other tools, without leaving the application. Projects keep their
          files in folders, and a small picture lets the user recognize a drawing before opening it.
        children:
          - CanvasPilot-Project-BrowseProjectImages
          - CanvasPilot-Project-ShowProjectFilesClearly
          - CanvasPilot-Project-ShowThumbnails
          - CanvasPilot-Preview-MakeThumbnails
        tests:
          - CanvasPilot_BrowseProjectImages_OpenProject_ListsImageSourceFiles

      - id: CanvasPilot-System-ManageProjectFiles
        title: >-
          The application shall let the user create files and folders in the open project, add pictures, PDF files, and
          drawings to it by copying or dropping them without replacing any file, and rename and delete the image
          source files of the project from the project explorer, ask for confirmation before deleting, and tell the user
          when a file cannot be created, renamed, or deleted.
        tags: [system]
        justification: |
          Users reorganize their drawings while working on them, and doing so without leaving the application
          keeps the project list correct. Starting a new drawing or bringing material into the project is part of that
          work, and it must never replace a file that is there. A deleted file cannot be recovered, so the user must
          confirm it, and a name that cannot be used or a file that is in use must be explained rather than silently
          ignored.
        children:
          - CanvasPilot-Project-ManageImageFiles
          - CanvasPilot-AppShell-ManageProjectFiles
          - CanvasPilot-Project-AddToTheProject
          - CanvasPilot-Utilities-FreeFileNames
        tests:
          - CanvasPilot_ManageProjectFiles_RenameAndDelete_UpdateFilesAndReportProblems
          - CanvasPilot_ManageProjectFiles_NewFileFolderAndAddedPicture_ShowInTheTreeAndReplaceNothing

      - id: CanvasPilot-System-PreviewImages
        title: >-
          The application shall show the picture of the image source file the user selects, fitted to the window or at a
          zoom from 25 to 400 percent, keep it matched to
          the file as the file and the files it uses change, and explain files that cannot be drawn.
        tags: [system]
        justification: |
          The user creates images by editing source files, so seeing each file's picture, up to date and
          without leaving the application, is the core of the main window. Files are often invalid while being
          edited, and the user needs to be told why instead of seeing a blank or stale picture.
        children:
          - CanvasPilot-Preview-RenderSelectedImage
          - CanvasPilot-Preview-ExplainRenderProblems
          - CanvasPilot-Preview-KeepPreviewCurrent
          - CanvasPilot-Preview-ZoomPicture
        tests:
          - CanvasPilot_PreviewImages_SelectedFile_ShowsRenderedPictureOrError

      - id: CanvasPilot-System-ExportImages
        title: >-
          The application shall let the user save the shown picture as a PNG file or copy it to the clipboard
          for use in other programs.
        tags: [system]
        justification: |
          The pictures are composed to be used in email, presentations, and other media, which take a PNG file
          or a pasted picture.
        children:
          - CanvasPilot-Preview-ExportImage
        tests:
          - CanvasPilot_ExportImages_RenderedSvg_WritesValidPngFile

      - id: CanvasPilot-System-BuildMessagePayload
        title: >-
          The application shall identify each picture that a chat message refers to by the file it was drawn from
          and by fingerprints of that file and of the picture's pixels, shall record where the diagram elements
          and model anchors are in the picture, and shall tell, for each mark on the picture, which parts of the
          source file lie under it, or that this kind of picture cannot say, so that the message is tied to exactly
          what the user saw and pointed at; and shall build from the message that is sent one complete payload for the
          assistant that cannot change afterwards: the text with the places of the marks and attachments in the order
          the user placed them, the attachments with where they are in the project, and for each marked picture the
          picture with the marks drawn and numbered on it, an image of the area around each mark, and the geometry and
          note of each mark in the pixels of the picture; and shall show the user, as text, exactly what the payload
          holds.
        tags: [system]
        justification: |
          A message about a picture is only useful if the reader knows which picture it means. Files change while
          the user works, so a name alone is not enough: the exact file contents and pixels, and where the parts of
          a diagram are, let a later reader tell which version of the picture was meant and which parts of the
          source the user pointed at. Pointing at pixels alone leaves the reader to guess which node or bar was
          meant, so the message names the parts under each mark where the picture knows them, and says plainly
          where it does not. The assistant receives everything the user meant in one place and in the order the user
          meant it; the pictures show what the user saw and where they pointed, so that the assistant need not guess
          from coordinates. The user goes on editing while the message is sent, so the payload must not change, and
          the user must be able to see exactly what was sent.
        children:
          - CanvasPilot-Preview-ReportPictureFacts
          - CanvasPilot-Annotation-FindSourceElements
          - CanvasPilot-Payload-DescribeTheMessage
          - CanvasPilot-Payload-IncludeAnnotatedImage
          - CanvasPilot-Payload-IncludeMarkCrops
          - CanvasPilot-Payload-IncludeMarkGeometry
          - CanvasPilot-Payload-IncludeSourceElements
          - CanvasPilot-Payload-ReferenceAttachments
          - CanvasPilot-Payload-BeImmutable
          - CanvasPilot-Payload-ListWhatIsSent
          - CanvasPilot-Chat-InspectPayload
        tests:
          - CanvasPilot_BuildMessagePayload_SelectedDiagram_PinsPictureToFileAndReportsElements
          - CanvasPilot_MarkImage_MarksOnShownPicture_AreNumberedAndStayOnTheirPicture
          - CanvasPilot_BuildMessagePayload_MermaidWithMarks_ContainsImagesCropsGeometryAndSourceElements
          - CanvasPilot_InspectPayload_SentMessageWithMark_InspectorShowsExactlyThePayload

      - id: CanvasPilot-System-MarkImage
        title: >-
          The application shall show the picture of the selected file with a layer over it, aligned with the
          picture's pixels at every zoom, on which the user draws numbered rectangle, ellipse, freehand, and arrow
          marks with the pointer or the keyboard, each with an optional short note and a chip in the message, clear all
          of them with one button, and shall
          keep each mark with the exact picture it was made on, so that a mark never moves to another picture and
          the marks of an earlier picture are not drawn on a later one.
        tags: [system]
        justification: |
          Users point at parts of a picture to say what they mean. For a mark to mean the same part of the
          picture whatever size the window has or whether the picture is shrunk to fit, the layer must follow
          the picture exactly. When the file is edited and a new picture is shown, a mark that stayed where it was
          would point at something else, so a mark belongs to the picture it was drawn on, and the numbers let the
          user and the assistant talk about marks one by one. The chip puts the mark in the message at the place
          where the user was writing, so one undo takes it back out.
        children:
          - CanvasPilot-Preview-HostOverlay
          - CanvasPilot-Annotation-KeepMarksOnTheirPicture
          - CanvasPilot-Annotation-NumberMarks
          - CanvasPilot-Annotation-DrawMarksOnPicture
          - CanvasPilot-Annotation-HideMarksOfOtherPictures
          - CanvasPilot-Chat-LinkMarksToChips
          - CanvasPilot-Annotation-ClearMarks
          - CanvasPilot-Composer-RemoveAllMarkChips
        tests:
          - CanvasPilot_MarkImage_ShownPicture_HasOverlayLayerThatSurvivesNewPictures
          - CanvasPilot_MarkImage_MarksOnShownPicture_AreNumberedAndStayOnTheirPicture
          - CanvasPilot_MarkImage_DrawRectangleOnShownPicture_AddsMarkChipAndHidesMarkOnNewPicture
          - CanvasPilot_MarkImage_DrawOnShownPicture_AddsNumberedChipPinnedToSnapshot
          - CanvasPilot_MarkImage_Rerender_DoesNotMoveMarks

      - id: CanvasPilot-System-ShowAndEditMarkNotes
        title: >-
          The application shall show the note of each mark of the message being written that is drawn on the shown
          picture beside the mark's number, on one line that is cut short with an ellipsis when it is long, shall show
          the whole note when the pointer rests on the mark or on its chip, and shall let the user change the note of
          such a mark with the pointer or the keyboard until the message is sent, so that the message that is sent
          carries each note as it was last changed, while the marks of messages that were sent keep their notes.
        tags: [system]
        justification: |
          A note that cannot be seen after it was typed is forgotten and cannot be checked before the message is
          sent, so the user sees each note with its mark, and the whole of a long note on request. A wrong note must
          be fixable without deleting the mark and drawing it again, which would also change its number. What was
          sent belongs to the conversation and is never changed afterwards.
        children:
          - CanvasPilot-Annotation-ShowMarkNotes
          - CanvasPilot-Annotation-EditMarkNotes
          - CanvasPilot-Composer-ShowMarkNoteOnChip
          - CanvasPilot-Composer-RequestMarkNoteEdit
          - CanvasPilot-Chat-EditMarkNotesFromChips
        tests:
          - CanvasPilot_MarkImage_EditNoteOfDraftMark_SentPayloadCarriesTheChangedNote
          - CanvasPilot_MarkImage_NoteOfSentMark_CannotBeChanged

      - id: CanvasPilot-System-DragImageOut
        title: >-
          The application shall let the user drag the shown picture out of the preview and drop it into another
          program, such as a presentation, a mail message, or a folder, as a PNG file and as a picture, and shall not
          leave the files it wrote for this behind after it ends.
        tags: [system]
        justification: |
          The pictures are composed to be used in email, presentations, and other media. Dragging a picture to where
          it is needed is the quickest way to use it, and files the application wrote for the purpose should not
          accumulate on the user's computer. Which programs take the file, the picture, or both is checked by hand,
          because it depends on those programs.
        children:
          - CanvasPilot-Preview-DragImageOut
        tests:
          - CanvasPilot_DragImageOut_ShownPicture_ProvidesPngFile

      - id: CanvasPilot-System-PictureMenu
        title: >-
          The application shall open a menu on the stage of the preview when the user right-clicks the shown picture or
          the stage around it, or presses Shift+F10 or the Menu key while the stage has the keyboard focus, whose Copy
          image and Export as PNG items do the same as Copy Image and Export as PNG in the Image menu, are unusable while
          no picture is shown, also after a render failed, and are named for screen readers; and shall not open the menu
          while a marking tool is chosen.
        tags: [system]
        justification: |
          In imaging tools, browsers, and viewers, right-clicking a picture and choosing Copy is the expected way to put it
          on the clipboard, so offering it where the picture is makes sharing quicker than the Image menu. Users of the
          keyboard and of screen readers need the same menu. Doing exactly what the Image menu does keeps one behavior for
          the picture. While a marking tool is chosen the pointer draws, and a menu that opened during a stroke would take
          the pointer away and throw the shape away.
        children:
          - CanvasPilot-Preview-PictureMenu
          - CanvasPilot-AppShell-PictureMenu
        tests:
          - CanvasPilot_PictureMenu_ShownPicture_CopiesAndExportsLikeTheImageMenuAndIsOffWhileMarking

      - id: CanvasPilot-System-ComposeMessage
        title: >-
          The application shall let the user compose a message to the assistant from typed text, dictated text, and
          things that are attached or pointed at, kept together in the order the user placed them, with the origin of
          each piece of text and the kind of each attachment kept, shall let the user send it, and shall show the
          messages that were sent in a transcript.
        tags: [system]
        justification: |
          Users explain a drawing with words and with things: a sentence they type, a sentence they say, a file they
          drop in, a spot on the picture they point at. The meaning of the message depends on where each of these is,
          and the assistant needs to know which words were dictated because speech recognition makes mistakes that
          typing does not. The user needs to see what has been said in the conversation, in the form it was composed.
        children:
          - CanvasPilot-Composer-HoldOrderedSegments
          - CanvasPilot-Composer-SendComposedMessage
          - CanvasPilot-Composer-WorkInsideAnOpenProject
          - CanvasPilot-Composer-ShowEditableMessage
          - CanvasPilot-Composer-ShowChipsInline
          - CanvasPilot-Composer-ExposeMessageToAssistiveTechnology
          - CanvasPilot-Chat-ShowTranscriptOfSentMessages
          - CanvasPilot-Chat-SendComposedMessage
          - CanvasPilot-AppShell-ChatColumn
          - CanvasPilot-AppShell-HostChat
        tests:
          - CanvasPilot_ComposeMessage_TextDictationAndChips_AreOneOrderedMessage
          - CanvasPilot_ComposeMessage_TypedAttachmentAndMark_SendsAndShowsInTranscript
          - CanvasPilot_InspectPayload_SentMessageWithMark_InspectorShowsExactlyThePayload

      - id: CanvasPilot-System-StopCopilotTurn
        title: >-
          The application shall let the user stop the AI copilot while it works on a message, keep the answer that was
          written until then and mark it as stopped, allow the next message to be written while the copilot works but not
          sent until the turn has ended or was stopped, and report a failed turn in the conversation with what to do
          about it, without ever failing the application.
        tags: [system]
        justification: |
          A model that is on a wrong path, or slow, costs the user time, so the user must be able to end the turn at once
          and still keep what was written. Only one turn runs at a time, so a second message must wait rather than fail
          late, and a provider that fails must leave the chat usable. The composer, the chat, and the turn logic each
          own a part of this and link to this requirement.
        children:
          - CanvasPilot-Composer-HoldSendWhileCopilotWorks
          - CanvasPilot-Chat-StopTheCopilotTurn

      - id: CanvasPilot-System-ShowCopilotProgress
        title: >-
          The application shall show, while the AI copilot works on a message, what the copilot is doing and how long the
          turn has lasted, with the tools that ran as rows and the file that is being written on one row with its size so
          far when the provider reports it, and a plain hint when nothing was heard for a long time, and shall show only what
          the provider really reports.
        tags: [system]
        justification: |
          A turn with a large drawing takes minutes, and a window that says nothing looks dead, so the user cannot decide
          whether to wait or to stop. Some models send a drawing only when it is whole, so the time that has passed is the
          one thing that is true for every model, and nothing is shown that the provider did not report.
        children:
          - CanvasPilot-Agent-ReportLiveProgress
          - CanvasPilot-Chat-ShowLiveStatus
        tests:
          - CanvasPilot_ShowCopilotProgress_TurnThatWaits_ShowsWhatTheCopilotDoesTheElapsedTimeAndTheToolThatRan

      - id: CanvasPilot-System-StopCopilotSafely
        title: >-
          The application shall let the user stop the AI copilot at any point of a turn, including in the middle of a tool
          call, show at once that the stop was heard, end the turn without waiting for a provider that does not react, and
          leave the conversation so that the next message is answered without the user starting over.
        tags: [system]
        justification: |
          A user stops a turn that is slow or on a wrong path and then writes the next message. A stop that hangs the
          window, or that leaves the conversation unusable, makes the application worse than closing and opening it again.
        children:
          - CanvasPilot-Agent-KeepConversationUsableAfterStop
          - CanvasPilot-Chat-ShowStopping
        tests:
          - CanvasPilot_StopCopilotSafely_StopInTheMiddleOfAToolCall_NextMessageIsAnsweredOnTheSameConversation

      - id: CanvasPilot-System-KeepCompletedTurnCompleted
        title: >-
          The application shall treat a turn that ended with its answer as completed and not as stopped, so that a failure of
          the next message is shown to the user in the conversation and is not hidden by a silent replacement of the
          conversation.
        tags: [system]
        justification: |
          A failure that is hidden is a failure that the user cannot report or work around. Only a turn that was really
          interrupted may have its next failure recovered, once and visibly.
        children:
          - CanvasPilot-Agent-TellCompletedTurnFromStoppedTurn
        tests:
          - CanvasPilot_KeepCompletedTurnCompleted_NextMessageFails_FailureIsShownAndNothingIsReplaced

      - id: CanvasPilot-System-DiagnoseCopilotTurns
        title: >-
          The application shall record for every turn of the AI copilot a log that says which turn ran on which model, how
          long it took, what each tool call did, who ended it, and what it used, without any word of the messages, the
          answers, or the files, and shall let the user open the folder of the log files from the Help menu.
        tags: [system]
        justification: |
          A turn of minutes that ends in a failure or a stop must be diagnosable from the log alone, and the log is a file
          that people attach to a bug report. The facts are the evidence; the words belong to the user, and the folder of
          the log is not one that a user can be expected to know.
        children:
          - CanvasPilot-Agent-LogTurns
          - CanvasPilot-AppShell-OpenLogFolder
        tests:
          - CanvasPilot_DiagnoseCopilotTurns_OpenLogFolder_ShowsTheFolderThatHoldsTheLogOfTheTurns
          - CanvasPilot_DiagnoseCopilotTurns_TurnWithWords_LogHoldsTheLifecycleAndNotTheWords

      - id: CanvasPilot-System-ShowCopilotCost
        title: >-
          The application shall show what a turn of the AI copilot used (the tokens, the multiplier of the model, and the
          time, with a note that a stopped turn may still count), and only what the provider reported, and shall warn where
          the reasoning level is chosen that a high level on a large model is slow and costly.
        tags: [system]
        justification: |
          A model such as Claude Opus counts many premium requests for one message, stopped or not, and a high reasoning
          level can take minutes for one drawing. The user can decide only if the cost is visible, where the choice is made
          and after the turn, without being nagged during it.
        children:
          - CanvasPilot-Agent-ReportTurnUsage
          - CanvasPilot-Chat-ShowTurnUsage
          - CanvasPilot-Settings-WarnAboutCostlyEffort
        tests:
          - CanvasPilot_ShowCopilotCost_TurnWithReportedUsage_CaptionUnderTheLastReplyHasOnlyWhatWasReported

      - id: CanvasPilot-System-KeepWindowButtonsClear
        title: >-
          The application shall offer no full-screen mode and shall keep the buttons that the system draws at the edge of the
          window clear of its menu, title, and pills, so that the window can always be minimized, maximized, restored, and
          closed.
        tags: [system]
        justification: |
          A window in full screen has no title bar and no buttons, and a title bar that lies under the buttons of the system
          hides them. A user who has lost the buttons has lost the window.
        children:
          - CanvasPilot-AppShell-KeepWindowButtonsClear
        tests:
          - MainWindowView_TitleBar_PillEndsClearOfTheWindowButtons
          - MainWindowView_TitleBarDecorations_AskForNoFullScreenButton

      - id: CanvasPilot-System-ChooseTalkKey
        title: >-
          The application shall let the user choose the key, or the chord of Ctrl, Alt, or Shift and a key, that is held to
          talk, with F9 as the default, shall refuse a key that would take away typing or that the system owns, shall keep the
          choice between runs, and shall name the key that is in effect wherever it tells the user how to talk.
        tags: [system]
        justification: |
          No key is free on every keyboard: the first default, F8, is swallowed by the function keys of many laptops, and
          other keys belong to the system or to other tools. The user must be able to choose a key that works for them
          without editing a file, and a hint that names a key that does not work is worse than none.
        children:
          - CanvasPilot-Speech-ChooseTalkKey
          - CanvasPilot-Settings-RememberTalkKey
        tests:
          - CanvasPilot_ChooseTalkKey_DefaultAndChosenKey_EveryHintNamesTheKeyInUse

      - id: CanvasPilot-System-SuggestNextPrompts
        title: >-
          The application shall offer example prompts that fit what the project has: ways to start while it has no drawing,
          ways to refine once it has one, the export only while a picture is shown, and none while the AI copilot works.
        tags: [system]
        justification: |
          A prompt that does not fit, such as asking for a legend in a project with no drawing, teaches the user that the
          suggestions mean nothing, and a prompt that is chosen while the copilot works could not be sent.
        children:
          - CanvasPilot-Chat-GuideNewConversation
        tests:
          - CanvasPilot_SuggestNextPrompts_ProjectWithoutAndWithADrawing_PromptsFollowWhatTheProjectHas

      - id: CanvasPilot-System-ShowHonestStatus
        title: >-
          The application shall say in its status bar only what is true: that the project file was saved, and when, only
          once it has been saved, and never a claim that the work is saved that it cannot back.
        tags: [system]
        justification: |
          A status that claims more than the application knows trains the user to ignore it, and a claim that work is saved
          can cost the user that work.
        children:
          - CanvasPilot-AppShell-ReportSaveHonestly
        tests:
          - CanvasPilot_ShowHonestStatus_ProjectSaved_StatusBarSaysWhenTheProjectFileWasSaved

      - id: CanvasPilot-System-UndoRedoMessage
        title: >-
          The application shall let the user undo and redo changes to the message being composed one action at a time,
          shall forget what can be undone when the message is sent, and shall not keep drafts after the application
          ends.
        tags: [system]
        justification: |
          Dropping many files or dictating a paragraph by mistake must be one undo away, while typing is undone
          character by character like in any editor. After a message is sent, undo must not bring it back, and a draft
          that was written to disk would leave the user's words and file names on the computer.
        children:
          - CanvasPilot-Composer-UndoRedoPerAction
          - CanvasPilot-Composer-ForgetDraftOnSend
          - CanvasPilot-Composer-EditWithUndoRedoTarget
          - CanvasPilot-AppShell-EditMenu
        tests:
          - CanvasPilot_UndoRedoMessage_StepsOfEachAction_UndoAndRedoOneAtATimeAndSendClears
          - CanvasPilot_UndoRedoMessage_EachActionKind_StepsAsSpecified

      - id: CanvasPilot-System-AttachToMessage
        title: >-
          The application shall let the user attach files, folders, and pictures to the message by dropping them,
          pasting them, or picking files with a button, shall treat everything that is attached strictly as data that is never opened or run, shall
          copy nothing into the project while the message is a draft, and shall copy the attachments into the project
          when the message is sent, within limits of size and number, without overwriting any file and without leaving
          a partial copy.
        tags: [system]
        justification: |
          Users explain a drawing with material: a sketch, a logo, a folder of photos, a screenshot. The assistant
          works on the project, so the material must be in it, but dropped material comes from outside the user's
          control and must never be given a chance to act, and a message that was never sent must leave nothing behind.
        children:
          - CanvasPilot-Composer-AcceptDroppedAndPastedContent
          - CanvasPilot-Composer-TreatContentAsData
          - CanvasPilot-Composer-StageAttachmentsAtSend
          - CanvasPilot-Chat-AttachFilesToMessage
        tests:
          - CanvasPilot_AttachToMessage_DroppedAndPastedContent_IsCopiedIntoProjectAtSend
          - CanvasPilot_AttachToMessage_DropFileFolderImage_CopiedIntoProjectOnlyAtSend
          - CanvasPilot_AttachToMessage_DroppedContent_IsNeverOpened

      - id: CanvasPilot-System-DictateMessage
        title: >-
          The application shall let the user dictate part of a message by holding a talk button or key: while it is
          held the application listens with the speech model and microphone chosen in the settings and shows the
          words as they are recognized, and when it is released the words are added to the message as one block of
          dictated text; when dictation cannot work, the application shall say why and what to do about it instead
          of failing.
        tags: [system]
        justification: |
          Speaking is quicker than typing for describing what is wrong with a picture, and the user's hands are often
          on the pointer while pointing at it. Showing the words as they come lets the user see at once that they are
          understood, and adding them as one block lets a mistake in a whole dictation be undone in one step. Speech
          depends on a downloaded model, a microphone, and files that the application ships, and any of them can be
          missing on a user's machine, so each case must say what to do. The talk button of the chat panel and the
          talk key of the main window call this capability.
        children:
          - CanvasPilot-Speech-DictateWhileHeld
          - CanvasPilot-Speech-ExplainDictationUnavailable
          - CanvasPilot-Composer-AddDictatedWordsAsOneBlock
          - CanvasPilot-Chat-HoldToTalk
          - CanvasPilot-AppShell-PushToTalkKey
          - CanvasPilot-AppShell-HostChat
        tests:
          - CanvasPilot_DictateMessage_HoldToTalk_AddsOneDictatedBlockAndExplainsWhenUnavailable
          - CanvasPilot_DictateMessage_HeldAndReleased_InsertsOneBlock
          - CanvasPilot_DictateMessage_NoModel_ExplainsAndKeepsDraft

      - id: CanvasPilot-System-SelfContainedSpeechRuntime
        title: >-
          The installed Windows application shall contain everything that is needed to run the speech model the user
          chooses, so that only the download of the model itself remains for the user to do.
        tags: [system]
        justification: |
          Users install the application with one installer and cannot be expected to find and install native speech
          libraries. A speech engine that is started without them can fail without an explanation or can even bring
          the whole application down, so the installed application must carry them and the delivery must be checked
          with every build.
        children:
          - CanvasPilot-Speech-ShipSpeechRuntime
        tests:
          - windows@Speech_NativeRuntimePublished

      - id: CanvasPilot-System-DesktopShell
        title: >-
          The application shall present a main window with a title bar that holds menus, the project name, and the style
          and AI provider pills, a welcome screen while no project is open, a workspace and a status bar while one is,
          and a window layout that it remembers, from which the user creates and opens projects, sees the project's
          image files, returns to recent projects, changes settings, and learns about the application.
        tags: [system]
        justification: |
          The main window is what the user sees and uses. Bringing the project, settings, and application
          information together under familiar menus, with the open project named in the title, lets a
          user work without knowing how the application is built. A start screen that offers the next step, a status
          bar that says what is shown, and a window that comes back as it was left make the first and every later
          start predictable.
        children:
          - CanvasPilot-AppShell-ProvideMainWindow
          - CanvasPilot-AppShell-HostProjectWorkspace
          - CanvasPilot-AppShell-ShowApplicationInformation
          - CanvasPilot-AppShell-ProvideTitleBar
          - CanvasPilot-AppShell-ShowStatusBar
          - CanvasPilot-AppShell-ShowWelcomeScreen
          - CanvasPilot-AppShell-RememberWindowLayout
        tests:
          - CanvasPilot_DesktopShell_CreateProject_ExplorerRecentProjectsAndSettingsRoundTrip

      - id: CanvasPilot-System-ThemedInterface
        title: >-
          The application shall present its windows in a dark or a light theme, as the operating system is unless the user
          chooses one in the settings, with one accent color, line icons that
          follow the text color, a visible mark of the keyboard focus, and text that is easy to read in both.
        tags: [system]
        justification: |
          People use the application for long stretches in rooms of every brightness. A dark and a light look that
          follow the system, with readable text and one consistent set of colors, make it comfortable to use and
          accessible to people with low vision.
        children:
          - CanvasPilot-AppShell-ProvideThemes
          - CanvasPilot-AppShell-ProvideIcons
          - CanvasPilot-AppShell-ShowKeyboardFocus
          - CanvasPilot-AppShell-ApplyThemeChoice
          - CanvasPilot-Settings-ChooseAppearance
          - CanvasPilot-Settings-ShowPagesWithHeadings
        tests:
          - CanvasPilot_Theme_ComposedWindowIsDarkInDarkAndLightInLight
          - CanvasPilot_Theme_ChoiceInSettingsDialogChangesTheWindowAndIsRemembered

      - id: CanvasPilot-System-AccessibleInterface
        title: >-
          The application shall be usable with the keyboard and a screen reader in every window: the menu has access
          keys, a button that shows only an icon has a name, a tooltip, and a target of at least 28 by 28 pixels, every
          field and list has a name, the shared button looks show the focus ring on the keyboard, and the text of
          notices, the amber button, and the welcome screen is readable.
        tags: [system]
        justification: |
          People who cannot use a pointer, or cannot see the screen or its colors well, must be able to reach, name,
          and use every control of the application. The check walks the windows of the composed application, in both
          theme variants, instead of trusting that each view was done with care.
        children:
          - CanvasPilot-AppShell-MakeWindowsAccessible
          - CanvasPilot-Chat-NameControls
          - CanvasPilot-Project-BeAccessible
          - CanvasPilot-Settings-BeUsableWithAssistiveTechnology
          - CanvasPilot-Speech-BeUsableWithAssistiveTechnology
          - CanvasPilot-Style-BeUsableWithAssistiveTechnology
          - CanvasPilot-Knowledge-BeUsableWithAssistiveTechnology
        tests:
          - Accessibility_Windows_ControlsHaveNamesTooltipsFocusAndSize
          - Accessibility_MainMenu_EveryEntryHasAUniqueAccessKey
          - Accessibility_ButtonThemes_TabKeyShowsTheFocusRingOnTheFocusedButtonOnly
          - Accessibility_Colors_NoticesAndWelcomeTextAreReadable

      - id: CanvasPilot-System-ShipThirdPartyNotices
        title: >-
          The installed application shall carry the license notices of the third-party material that is part of it but
          is not a library that the build restores.
        tags: [system]
        justification: |
          Material of other parties, such as the icons of the windows, is used under licenses that require the notice to
          go with every copy. Delivering the notice in the folder of the program meets that and lets the user see what
          the application contains.
        children:
          - CanvasPilot-AppShell-ShipThirdPartyNotices
        tests:
          - windows@ThirdPartyNotices_Published

      - id: CanvasPilot-System-WindowsInstaller
        title: >-
          The application shall be delivered for 64-bit Windows as one self-contained Windows Installer (MSI)
          package that installs it for all users, adds a Start Menu shortcut, closes a running instance, and
          replaces earlier versions in place.
        tags: [system]
        justification: |
          Users install a desktop application with the installer their organization already understands. One
          package that carries the application with its runtime, needs no separate setup, and upgrades in place
          lets users install and update without administrator knowledge of the application's parts.
        children:
          - CanvasPilot-OTS-WiX-BuildMsiPackage
        tests:
          - windows@Installer_SelfContained64BitPackage
          - windows@Installer_InstallsForAllUsers
          - windows@Installer_AddsStartMenuShortcut
          - windows@Installer_ClosesRunningApplication
          - windows@Installer_ReplacesAnyInstalledVersion

      - id: CanvasPilot-System-UseInstalledCopilotCli
        title: >-
          The application shall locate and check the GitHub Copilot CLI that the user installed, shall run that CLI,
          started once and shared, for the chat and the checks of GitHub Copilot, and shall not include or download the
          GitHub Copilot runtime in its installed files or in its build output, so that the only GitHub Copilot CLI that
          it can ever use is the one that the user installed.
        tags: [system]
        justification: |
          The GitHub Copilot CLI is a separate product that the user installs, updates, and signs in to. Shipping a
          copy of it, or downloading one when the application is built, would put about 180 MB of third-party code with
          its own updates and licensing into every installation. The libraries that the AI copilot is built on would
          bring such a runtime unless they are told not to, so the absence is checked on the published folder of every
          Windows build and, with the file table of the installer, in the package itself. The application finds the
          installed CLI by a documented rule that tells it from the launchers that editors put on the PATH, honors a
          path that the user sets, checks its version, and then runs exactly that CLI. The user signs in the way that the
          Copilot CLI offers (copilot, then /login), with the GitHub CLI, or with a token variable, and the application
          has no token field and no login screen of its own.
        children:
          - CanvasPilot-Agent-LocateCopilotCli
          - CanvasPilot-Agent-RunCopilotOnInstalledCli
          - CanvasPilot-OTS-AgentKit-NeverBundleCopilotRuntime
          - CanvasPilot-OTS-AgentKit-SignInWithCopilotCli
          - CanvasPilot-OTS-CopilotSdk-HonorExplicitCliPath
          - CanvasPilot-OTS-CopilotSdk-ReadCliPathFromConnectionEnvironment
          - CanvasPilot-OTS-CopilotSdk-DeclareSupportedCliVersion
        tests:
          - windows@Copilot_RuntimeNotPublished
          - CanvasPilot_UseInstalledCopilotCli_MachineWithShim_UsesInstalledCliAndHonorsStoredPath
          - CanvasPilot_ConverseWithCopilot_CopilotRuntimeOnInstalledCli_StreamsAnswerAndWritesDrawing

      - id: CanvasPilot-System-ConfineCopilotToProject
        title: >-
          The AI copilot shall act only through CanvasPilot's own tools, which are confined to the project folder, so
          that it can read and change only the files of the project, with the limits that the tools set: it writes only
          text image sources and small data files, and never the data folder of the application, the project file, or
          the style kits of the project.
        tags: [system]
        justification: |
          A language model that writes files is only as safe as the paths and sizes its tools allow. Offering the model
          nothing but tools that the application builds, and building them on one reliable decision about which paths
          are allowed, keeps the user's other files out of its reach. The units of the Agent subsystem add the tools
          and their own limits to this requirement; the confining library it rests on is verified as an OTS item.
        children:
          - CanvasPilot-Agent-ConfineToolsToProject
          - CanvasPilot-Agent-ConfineProjectFileTools
          - CanvasPilot-Agent-GiveTheAgentOnlyTheTools
          - CanvasPilot-OTS-AgentKit-ConfineToolPaths
          - CanvasPilot-OTS-AgentKit-ComposeToolPacks
          - CanvasPilot-OTS-AgentKit-BoundToolResults
        tests:
          - CanvasPilot_ConfineCopilotToProject_CreatedProject_ToolsAreTheApplicationsAndTheProjectFilesAreOutOfReach
          - CanvasPilot_ConfineCopilotToProject_ProjectTools_WriteReplaceAndDrawInsideTheProjectAndNothingElse

      - id: CanvasPilot-System-ConverseWithCopilot
        title: >-
          The application shall let the user converse with the AI provider that is configured, so that a message
          gets an answer that is shown while it is written, with the tool calls the answer needed, and the conversation
          can be stopped and continued.
        tags: [system]
        justification: |
          The reason for the application is to draw by talking. The libraries that stream the answer, run the tools,
          carry the pictures, and talk to the Ollama server are verified as OTS items; the units of the Agent and Chat
          subsystems add the behavior of the application on top of them and link to this requirement.
        children:
          - CanvasPilot-Agent-RunTurnAsEvents
          - CanvasPilot-Agent-WorkOnProjectFiles
          - CanvasPilot-Agent-InstructTheCopilot
          - CanvasPilot-Agent-GiveTheModelTheMessage
          - CanvasPilot-Agent-ReportTurnAsEvents
          - CanvasPilot-Agent-MakeTheAgentOfTheProvider
          - CanvasPilot-Agent-ConverseInProjectConversations
          - CanvasPilot-Chat-ShowCopilotConversation
          - CanvasPilot-Chat-HideConversation
          - CanvasPilot-AppShell-ComposeAiCopilot
          - CanvasPilot-OTS-AgentKit-RunToolTurnOnChatClient
          - CanvasPilot-OTS-AgentKit-SizeOllamaContext
          - CanvasPilot-OTS-AgentFramework-StreamAnswerPieces
          - CanvasPilot-OTS-AgentFramework-KeepConversationOnSession
          - CanvasPilot-OTS-AgentFramework-StopOnCancellation
          - CanvasPilot-OTS-ExtensionsAi-BindFunctionArguments
          - CanvasPilot-OTS-ExtensionsAi-RunFunctionsInInvocationLoop
          - CanvasPilot-OTS-ExtensionsAi-CarryPictureContent
          - CanvasPilot-OTS-ExtensionsAi-JoinStreamedUpdates
          - CanvasPilot-OTS-OllamaSharp-ListLocalModels
          - CanvasPilot-OTS-OllamaSharp-ReportMissingModel
          - CanvasPilot-OTS-OllamaSharp-StreamTextAndToolCalls
          - CanvasPilot-OTS-OllamaSharp-SendContextLength
        tests:
          - CanvasPilot_ConverseWithCopilot_ScriptedModel_StreamsAnswerWritesDrawingAndExplorerShowsIt
      - id: CanvasPilot-System-KeepAgentDataOutsideProject
        title: >-
          The application shall never write the data of the AI copilot into the project folder: the Copilot runtime keeps
          its files in a folder below the local data of the user that the application chooses, the chat history is kept
          on the user's computer and a history folder inside the project is refused, the log holds only facts
          about what happened and never the words of messages or the contents of files, and the project folder receives
          only the files that the user or the copilot is asked to create.
        tags: [system]
        justification: |
          A project folder is copied, shared, and put under source control, so anything of the application's own that
          landed in it would travel with it, and the words of a conversation are the user's to keep. The data of the
          Copilot runtime, the log, and the text that restores a conversation therefore live on the user's computer
          outside every project, and a configuration that would put them inside a project is refused. The one thing of
          the chat that the project folder does hold is the transient staging of a picture that was pasted and not sent
          yet, which belongs to the message being written and is removed when it is sent or discarded. The units that
          keep such data link to this requirement.
        children:
          - CanvasPilot-Agent-KeepRuntimeDataOutsideProject
          - CanvasPilot-Agent-LogMetadataOnly
          - CanvasPilot-Chat-KeepHistoryOutsideProject
        tests:
          - ChatSubsystem_KeepChatHistoryOnThisComputer_TurnSavedRestoredAndClearedOutsideTheProject
          - CanvasPilot_KeepChatHistoryOnThisComputer_ComposedApplication_HistoryIsUnderTheGivenRootAndClearRemovesIt

      - id: CanvasPilot-System-KeepChatHistoryOnThisComputer
        title: >-
          The application shall keep the words of the conversation of each project, and only the words, on the user's
          computer outside the project folder, shall show them again as text when the project is opened and give them to
          the AI copilot so that the conversation can go on, and shall let the user clear them with one button, which
          also makes the copilot forget the conversation.
        tags: [system]
        justification: |
          A conversation that is gone when the project is closed makes the copilot start over every day, but the words
          of a conversation are the user's own and a project folder is copied, shared, and put under source control.
          The history therefore lives on the user's computer, keyed by the place of the project file, holds no pictures
          or payloads, is bounded, and can be deleted by the user at any time. A project that is moved or renamed starts
          a fresh history, which the user guide says. The units that keep, show, and clear the history link to this
          requirement.
        children:
          - CanvasPilot-Chat-KeepChatHistoryOnThisComputer
          - CanvasPilot-Chat-ClearChatHistory
        tests:
          - ChatSubsystem_KeepChatHistoryOnThisComputer_TurnSavedRestoredAndClearedOutsideTheProject
          - CanvasPilot_KeepChatHistoryOnThisComputer_ComposedApplication_HistoryIsUnderTheGivenRootAndClearRemovesIt

      - id: CanvasPilot-System-ReportProviderReadiness
        title: >-
          The application shall tell the user, before the first message and when asked in the settings, whether the
          configured AI provider can be used: for GitHub Copilot whether the installed Copilot CLI was found (by a rule
          that rejects editor shims) and is new enough, whether the runtime starts on that CLI and is signed in (in
          whichever way the runtime finds: a token variable, the Copilot CLI, or the GitHub CLI), and whether the chosen
          model and reasoning level can be used (the model can call tools and accepts pictures), with the account and
          the kind of sign-in that Copilot uses named in the sentence of a Copilot that can be used and never a token, and
          for Ollama whether the server answers, has the model, and has a context window of at least 16,384 tokens, each
          as one sentence that says what to do.
        tags: [system]
        justification: |
          A chat that fails on the first message with an error of a library is a poor first experience. Both providers
          depend on things outside the application (a CLI and a sign-in, or a server and a model), so the application
          checks them itself and words the remedy, which for a Copilot that is not signed in is to run copilot and type
          /login. A machine can offer several accounts, so the sentence of a Copilot that can be used says which account
          and which kind of sign-in the agents use, in Check connection and in the tooltip of the provider pill. A small
          context window and a model that cannot see pictures are warnings and not blocks, because they are common but
          not certain causes of poor drawings.
        children:
          - CanvasPilot-Agent-DescribeReadiness
          - CanvasPilot-Agent-CheckProviderReadiness
          - CanvasPilot-Agent-ExplainUnavailableCopilot
          - CanvasPilot-Chat-ShowCopilotReadiness
          - CanvasPilot-AppShell-ShowProviderPill
        tests:
          - CanvasPilot_ReportProviderReadiness_CopilotAndOllamaMachines_GiveOneActionableSentenceEach
          - CanvasPilot_ReportProviderReadiness_CopilotNotSignedIn_BannerSaysHowToSignInAndSendDoesNotRunIt
          - CanvasPilot_ReportProviderReadiness_CheckConnection_OllamaStubAndCopilotFakeMachine_ShowOneSentenceEach
          - CanvasPilot_ReportProviderReadiness_CopilotSignedInWithCopilotCli_CheckConnectionAndPillTooltipNameTheAccountAndNoToken

      - id: CanvasPilot-System-StartApplication
        title: >-
          The application shall start on every supported platform by building its parts in dependency
          order, loading the stored settings, and recording its start and stop in the application log.
        tags: [system]
        justification: |
          An application that cannot start leaves the user with nothing. Building the parts the same way
          on every platform, in one place, makes the start checkable without a window, and the log
          records when it happened for anyone investigating a problem.
        children:
          - CanvasPilot-AppShell-ComposeApplication
        tests:
          - CanvasPilot_Startup_ComposeApplication_ProducesWorkingShell

      - id: CanvasPilot-System-ProvideDrawingKnowledge
        title: >-
          The application shall hold, in the program and without a network or an assistant, the knowledge of how to draw
          with the formats CanvasNet draws and how to work in a CanvasPilot project, as cards that can be looked up by
          name, searched by words, and written as text for a prompt of an assistant, without the cards about what the
          program that hosts CanvasNet controls, and without depending on any language model or agent library.
        tags: [system]
        justification: |
          A language model writes good drawing files only when it knows how the drawing library reads them, and the
          people who use the application want to read the same advice. Taking the cards from the drawing library keeps
          the advice as current as the library, and adding the application's own cards tells the copilot where files go
          and how to read the marks the user makes. The copilot may come from more than one
          provider, so the knowledge is kept apart from every provider and offered as plain values and text.
        children:
          - CanvasPilot-Knowledge-OfferDrawingCards
          - CanvasPilot-Knowledge-FindCards
          - CanvasPilot-Knowledge-BuildPromptParts
          - CanvasPilot-Knowledge-DescribeAgentTools
          - CanvasPilot-Knowledge-DescribeAgentSkills
        tests:
          - CanvasPilot_ProvideDrawingKnowledge_ComposedCatalog_IndexCardExampleAndSearchWork

      - id: CanvasPilot-System-BrowseDrawingKnowledge
        title: >-
          The application shall let the user open the drawing knowledge from the Help menu in a window that stays open
          beside the work, to browse the cards as a tree, search them, read a card with the cards below it and those
          related to it, and copy its examples.
        tags: [system]
        justification: |-
          The cards are written for the assistant, but they also explain how each format works, and a user who can read
          them can tell the assistant exactly what is wanted. A window that does not block the application lets the user
          read a card while working.
        children:
          - CanvasPilot-Knowledge-BrowseCards
          - CanvasPilot-AppShell-DrawingKnowledgeMenu
        tests:
          - CanvasPilot_BrowseDrawingKnowledge_HelpMenuCommand_ShowsBrowserOnTheCatalog

      - id: CanvasPilot-System-DefineStyleKits
        title: >-
          The application shall let the user describe how pictures should look as a style kit, with a palette of named
          colors, fonts, a line width, a corner radius, a spacing, a Mermaid theme, a Vega-Lite configuration, written
          advice, sizes to export at, and example images, kept as a file and a folder of examples that a person can read
          and edit, checked with a message for each wrong property, and found in the places that ship with the program,
          that the user keeps, that a project holds, and that a team shares, with the most local copy of a kit winning.
        tags: [system]
        justification: |
          A person or a team wants every picture to look the same: the same colors, the same type, the same sizes. A kit
          that is a plain file can be shared by a folder, kept with the project, reviewed, and fixed by hand, and a kit
          that reports exactly which value is wrong can be repaired without guessing. Kits come from more than one place,
          so which copy applies must be defined, and the copy that is nearest to the work must win, so that a project can
          freeze the style it was made with.
        children:
          - CanvasPilot-Style-DefineKits
          - CanvasPilot-Style-FindKitsInLocations
        tests:
          - CanvasPilot_DefineStyleKits_BuiltInUserProjectAndSharedKits_ResolveByPrecedence

      - id: CanvasPilot-System-ManageStyleKits
        title: >-
          The application shall let the user see the style kits it has found with a preview of each, create, duplicate,
          edit, and delete the kits of the user and of the project, copy a kit into the project, and import and export a
          kit as a zip file, in a window that stays open beside the work, without changing the kits that come with the
          program or that a team shares.
        tags: [system]
        justification: |
          A style is useful only when it is easy to see what there is, to try a kit, and to make a variation of it. Zip
          files let a kit travel by mail or a download, which means a file of unknown origin is opened, so the import must
          not write outside the place it was asked to write. The kits of the program and of a team are not the user's to
          change, so they are changed by making a copy.
        children:
          - CanvasPilot-Style-ManageKitsInWindow
          - CanvasPilot-Style-ExchangeKitsAsZipFiles
          - CanvasPilot-AppShell-OpenStyleKitsWindow
        tests:
          - CanvasPilot_ManageStyleKits_ShellCommandAndManager_CreateEditExportImportAndDelete

      - id: CanvasPilot-System-ChooseProjectStyle
        title: >-
          The application shall let the user choose the style kit of a project from the main window, keep the choice in
          the project file so that it is the same for everyone who opens the project, start a new project with the kit
          that the user chose as the default, and say so when the chosen kit cannot be found.
        tags: [system]
        justification: |
          The style belongs to the project, not to the machine, so the choice is kept with the project and a later change
          of the default does not move projects that exist. A project that names a kit that is not on this machine must
          not silently look different.
        children:
          - CanvasPilot-Style-ChooseActiveKit
          - CanvasPilot-AppShell-ChooseStyleInTitleBar
          - CanvasPilot-Project-KeepTheStyleChoice
          - CanvasPilot-Settings-KeepStyleSettings
        tests:
          - CanvasPilot_ChooseProjectStyle_PickerAndNewProject_KeepTheChoiceInTheProjectFile

      - id: CanvasPilot-System-ExportAtPresetSizes
        title: >-
          The application shall let the user export the shown picture as a PNG at a named size, from the sizes of the
          style kit of the project and from sizes of the application, with a background or transparency as the size says
          and with the resolution written into the file, as well as exactly as it is drawn.
        tags: [system]
        justification: |
          A picture is used on a slide, in an email, and on paper, each at its own size. Drawing the file again at the
          size, not stretching the shown picture, keeps the lines sharp, and the sizes that belong to the style are
          offered with it so that the user does not have to remember them.
        children:
          - CanvasPilot-Style-OfferExportPresets
          - CanvasPilot-Preview-ExportAtRequestedSize
        tests:
          - CanvasPilot_ExportAtPresetSizes_ComposedExporter_WritesPngOfThePresetSize

      - id: CanvasPilot-System-GuideAssistantStyle
        title: >-
          The application shall offer the style of the project to an assistant as a block of text of a known size and as
          two tools, one to read the style and one to check a picture of the project against it, as plain values and text
          that can be given to any provider of a language model, with the text of a kit marked as data and not as
          instructions, and without depending on any language model or agent library.
        tags: [system]
        justification: |
          An assistant that writes drawing files should use the colors and fonts of the project without being told every
          time, and should be able to check what it drew. The text of a kit may come from a shared folder or a zip file,
          so it must not be taken for an instruction, and its size must be bounded because it is paid for in every
          request. The copilot may come from more than one provider, so the parts are plain.
        children:
          - CanvasPilot-Style-GuideTheAssistant
        tests:
          - CanvasPilot_GuideAssistantStyle_ComposedParts_GuidanceCheckAndCardAgree

      - id: CanvasPilot-System-CheckPictureAgainstStyle
        title: >-
          The application shall let the user check the shown picture against the style kit of the project from the Image
          menu, and shall show which colors of the picture are on the palette, which are blended edges, and which are off
          the palette, with their share of the picture, in the notes of the preview.
        tags: [system]
        justification: |
          A style is only kept if departures from it can be seen. Telling the user which colors are off the palette, and how
          much of the picture they cover, turns a feeling that something is wrong into something that can be fixed, and an
          anti-aliased edge must not be taken for a departure.
        children:
          - CanvasPilot-Style-CheckPictures
          - CanvasPilot-Preview-ShowNotesOfOtherParts
          - CanvasPilot-AppShell-CheckAgainstStyleMenu
        tests:
          - CanvasPilot_CheckPictureAgainstStyle_ImageMenuCommand_ShowsNotesInTheDiagnosticsArea
