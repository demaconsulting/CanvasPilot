---
# CanvasPilot System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the application to provide
# - These requirements capture the externally visible behavior of the complete system
# - System requirements are validated through system-level tests that compose real units
#   without opening a window
#
# NOTE: The system requirements cover operational logging, safe file handling, persisted user settings, AI provider
# and speech configuration, projects, image browsing and file management, preview and export, the desktop shell, the
# Windows installer, and application startup. The AI chat is not yet covered.

sections:
  - title: CanvasPilot Requirements
    requirements:
      - id: CanvasPilot-System-OperationalLogging
        title: >-
          The application shall record operational events and failures to local log files that
          users can attach to bug reports.
        tags: [system]
        justification: |
          A desktop application has no console or server-side log to consult when something goes
          wrong. A bounded set of local log files gives users and maintainers the diagnostic
          evidence needed to troubleshoot problems without telemetry or unbounded disk growth.
        children:
          - CanvasPilot-Logging-PersistOperationalEvents
          - CanvasPilot-Logging-RetainRecentHistory
          - CanvasPilot-Logging-ConfinedLogFiles
        tests:
          - CanvasPilot_OperationalLogging_ApplicationEvent_WritesLocalLog

      - id: CanvasPilot-System-SafeFileHandling
        title: >-
          The application shall confine file locations built from caller-supplied names to their
          intended folders.
        tags: [system]
        justification: |
          The application builds file locations from names that originate outside the code, such as
          project names and file names. Rejecting traversal sequences and absolute paths prevents
          those names from reading or overwriting files outside the intended folder.
        children:
          - CanvasPilot-Utilities-SafePaths
        tests:
          - CanvasPilot_SafeFileHandling_TraversalName_IsRejected

      - id: CanvasPilot-System-PersistUserSettings
        title: >-
          The application shall remember the user's settings between runs and shall keep working when
          the stored settings are damaged.
        tags: [system]
        justification: |
          Users expect to configure the application once. A settings file that is damaged, edited by
          hand, or written by another version must never stop the application from starting or the
          user from changing settings.
        children:
          - CanvasPilot-Settings-PersistUserSettings
          - CanvasPilot-Settings-ToleratePoorSettingsFiles
          - CanvasPilot-Settings-EditSettingsInDialog
        tests:
          - CanvasPilot_PersistUserSettings_SaveAndReload_RestoresSettingsAndToleratesDamage

      - id: CanvasPilot-System-ConfigureAiProvider
        title: >-
          The application shall let the user choose and store which AI provider and model it uses,
          with unrestricted agent tools off unless the user opts in.
        tags: [system]
        justification: |
          The application's AI assistance can use different providers, and the choice, with its
          model and limits, belongs to the user. Storing the choices lets them be configured before
          the assistant is used, and the safe default for unrestricted tools protects the user's files.
        children:
          - CanvasPilot-Settings-ConfigureAiProvider
        tests:
          - CanvasPilot_ConfigureAiProvider_DialogOk_StoresChoicesAndKeepsToolsOptIn

      - id: CanvasPilot-System-ConfigureSpeech
        title: >-
          The application shall let the user choose and store the microphone, speakers, and speech models it
          uses, download the models with visible progress, and shall keep working on machines without audio
          hardware or network access.
        tags: [system]
        justification: |
          Conversation by speech needs devices and models that depend on the user's machine. Choosing them
          before speech is used lets the user set it up once, and the application must stay usable on machines
          that cannot use speech, so every problem is explained instead of causing a failure.
        children:
          - CanvasPilot-Speech-ConfigureSpeechSettings
          - CanvasPilot-Speech-DownloadSpeechModels
          - CanvasPilot-Speech-ToleratePoorMachines
        tests:
          - CanvasPilot_ConfigureSpeech_DialogOk_StoresChoicesAndRestoresThemNextRun

      - id: CanvasPilot-System-ManageProjects
        title: >-
          The application shall let the user create, open, save, and close projects, each a folder with
          a project file, and quickly reopen recently used projects.
        tags: [system]
        justification: |
          Users organize their drawings in projects. A project folder keeps a drawing's images and
          assets together where other tools can also reach them, and a list of recent projects gets
          the user back to their work with one choice. Problems such as an invalid name, a damaged
          file, or a file from a newer version must be explained rather than cause a failure.
        children:
          - CanvasPilot-Project-ManageProjectFiles
          - CanvasPilot-Project-CreateNewProject
          - CanvasPilot-Project-RememberRecentProjects
        tests:
          - CanvasPilot_ManageProjects_NewProject_CreatesReopensAndRemembersProject

      - id: CanvasPilot-System-BrowseProjectImages
        title: >-
          The application shall list the image source files of the open project so the user can choose
          one to work on, keeping the list current as files change.
        tags: [system]
        justification: |
          The user works on one image source file at a time, and needs to see which files the project
          holds, including files added or changed by other tools, without leaving the application.
        children:
          - CanvasPilot-Project-BrowseProjectImages
        tests:
          - CanvasPilot_BrowseProjectImages_OpenProject_ListsImageSourceFiles

      - id: CanvasPilot-System-ManageProjectFiles
        title: >-
          The application shall let the user rename and delete the image source files of the open project
          from the project explorer, ask for confirmation before deleting, and tell the user when a file
          cannot be renamed or deleted.
        tags: [system]
        justification: |
          Users reorganize their drawings while working on them, and doing so without leaving the application
          keeps the project list correct. A deleted file cannot be recovered, so the user must confirm it, and
          a name that cannot be used or a file that is in use must be explained rather than silently ignored.
        children:
          - CanvasPilot-Project-ManageImageFiles
          - CanvasPilot-AppShell-ManageProjectFiles
        tests:
          - CanvasPilot_ManageProjectFiles_RenameAndDelete_UpdateFilesAndReportProblems

      - id: CanvasPilot-System-PreviewImages
        title: >-
          The application shall show the picture of the image source file the user selects, keep it matched to
          the file as the file and the files it uses change, and explain files that cannot be drawn.
        tags: [system]
        justification: |
          The user creates images by editing source files, so seeing each file's picture, up to date and
          without leaving the application, is the core of the main window. Files are often invalid while being
          edited, and the user needs to be told why instead of seeing a blank or stale picture.
        children:
          - CanvasPilot-Preview-RenderSelectedImage
          - CanvasPilot-Preview-ExplainRenderProblems
          - CanvasPilot-Preview-KeepPreviewCurrent
        tests:
          - CanvasPilot_PreviewImages_SelectedFile_ShowsRenderedPictureOrError

      - id: CanvasPilot-System-ExportImages
        title: >-
          The application shall let the user save the shown picture as a PNG file or copy it to the clipboard
          for use in other programs.
        tags: [system]
        justification: |
          The pictures are composed to be used in email, presentations, and other media, which take a PNG file
          or a pasted picture.
        children:
          - CanvasPilot-Preview-ExportImage
        tests:
          - CanvasPilot_ExportImages_RenderedSvg_WritesValidPngFile

      - id: CanvasPilot-System-BuildMessagePayload
        title: >-
          The application shall identify each picture that a chat message refers to by the file it was drawn from
          and by fingerprints of that file and of the picture's pixels, and shall record where the diagram elements
          and model anchors are in the picture, so that the message is tied to exactly what the user saw.
        tags: [system]
        justification: |
          A message about a picture is only useful if the reader knows which picture it means. Files change while
          the user works, so a name alone is not enough: the exact file contents and pixels, and where the parts of
          a diagram are, let a later reader tell which version of the picture was meant and which parts of the
          source the user pointed at.
        children:
          - CanvasPilot-Preview-ReportPictureFacts
        tests:
          - CanvasPilot_BuildMessagePayload_SelectedDiagram_PinsPictureToFileAndReportsElements

      - id: CanvasPilot-System-MarkImage
        title: >-
          The application shall show the picture of the selected file with a layer over it, aligned with the
          picture's pixels at every zoom, on which the user's marks on the picture are placed.
        tags: [system]
        justification: |
          Users point at parts of a picture to say what they mean. For a mark to mean the same part of the
          picture whatever size the window has or whether the picture is shrunk to fit, the layer must follow
          the picture exactly. Later increments add the kinds of mark and how marks are kept with a message;
          this requirement states the part of the capability that exists.
        children:
          - CanvasPilot-Preview-HostOverlay
        tests:
          - CanvasPilot_MarkImage_ShownPicture_HasOverlayLayerThatSurvivesNewPictures

      - id: CanvasPilot-System-DesktopShell
        title: >-
          The application shall present a main window with menus from which the user creates and opens
          projects, sees the project's image files, returns to recent projects, changes settings, and
          learns about the application.
        tags: [system]
        justification: |
          The main window is what the user sees and uses. Bringing the project, settings, and application
          information together under familiar menus, with the open project named in the title, lets a
          user work without knowing how the application is built.
        children:
          - CanvasPilot-AppShell-ProvideMainWindow
          - CanvasPilot-AppShell-HostProjectWorkspace
          - CanvasPilot-AppShell-ShowApplicationInformation
        tests:
          - CanvasPilot_DesktopShell_CreateProject_ExplorerRecentProjectsAndSettingsRoundTrip

      - id: CanvasPilot-System-WindowsInstaller
        title: >-
          The application shall be delivered for 64-bit Windows as one self-contained Windows Installer (MSI)
          package that installs it for all users, adds a Start Menu shortcut, closes a running instance, and
          replaces earlier versions in place.
        tags: [system]
        justification: |
          Users install a desktop application with the installer their organization already understands. One
          package that carries the application with its runtime, needs no separate setup, and upgrades in place
          lets users install and update without administrator knowledge of the application's parts.
        children:
          - CanvasPilot-OTS-WiX-BuildMsiPackage
        tests:
          - WiX_MsiPackage

      - id: CanvasPilot-System-StartApplication
        title: >-
          The application shall start on every supported platform by building its parts in dependency
          order, loading the stored settings, and recording its start and stop in the application log.
        tags: [system]
        justification: |
          An application that cannot start leaves the user with nothing. Building the parts the same way
          on every platform, in one place, makes the start checkable without a window, and the log
          records when it happened for anyone investigating a problem.
        children:
          - CanvasPilot-AppShell-ComposeApplication
        tests:
          - CanvasPilot_Startup_ComposeApplication_ProducesWorkingShell
