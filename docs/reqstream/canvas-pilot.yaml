---
# CanvasPilot System-Level Requirements
#
# PURPOSE:
# - Define system-level requirements describing what end-users need the application to provide
# - These requirements capture the externally visible behavior of the complete system
# - System requirements are validated through system-level tests that compose real units
#   without opening a window
#
# NOTE: This file currently covers only the capabilities delivered so far (operational logging,
# safe file handling, persisted user settings, AI provider configuration, projects, the desktop shell, and
# application startup). Additional system requirements are added as further subsystems are introduced.

sections:
  - title: CanvasPilot Requirements
    requirements:
      - id: CanvasPilot-System-OperationalLogging
        title: >-
          The application shall record operational events and failures to local log files that
          users can attach to bug reports.
        tags: [system]
        justification: |
          A desktop application has no console or server-side log to consult when something goes
          wrong. A bounded set of local log files gives users and maintainers the diagnostic
          evidence needed to troubleshoot problems without telemetry or unbounded disk growth.
        children:
          - CanvasPilot-Logging-PersistOperationalEvents
          - CanvasPilot-Logging-RetainRecentHistory
          - CanvasPilot-Logging-ConfinedLogFiles
        tests:
          - CanvasPilot_OperationalLogging_ApplicationEvent_WritesLocalLog

      - id: CanvasPilot-System-SafeFileHandling
        title: >-
          The application shall confine file locations built from caller-supplied names to their
          intended folders.
        tags: [system]
        justification: |
          The application builds file locations from names that originate outside the code, such as
          project names and file names. Rejecting traversal sequences and absolute paths prevents
          those names from reading or overwriting files outside the intended folder.
        children:
          - CanvasPilot-Utilities-SafePaths
        tests:
          - CanvasPilot_SafeFileHandling_TraversalName_IsRejected

      - id: CanvasPilot-System-PersistUserSettings
        title: >-
          The application shall remember the user's settings between runs and shall keep working when
          the stored settings are damaged.
        tags: [system]
        justification: |
          Users expect to configure the application once. A settings file that is damaged, edited by
          hand, or written by another version must never stop the application from starting or the
          user from changing settings.
        children:
          - CanvasPilot-Settings-PersistUserSettings
          - CanvasPilot-Settings-ToleratePoorSettingsFiles
          - CanvasPilot-Settings-EditSettingsInDialog
        tests:
          - CanvasPilot_PersistUserSettings_SaveAndReload_RestoresSettingsAndToleratesDamage

      - id: CanvasPilot-System-ConfigureAiProvider
        title: >-
          The application shall let the user choose and store which AI provider and model it uses,
          with unrestricted agent tools off unless the user opts in.
        tags: [system]
        justification: |
          The application's AI assistance can use different providers, and the choice, with its
          model and limits, belongs to the user. Storing the choices lets them be configured before
          the assistant is used, and the safe default for unrestricted tools protects the user's files.
        children:
          - CanvasPilot-Settings-ConfigureAiProvider
        tests:
          - CanvasPilot_ConfigureAiProvider_DialogOk_StoresChoicesAndKeepsToolsOptIn

      - id: CanvasPilot-System-ManageProjects
        title: >-
          The application shall let the user create, open, save, and close projects, each a folder with
          a project file, and quickly reopen recently used projects.
        tags: [system]
        justification: |
          Users organize their drawings in projects. A project folder keeps a drawing's images and
          assets together where other tools can also reach them, and a list of recent projects gets
          the user back to their work with one choice. Problems such as an invalid name, a damaged
          file, or a file from a newer version must be explained rather than cause a failure.
        children:
          - CanvasPilot-Project-ManageProjectFiles
          - CanvasPilot-Project-CreateNewProject
          - CanvasPilot-Project-RememberRecentProjects
        tests:
          - CanvasPilot_ManageProjects_NewProject_CreatesReopensAndRemembersProject

      - id: CanvasPilot-System-BrowseProjectImages
        title: >-
          The application shall list the image source files of the open project so the user can choose
          one to work on, keeping the list current as files change.
        tags: [system]
        justification: |
          The user works on one image source file at a time, and needs to see which files the project
          holds, including files added or changed by other tools, without leaving the application.
        children:
          - CanvasPilot-Project-BrowseProjectImages
        tests:
          - CanvasPilot_BrowseProjectImages_OpenProject_ListsImageSourceFiles

      - id: CanvasPilot-System-DesktopShell
        title: >-
          The application shall present a main window with menus from which the user creates and opens
          projects, sees the project's image files, returns to recent projects, changes settings, and
          learns about the application.
        tags: [system]
        justification: |
          The main window is what the user sees and uses. Bringing the project, settings, and application
          information together under familiar menus, with the open project named in the title, lets a
          user work without knowing how the application is built.
        children:
          - CanvasPilot-AppShell-ProvideMainWindow
          - CanvasPilot-AppShell-HostProjectWorkspace
          - CanvasPilot-AppShell-ShowApplicationInformation
        tests:
          - CanvasPilot_DesktopShell_CreateProject_ExplorerRecentProjectsAndSettingsRoundTrip

      - id: CanvasPilot-System-StartApplication
        title: >-
          The application shall start on every supported platform by building its parts in dependency
          order, loading the stored settings, and recording its start and stop in the application log.
        tags: [system]
        justification: |
          An application that cannot start leaves the user with nothing. Building the parts the same way
          on every platform, in one place, makes the start checkable without a window, and the log
          records when it happened for anyone investigating a problem.
        children:
          - CanvasPilot-AppShell-ComposeApplication
        tests:
          - CanvasPilot_Startup_ComposeApplication_ProducesWorkingShell
