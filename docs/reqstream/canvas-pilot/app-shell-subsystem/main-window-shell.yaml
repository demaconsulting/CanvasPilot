---
# Software Unit Requirements for the MainWindowShell Unit
#
# The MainWindowShell unit is the main window's view model and the window that shows it. The window has a title bar
# that holds the compact menu, the name of the open project, the list that chooses the style kit, and the AI provider
# pill; a body that shows the welcome screen while no project is open and the workspace once one is; and a status bar
# at the bottom. The unit owns the File, Edit, Image, Tools, and Help commands, follows the open project in the window
# title, lists the recent projects, remembers the size, place, and state of the window and the widths of the explorer
# and the chat column, and talks to the user only through an IDialogService that the window implements. The Image menu
# commands run through an IImageExporter (owned by the Preview subsystem) that the image preview supplies. The Edit
# menu runs through the IUndoRedoTarget of the part of the window that has the focus, and the talk key runs through an
# IPushToTalkTarget (both owned by the Composer subsystem). The status bar, the provider pill, and the welcome screen
# are units of their own; this file states only that the window shows them.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: AppShell Subsystem Requirements
        sections:
          - title: MainWindowShell Requirements
            requirements:
              - id: CanvasPilot-MainWindowShell-ExposeMenus
                title: >-
                  The MainWindowShell shall present File, Edit, Image, Tools, and Help menus whose items carry a name
                  and an automation identifier, and shall enable an item only when its command can run.
                justification: |
                  A predictable menu structure is how users find the application's functions, and stable
                  identifiers let automated tests and assistive technology find each item. Disabled items tell
                  the user what is not available yet, such as saving without a project.
                children:
                  - CanvasPilot-OTS-Avalonia-ShowMenusThatFollowCommands
                  - CanvasPilot-OTS-CommunityToolkitMvvm-FollowCommandAvailability
                tests:
                  - MainWindowView_Menus_HaveExpectedStructureAndAutomationIds
                  - MainWindowView_Menus_NoProject_EnabledStateFollowsCommands
                  - MainWindowShell_New_NoProject_TitleIsApplicationNameAndProjectCommandsDisabled

              - id: CanvasPilot-MainWindowShell-RouteUndoRedoToFocusedTarget
                title: >-
                  The MainWindowShell shall offer Undo and Redo commands that act on the part of the window that has
                  the focus, when that part can undo and redo, that are available only while that part has a step to
                  undo or redo and follow it as its steps change, and that do nothing and are unavailable while the
                  focus is in a part that has nothing to undo.
                justification: |
                  The Edit menu is one place for a function that belongs to the message being written. The window does
                  not know what its parts are, so the part that has the focus is asked, which keeps Undo from touching
                  a message the user is not working in and lets the menu show truthfully whether there is anything
                  to undo.
                tests:
                  - MainWindowShell_UndoRedo_FocusedTarget_DelegatesAndFollowsTargetState
                  - MainWindowShell_UndoRedo_NoTarget_DisabledAndReplacedTargetIgnored
                  - MainWindowView_EditMenu_TypingInComposerEnablesUndoAndExplorerFocusDisables

              - id: CanvasPilot-MainWindowShell-StartDictationFromKey
                title: >-
                  The MainWindowShell shall start listening on the push-to-talk target when the talk key (F9 until the user
                  chooses another key or chord on the Speech page, which takes effect at once) goes down, ignore the
                  repeats of a key that is held, stop listening on the target that was started when the key, or any key
                  of the chord, goes up, when the window closes, or when the window stops being the active one, and do
                  nothing while there is no target.
                justification: |
                  Holding a key lets the user dictate while the hands stay on the keyboard or pointer. The keyboard
                  repeats a held key, which must not start the dictation again, and a key that is released in another
                  window or after the window is gone would never be heard, which would leave the microphone open. F8, the
                  first default, never reached the window on laptops whose function keys do other things.
                tests:
                  - MainWindowShell_PushToTalk_BeginEnd_DelegatesToTarget
                  - MainWindowShell_PushToTalk_NoTargetOrTargetReplaced_IsIgnoredOrStopsStartedTarget
                  - MainWindowView_PushToTalkKey_DownAndUp_DrivesTarget
                  - MainWindowView_PushToTalkKey_ChosenChord_StartsOnTheChordAndStopsWhenAnyKeyOfItIsReleased
                  - MainWindowView_PushToTalkKey_NoTarget_IsIgnored
                  - MainWindowView_PushToTalkKey_WindowClosedWhileHeld_StopsTarget
                  - MainWindowView_PushToTalkKey_WindowDeactivatedWhileHeld_StopsTarget

              - id: CanvasPilot-MainWindowShell-TitleFollowsProject
                title: >-
                  The MainWindowShell shall show the window title as the open project's name followed by the
                  application name, or the application name alone when no project is open, and shall follow
                  changes made through the project service until it is disposed.
                justification: |
                  The title tells the user which project they are working on, including when a project is
                  closed or opened by another part of the application, and a shell that has been disposed
                  must not keep reacting to services it no longer owns.
                children:
                  - CanvasPilot-OTS-Avalonia-BindControlsToViewModels
                tests:
                  - MainWindowShell_New_NoProject_TitleIsApplicationNameAndProjectCommandsDisabled
                  - MainWindowShell_ProjectServiceChanges_TitleFollows
                  - MainWindowShell_Dispose_StopsFollowingServices
                  - MainWindowShell_Constructor_NullArguments_Throw
                  - MainWindowView_Show_OpensWithShellTitle

              - id: CanvasPilot-MainWindowShell-CreateAndOpenProjects
                title: >-
                  The MainWindowShell shall create a project from the New Project dialog and open a project
                  from a chosen project file, show the project and remember it in the recent projects, start
                  its pickers in the folder that holds the user's projects, and show any problem to the user
                  instead of failing.
                justification: |
                  Creating and opening projects are the first things a user does. Remembering each project and
                  starting the pickers where the projects live saves repeated navigation, and explaining a
                  problem such as a damaged file keeps the user informed and the application running.
                children:
                  - CanvasPilot-OTS-CommunityToolkitMvvm-RunAsyncCommandsOnce
                tests:
                  - MainWindowShell_NewProject_DialogAccepted_CreatesAndShowsProject
                  - MainWindowShell_NewProject_DialogCancelled_CreatesNothing
                  - MainWindowShell_NewProject_CreateFails_ShowsMessage
                  - MainWindowShell_OpenProject_FileChosen_OpensAndRemembersProject
                  - MainWindowShell_OpenProject_PickerCancelled_OpensNothing
                  - MainWindowShell_OpenProject_DamagedFile_ShowsMessageAndOpensNothing
                  - MainWindowShell_OpenProject_WithRecentProject_PickerStartsInProjectsFolder
                  - MainWindowShell_CommandsWithoutDialogService_DoNothing
                  - MainWindowView_NewProjectMenuItem_CancelThenOk_CreatesProjectAndUpdatesTitle

              - id: CanvasPilot-MainWindowShell-SaveAndCloseProjects
                title: >-
                  The MainWindowShell shall save the open project, close the open project, and ask the main
                  window to close when the user chooses Exit, and shall show a failed save to the user.
                justification: |
                  Users expect to save their work, to put a project away, and to leave the application from
                  the File menu, and a save that fails must be explained rather than silently lost.
                tests:
                  - MainWindowShell_SaveProject_OpenProject_WritesModifiedTime
                  - MainWindowShell_SaveProject_SaveFails_ShowsMessage
                  - MainWindowShell_CloseProject_OpenProject_ResetsTitleAndExplorer
                  - MainWindowShell_Exit_RaisesExitRequested
                  - MainWindowView_ExitMenuItem_ClosesWindow

              - id: CanvasPilot-MainWindowShell-ListRecentProjects
                title: >-
                  The MainWindowShell shall list the recent projects most recent first in the Recent Projects
                  menu, show each by its project name with underscores kept visible, open a project when it is
                  chosen, and drop a project whose file is gone after telling the user.
                justification: |
                  Users usually return to the projects they used last. A menu that reflects the stored list,
                  shows names as typed, and does not keep offering a project that no longer exists gets them
                  back to work in one choice.
                tests:
                  - MainWindowShell_RecentProjects_ListedMostRecentFirstAndOpenOnChoice
                  - MainWindowShell_RecentProjectItem_NameWithUnderscore_HeaderDoublesUnderscore
                  - MainWindowShell_RecentProjects_MissingProject_ShowsMessageAndRemovesEntry
                  - MainWindowView_RecentProject_Open_ListsFilesAndCloseProjectResetsWindow
                  - MainWindowView_RecentProjectsSubmenu_ItemShowsNameAndOpensProject

              - id: CanvasPilot-MainWindowShell-ShowSettingsAndAbout
                title: >-
                  The MainWindowShell shall open the settings dialog over the supplied settings pages, tell the
                  pages when the dialog closed, and open the About dialog.
                justification: |
                  Settings and information about the application are reached from the Tools and Help menus.
                  Pages that are told when the dialog closes can release resources such as running downloads.
                children:
                  - CanvasPilot-OTS-Avalonia-ShowModalDialogs
                tests:
                  - MainWindowShell_OpenSettings_ShowsDialogWithPagesAndNotifiesClose
                  - MainWindowShell_ShowAbout_ShowsAboutDialog
                  - MainWindowView_SettingsMenuItem_OpensSettingsDialogAndCancelCloses
                  - MainWindowView_AboutMenuItem_OpensAboutDialogAndCloseButtonCloses

              - id: CanvasPilot-MainWindowShell-ShowDrawingKnowledge
                title: >-
                  The MainWindowShell shall offer a Drawing Knowledge item in the Help menu, above About, that reads the
                  cards of the application only when it is first used and shows the browser of the drawing knowledge in a
                  window of its own that does not block the main window, shall bring the open browser to the front instead
                  of opening a second one, shall close the browser with the main window, shall be unavailable when the
                  application has no knowledge, and shall log and show to the user, instead of failing, a catalog that
                  cannot be read.
                justification: |
                  The cards help the user write what is wanted, and they are read while the user works, so the window must
                  not block the application, and one is enough. Reading the cards at the first use keeps the start of the
                  application as fast as before. A card that cannot be read is a defect of the application, which the user
                  can report only if it is said and logged, and must not take the application down.
                tests:
                  - MainWindowShell_ShowDrawingKnowledge_ShowsBrowserOnTheCatalog
                  - MainWindowShell_ShowDrawingKnowledge_WithoutKnowledgeOrDialogService_DoesNothing
                  - MainWindowShell_ShowDrawingKnowledge_CatalogCannotBeLoaded_LogsAndShowsMessage
                  - MainWindowView_DrawingKnowledgeMenuItem_ShowsBrowserWindowThatDoesNotBlock
                  - MainWindowView_DrawingKnowledgeMenuItem_SecondRequest_ReusesTheOpenBrowser
                  - MainWindowView_Close_ClosesTheBrowserItOwns

              - id: CanvasPilot-MainWindowShell-ProvideImageMenuSeam
                title: >-
                  The MainWindowShell shall offer Export as PNG and Copy Image commands that are available only
                  while a picture is shown, that follow the picture as it appears and goes away, and that export
                  or copy the shown picture and tell the user the outcome.
                justification: |
                  Exporting and copying apply to the picture the user is looking at. Offering the commands only
                  while a picture is shown stops the user from trying to export something that does not exist,
                  and reporting the outcome tells the user whether the file or clipboard now holds the picture.
                tests:
                  - MainWindowShell_ImageCommands_FollowExporterAndInvokeIt
                  - NullImageExporter_Default_IsDisabledAndDoesNothing
                  - MainWindowView_ImageMenu_ExporterEnables_ItemsEnabledAndRunExporter
                  - MainWindowView_SelectSvg_ShowsPreviewAndEnablesImageMenu

              - id: CanvasPilot-MainWindowShell-TalkToUserThroughDialogService
                title: >-
                  The MainWindowShell shall ask the user questions, show messages, let the user pick folders and
                  files, and place a picture on the clipboard through dialogs that look and behave the same
                  everywhere, shall refuse a blank answer to a one-line prompt, and shall treat a picker the
                  platform cannot show as no choice.
                justification: |
                  A single, consistent way of asking and telling gives every problem report and question the
                  same look and behavior, and keeps the logic testable without a window. A blank file name must
                  not be accepted, and a picker the platform cannot show must read as cancelled rather than
                  fail.
                tests:
                  - MessageDialogViewModel_Message_OkAcceptsAndRequestsClose
                  - MessageDialogViewModel_Confirmation_CancelRequestsCloseWithoutAcceptance
                  - MessageDialogViewModel_Prompt_BlankEntry_CannotBeAccepted
                  - MessageDialogViewModel_Constructor_InvalidArguments_Throw
                  - MainWindowView_ShowMessage_OkButtonClosesDialog
                  - MainWindowView_Confirm_ConfirmAndCancelButtons_ReturnAnswer
                  - MainWindowView_Prompt_TypedTextAndCancel_ReturnTrimmedTextOrNull
                  - MainWindowView_Pickers_HeadlessPlatform_ReturnNull
                  - MainWindowView_CopyImageToClipboard_Picture_ReportsResultAndIsReadable

              - id: CanvasPilot-MainWindowShell-ShowTheActiveStyleInTheTitleBar
                title: >-
                  The MainWindowShell shall show, in the title bar of the window, the list with which the user chooses the
                  style kit of the project, shall show the list only while a project is open and the application has such a
                  list, and shall give a project that was just created the default style kit of the user and no project that
                  is only opened.
                justification: |
                  The style belongs to the project, so the choice has to be in sight while the user works, and a list with no
                  project open would offer a choice that cannot be kept. A project should say which style it uses from the day
                  it is made, but opening a project must not change what its file says, and a later change of the preference
                  of the user must not move projects that exist.
                tests:
                  - MainWindowShell_NewProject_WithStylePicker_AppliesTheDefaultOnlyForANewProject
                  - MainWindowShell_NewProject_WithoutStylePicker_HasNoPicker
                  - StylePickerView_TitleBar_ShownOnlyWithAProjectAndListsTheKits

              - id: CanvasPilot-MainWindowShell-CheckAgainstStyleFromTheImageMenu
                title: >-
                  The MainWindowShell shall offer a Check Against Style item in the Image menu, after Copy Image, that is usable
                  only while the application can check and a picture is shown and that follows the picture as it appears and
                  goes away, that runs the check, and that tells the user, in a message, why when nothing was checked, and
                  shall leave the item unusable when the application has no check.
                justification: |
                  Whether a picture follows the style is a question about the picture the user is looking at, so the command is
                  in the menu of the picture and is offered only when there is something to check. A command that does nothing
                  without a word would look broken, so a missing style or picture is said.
                tests:
                  - MainWindowShell_CheckAgainstStyle_FollowsThePictureRunsTheCheckAndReportsWhyNot
                  - MainWindowShell_CheckAgainstStyle_NothingToCheckWith_IsUnavailableAndDoesNothing
                  - MainWindowView_Menus_HaveExpectedStructureAndAutomationIds
                  - MainWindowView_CheckAgainstStyleMenuItem_PictureShown_EnablesAndShowsNotesInThePreview

              - id: CanvasPilot-MainWindowShell-OpenStyleKitsFromTheToolsMenu
                title: >-
                  The MainWindowShell shall offer a Style Kits item in the Tools menu, above Settings, that is usable while
                  the application has a window that manages style kits, that makes the view model of the window from the
                  dialog service each time it runs and has the dialog service show it, and that does nothing before a dialog
                  service is attached, and the main window shall show that window as a window of its own that it owns and that
                  does not block it, one at a time, close it when the main window closes, show the editor of a kit modally
                  over it, and offer the pickers of a zip file and of example images.
                justification: |
                  Styles are managed beside the work, so the window must stay open while the user draws, and a second request
                  for it must bring the open one forward and not leave the user with two windows that show different
                  states. The shell must not know the kits or the window's content, so it makes the view model only through
                  a function that the composition root supplies, and the main window, which owns the dialogs, is the one
                  place that can show a window, an editor, and a picker with itself as the owner.
                tests:
                  - MainWindowShell_ShowStyleKits_MakesTheViewModelFromTheDialogsAndShowsIt
                  - MainWindowShell_ShowStyleKits_WithoutWindowOrDialogService_DoesNothing
                  - MainWindowView_Menus_HaveExpectedStructureAndAutomationIds
                  - MainWindowView_StyleKitsMenuItem_ShowsWindowThatDoesNotBlock
                  - MainWindowView_StyleKitsMenuItem_SecondRequest_ReusesTheOpenWindow
                  - MainWindowView_ShowStyleKitEditor_OverTheManagerOrTheMainWindow_ShowsEditorModally
                  - MainWindowView_Close_ClosesTheStyleKitsWindowItOwns

              - id: CanvasPilot-MainWindowShell-ShowTitleBar
                title: >-
                  The MainWindowShell shall show a title bar, 44 pixels high over the whole width of the window, that holds
                  the File, Edit, Image, Tools, and Help menus with all their items and keys, and that shows the name of the
                  open project in bold followed by the application name, or the application name alone while no project is
                  open, while the title that the system shows for the window keeps the project name followed by a hyphen and
                  the application name.
                justification: |
                  The title bar is the first thing the user sees and tells which project the work is in. Putting the menu in
                  the same strip gives the picture and the chat more room than a menu bar under a separate title would, and
                  none of the commands may be lost by the move. The system still needs a plain title for the task bar and the
                  list of windows.
                tests:
                  - MainWindowView_Show_HasTitleBarWithMenuAndTheDesignSizes
                  - MainWindowView_TitleBar_ShowsProjectNameThenApplicationName
                  - MainWindowView_Menus_HaveExpectedStructureAndAutomationIds

              - id: CanvasPilot-MainWindowShell-KeepRoomForSystemButtons
                title: >-
                  The MainWindowShell shall, when the window extends into its frame, keep free at the right end of the title
                  bar on Windows the width that the buttons it draws there really cover (measured from the buttons, which
                  are minimize, maximize or restore, and close; 140 pixels until they are laid out) so that the provider pill
                  ends clear of the first button, in the normal and in the maximized state, and 78 pixels at its left end on
                  macOS for the buttons that the system draws there, and shall keep nothing free on another platform or while
                  the window does not extend into its frame.
                justification: |
                  The system draws the buttons that minimize, maximize, and close the window over the strip when the window
                  takes over the frame. If the title or the pills lay under them, they could not be seen or used (the pill
                  was drawn under an invisible button and its gear was garbled), and a window that does not take over the
                  frame must not waste room. The buttons are drawn by the host of the window and not by the window, so the
                  width is measured from the top of the visual tree.
                tests:
                  - MainWindowView_CaptionReserve_FollowsPlatformAndExtension
                  - MainWindowView_ApplyCaptionReserve_ToleratesMissingControls
                  - MainWindowView_Show_HasTitleBarWithMenuAndTheDesignSizes
                  - MainWindowView_TitleBar_PillEndsClearOfTheWindowButtons
                  - MainWindowView_CaptionReserve_FallsBackToTheConstantUntilTheButtonsAreMeasured

              - id: CanvasPilot-MainWindowShell-HaveNoFullScreenMode
                title: >-
                  The MainWindowShell shall not offer a full-screen button among the window buttons, shall not bind a key to
                  full screen, and shall turn a window that is put into full screen by any other means back to the normal
                  state.
                justification: |
                  A window in full screen has no title bar and no buttons; the only way back is a bar that appears when the
                  pointer rests at the top edge, which users do not find. A drawing tool has no use for it, and a user who
                  is stuck in it has lost the window.
                tests:
                  - MainWindowView_TitleBarDecorations_AskForNoFullScreenButton
                  - MainWindowView_WindowState_FullScreenIsTurnedBackToNormal
                  - MainWindowView_KeyF11_DoesNotEnterFullScreen

              - id: CanvasPilot-MainWindowShell-OpenWithDesignSizes
                title: >-
                  The MainWindowShell shall open the window 1440 by 900 pixels when no size was saved and never let the
                  user make it smaller than 960 by 600 pixels.
                justification: |
                  The window holds an explorer, a picture, and a chat side by side. A first size that shows all three well,
                  and a least size below which they would be cropped, keep the application usable on the screens that people
                  have.
                tests:
                  - MainWindowView_Show_HasTitleBarWithMenuAndTheDesignSizes

              - id: CanvasPilot-MainWindowShell-HostProviderPillInTitleBar
                title: >-
                  The MainWindowShell shall show, in the title bar of the window and inside its right edge, the pill that tells
                  which AI provider is chosen and how it is, when the application has one.
                justification: |
                  Whether the AI provider can be used decides whether a message can be answered, so the user should see it at
                  all times, in the same place, and be able to reach the settings from it.
                tests:
                  - MainWindowView_ProviderPill_InTheTitleBar_OpensTheSettingsOnTheProviderPage

              - id: CanvasPilot-MainWindowShell-ShowStatusBarAtBottom
                title: >-
                  The MainWindowShell shall show the status bar at the bottom of the window at all times, with a project open
                  and without one, 26 pixels high.
                justification: |
                  The status bar says what the picture is and whether the application is idle. A bar that comes and goes would
                  move the picture, so it is always there, and no setting turns it off.
                tests:
                  - MainWindowView_StatusBar_AlwaysShownAndReportsThePicture

              - id: CanvasPilot-MainWindowShell-ShowWelcomeOrWorkspace
                title: >-
                  The MainWindowShell shall show the welcome screen in the body of the window while no project is open and
                  the workspace of the project, which is built only when a project is first opened, in its place while one is
                  open, and show the welcome screen again when the project is closed.
                justification: |
                  With no project there is nothing to explore, preview, or write about, so the window offers a way to start
                  instead of empty panes. Building the workspace only when it is needed keeps the start of the application
                  quick.
                tests:
                  - MainWindowView_Workspace_ChatColumnVisibleOnlyWithProject_ThreeColumns
                  - MainWindowView_RecentProject_Open_ListsFilesAndCloseProjectResetsWindow

              - id: CanvasPilot-MainWindowShell-RememberWindowLayout
                title: >-
                  The MainWindowShell shall save the size, the place, and whether the window is maximized when the window
                  closes, open the next window with them, give the workspace the saved widths of the explorer and the chat
                  column, and save the widths when the user chooses other ones.
                justification: |
                  People arrange the window to suit their screen and expect to find it as they left it, rather than moving
                  and resizing it at every start.
                tests:
                  - MainWindowShell_WindowLayout_RestoresWidthsAndSavesChoicesAndWindow
                  - WorkspaceLayout_CloseWindow_SavesTheSizeAndANewWindowOpensWithIt
                  - WorkspaceLayout_Splitters_SavedWidthsUsedAndKeyboardChoiceSaved

              - id: CanvasPilot-MainWindowShell-MakeMenuUsableByKeyboard
                title: >-
                  The MainWindowShell shall give every menu of the title bar and every item of a menu an access key that no
                  other entry of the same menu has, so the whole menu can be used with the keyboard alone.
                justification: |
                  A person who cannot use a pointer must reach every command, and two entries that share a key would make one
                  of them unreachable.
                tests:
                  - Accessibility_MainMenu_EveryEntryHasAUniqueAccessKey

              - id: CanvasPilot-MainWindowShell-NameAndSizeControls
                title: >-
                  The MainWindowShell shall give the main window, with and without a project, in both theme variants, buttons
                  that show no text a name and a tooltip, fields, lists, drop-downs, and sliders a name, buttons that are
                  enabled the ability to take the focus with the keyboard, and buttons that show no text a size of at least
                  28 by 28 pixels.
                justification: |
                  A screen reader says only what a control is named, a person with a pointer or a finger needs a target that
                  is large enough to hit, and a person with a keyboard must be able to reach every button. A button that holds
                  only an icon must therefore say in words what it does.
                tests:
                  - Accessibility_Windows_ControlsHaveNamesTooltipsFocusAndSize

              - id: CanvasPilot-MainWindowShell-OpenLogFolder
                title: >-
                  The MainWindowShell shall offer Open Log Folder in the Help menu, usable with no project open, which shows
                  the folder that the application logs to (the default folder when there is no logger) in the file manager
                  of the system, and shall tell the user with the reason and the path when the file manager could not be
                  started; the item shall be disabled when the application has no way to show a folder.
                justification: |
                  A person who reports a problem has to attach the log, and the log is in a folder that is not in the project
                  and that they cannot be expected to know.
                tests:
                  - MainWindowShell_OpenLogFolder_ShowsTheFolderOfTheLogger
                  - MainWindowShell_OpenLogFolder_NoLoggerOrLauncherFails_UsesTheDefaultFolderAndTellsTheUser
                  - MainWindowShell_OpenLogFolder_WithoutLauncher_IsDisabledAndDoesNothing
                  - MainWindowView_OpenLogFolderMenuItem_ShowsTheFolderOfTheLog