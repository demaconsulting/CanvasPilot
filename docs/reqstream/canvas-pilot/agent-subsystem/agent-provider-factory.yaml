---
# Software Unit Requirements for the AgentProviderFactory Unit
#
# The AgentProviderFactory unit makes the agent of a conversation for the AI provider that the settings choose, from the
# settings, the tools, and the instructions: for Ollama an agent on an Ollama client that is told the context window on
# every request, and for GitHub Copilot an agent on the Copilot runtime that the starter of the runtime gives, which the
# readiness check shares. A Copilot that cannot be served gives a typed answer and no agent. The unit owns what it
# starts for Ollama and disposes it; the Copilot runtime belongs to the starter, which the factory stops only when it
# was told that it owns it. Its seam is IAgentFactory, with which tests put an agent on a scripted chat client; its
# supporting types are the request and the result.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Agent Subsystem Requirements
        sections:
          - title: AgentProviderFactory Requirements
            requirements:
              - id: CanvasPilot-AgentProviderFactory-MakeOllamaAgent
                title: >-
                  The AgentProviderFactory shall make the agent for Ollama on the address and the model of the settings
                  (both trimmed), with the context window of the settings sent on every request, with the instructions
                  and exactly the supplied tools, and without a time limit on the connection, so that a whole tool turn
                  runs against the server.
                justification: |
                  A local model may need minutes to load, and Stop is what ends a turn, so the connection has no time limit.
                  Ollama loads a model at the window that a request names and at its own small default otherwise, so the
                  window of the settings must be on every request, not only the first. The agent may call the tools of the
                  project and nothing else.
                tests:
                  - AgentProviderFactory_Create_Ollama_SettingsReachTheWireAndAToolTurnRuns
                  - AgentProviderFactory_Create_Ollama_NoTools_ThrowsAndTheFactoryStillWorks
                  - AgentProviderFactory_Create_Ollama_MissingModel_TurnFailsWithThePullCommand
                  - AgentProviderFactory_Constants_Rule_AreTheDocumentedValues

              - id: CanvasPilot-AgentProviderFactory-RefuseUnusableSettings
                title: >-
                  The AgentProviderFactory shall answer settings of Ollama that cannot be used (an address that is not an
                  absolute http or https address, a blank model, a context window out of range) with the typed status
                  NotConfigured and a sentence that says what to enter, without making a request, and shall refuse missing
                  arguments.
                justification: |
                  A wrong setting is the user's to fix, and the sentence says which one. Making a request to find out costs
                  time and gives a worse message, so the settings are checked first.
                tests:
                  - AgentProviderFactory_Create_Ollama_SettingsThatCannotBeUsed_AreNotConfigured
                  - AgentProviderFactory_Create_BadArguments_AreRefused

              - id: CanvasPilot-AgentProviderFactory-MakeCopilotAgentThroughStarter
                title: >-
                  The AgentProviderFactory shall make the agent for GitHub Copilot on the runtime that the starter of the
                  runtime gives for the Copilot CLI that the locator found, and make each agent with exactly the supplied
                  tools, the instructions, the name CanvasPilot, the model of the settings (none when it is blank), and the
                  project folder as the working directory, and shall pass the data folder and the logger of the request on
                  to the starter of the runtime.
                justification: |
                  The runtime is one process for the whole application, and the agents of several projects share it; the
                  starter shares it, so the factory asks it for every agent. The tools that the application builds are the
                  only ones that the copilot may call, so each agent is made with exactly that list. The place where the
                  runtime keeps its files is chosen by the agent service, so the factory only carries it to the starter.
                tests:
                  - AgentProviderFactory_Create_Copilot_FakeStarter_MakesAgentsOnTheRuntimeThatBelongsToTheStarter
                  - AgentProviderFactory_Create_Copilot_ConcurrentRequestsAndDisposedFactory_StartOnceAndRefuse
                  - AgentProviderFactory_Create_Copilot_DataDirectoryAndLogger_ReachTheStarter

              - id: CanvasPilot-AgentProviderFactory-ReportUnavailableCopilot
                title: >-
                  The AgentProviderFactory shall answer a request for GitHub Copilot that cannot be served with a typed
                  result that has no agent and the status and sentence of the readiness check for the same cause: the
                  Copilot CLI is missing or too old (the starter is not asked), the starter says that the CLI is too old,
                  that the runtime is not signed in, or that it could not be started, or the runtime started but cannot
                  make agents, and shall not keep a runtime that was not started.
                justification: |
                  The user must be told what is wrong with the same words as in the readiness check, whichever way the
                  problem is found. A failure that was kept would turn a problem that can be fixed into one that lasts until
                  the application restarts.
                tests:
                  - AgentProviderFactory_Create_Copilot_StarterRefuses_ReturnsTheMatchingStatusAndNoAgent
                  - AgentProviderFactory_Create_Copilot_NoCliOrOldCli_ReportsTheCliAndDoesNotStart
                  - AgentProviderFactory_Create_Copilot_StarterFailureOrNoSource_IsUnavailableAndNotCached

              - id: CanvasPilot-AgentProviderFactory-OwnWhatItStarts
                title: >-
                  The AgentProviderFactory shall have each result own the clients of its Ollama agent and dispose them once
                  when the result is disposed, without disposing the handler it was given or another agent, shall leave the
                  Copilot runtime, which belongs to the starter, running when a result is disposed, shall stop the starter
                  once when the factory is disposed if the factory owns it and refuse a request for Copilot after that, and
                  shall delete the Copilot session of a conversation through the runtime when the conversation ends, while
                  leaving sessions of other providers and sessions without an id alone.
                justification: |
                  The connection to Ollama belongs to one agent and the runtime to the whole application, so each is
                  released by its owner at the right time. A runtime that is stopped while an agent still uses it fails that
                  agent, and one that is never stopped leaves a process behind. The runtime keeps each conversation on disk
                  until it is told to delete it, and the factory is the one that knows which conversation ends.
                tests:
                  - AgentProviderFactory_Create_Ollama_DisposingAResult_LeavesOtherAgentsWorking
                  - AgentProviderFactory_Create_Copilot_FakeStarter_MakesAgentsOnTheRuntimeThatBelongsToTheStarter
                  - AgentProviderFactory_DisposeAsync_OwnedStarter_StopsTheRuntimeOnce
                  - AgentProviderFactory_Create_Copilot_ConcurrentRequestsAndDisposedFactory_StartOnceAndRefuse
                  - AgentProviderFactory_DeleteSession_CopilotSessionOnly_DeletesThroughTheRuntime
