---
# Software Unit Requirements for the AgentReadiness Unit
#
# The AgentReadiness unit checks whether the AI provider that the settings choose can be used, and says in one sentence
# what it found and what to do. For GitHub Copilot it runs ordered checks (the Copilot CLI and its version, credentials,
# the start of the shared Copilot runtime on that CLI, and the validation of the model settings); for Ollama it checks
# the settings, the server, the model and the model settings, and the context window. Its supporting type, the probe of
# the Ollama server, is part of the unit; the starter of the
# Copilot runtime is a unit of its own (CopilotRuntimeStarter).

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Agent Subsystem Requirements
        sections:
          - title: AgentReadiness Requirements
            requirements:
              - id: CanvasPilot-AgentReadiness-CheckCopilotInOrder
                title: >-
                  The AgentReadiness shall check GitHub Copilot in this order and report the first check that fails:
                  the Copilot CLI is found, the CLI is version 1.0.113 or later, credentials exist, the starter of
                  the Copilot runtime starts the runtime, or reuses the one that runs, on that CLI, and the model
                  settings are valid for that runtime; each failure shall be
                  one sentence that names what to do, and a CLI that is not usable shall not lead to a check of
                  credentials.
                justification: |
                  Each later check needs the earlier one: credentials and the runtime mean nothing without a CLI that
                  works, and a model can be validated only by a running runtime. Reporting only the first problem tells
                  the user one thing to fix at a time, in the order in
                  which it can be fixed, and the exact sentences (install with winget, upgrade with winget) are the
                  commands that fix them. The CLI and its version are judged by the locator, so the sentences of the
                  locator are the ones the user sees. The runtime is the one that the conversations use, so the check
                  proves what the chat will need and starts no second runtime.
                tests:
                  - AgentReadiness_Copilot_NoCli_ReportsMissingWithTheInstallSentence
                  - AgentReadiness_Copilot_OnlyShim_ReportsMissingAndNamesTheShim
                  - AgentReadiness_Copilot_OverridePathMissing_ReportsMissingForThatPath
                  - AgentReadiness_Copilot_CliDoesNotAnswer_ReportsMissingWithReinstallAdvice
                  - AgentReadiness_Copilot_CliTooOld_ReportsTooOldWithTheUpgradeSentence
                  - AgentReadiness_Copilot_MinimumVersion_IsAcceptedAndGoesOnToCredentials
                  - AgentReadiness_Copilot_StarterStarted_ReportsReadyAndAsksWithTheCliThatWasFound
                  - AgentReadiness_Copilot_ModelOfTheSettings_IsValidatedByTheRuntimeCatalogAndNamedWhenReady

              - id: CanvasPilot-AgentReadiness-DetectCopilotCredentials
                title: >-
                  The AgentReadiness shall accept as credentials for GitHub Copilot a non-empty value of
                  COPILOT_GITHUB_TOKEN, GH_TOKEN, or GITHUB_TOKEN, or else a GitHub CLI (gh.exe on the PATH or in the
                  GitHub CLI folder under the program files) whose gh auth token ends with exit code 0 within 5 seconds
                  and prints something, and shall not run the GitHub CLI when a variable already gives credentials.
                justification: |
                  These are the ways in which the AI library that the application is built on can sign in to GitHub.
                  A token in the environment is the cheapest proof and needs no program; the signed-in GitHub CLI is
                  the usual case on a developer machine. A time limit keeps a stuck program from freezing the check,
                  and an empty or failed answer is a clear no.
                tests:
                  - AgentReadiness_Copilot_TokenVariable_CountsAsCredentialsAndReportsReady
                  - AgentReadiness_Copilot_EmptyTokenVariables_AreNotCredentials
                  - AgentReadiness_Copilot_GitHubCliSignedIn_CountsAsCredentialsAndNeverKeepsTheToken
                  - AgentReadiness_Copilot_GitHubCliOnPath_IsRunFromThePath
                  - AgentReadiness_Copilot_GitHubCliNotSignedIn_IsNotACredential

              - id: CanvasPilot-AgentReadiness-ExplainCopilotAuthentication
                title: >-
                  The AgentReadiness shall, when no credentials exist, tell the user to sign in with gh auth login or
                  to set the COPILOT_GITHUB_TOKEN, GH_TOKEN, or GITHUB_TOKEN environment variable and to choose Check
                  connection, and shall say that signing in to the Copilot CLI with /login does not apply to the
                  application.
                justification: |
                  Users who signed in to the Copilot CLI will expect that to be enough. The AI library does not use that
                  session (verified on a machine where the CLI is signed in with /login: with no GitHub CLI sign-in and no
                  token variable the runtime reports that it is not authenticated), so without this sentence the user
                  would be told to sign in when they believe they are. The sentence gives the two things that work and
                  names the one that does not, so the user does not repeat the sign-in that fails.
                tests:
                  - AgentReadiness_Copilot_NoCredentials_ReportsNotSignedInWithTheExactSentence

              - id: CanvasPilot-AgentReadiness-ReportCopilotRuntimeStart
                title: >-
                  The AgentReadiness shall report GitHub Copilot as ready, with the version of the CLI, when the starter
                  starts the runtime, and otherwise with the status that matches what the starter answers (CLI too old,
                  not signed in, or runtime not started) and the sentence of the starter.
                justification: |
                  Only starting the runtime shows that the CLI runs and that the sign-in works, so the check asks the
                  starter and passes its explanation on unchanged: the user sees one sentence from the one unit that knows
                  why the start failed. A Copilot that is reported ready can answer a message.
                tests:
                  - AgentReadiness_Copilot_TokenVariable_CountsAsCredentialsAndReportsReady
                  - AgentReadiness_Copilot_StarterRefuses_ReportsTheMatchingStatusAndSentence
                  - AgentReadiness_Copilot_StarterStarted_ReportsReadyAndAsksWithTheCliThatWasFound

              - id: CanvasPilot-AgentReadiness-ValidateModelSettings
                title: >-
                  The AgentReadiness shall validate the model and the reasoning effort of the settings against the catalog
                  of the provider (the catalog of the running Copilot runtime, or of the Ollama server once the server has
                  the model), and shall report a model that is not offered, cannot be used, cannot call tools, does not
                  offer the chosen reasoning effort, or (Ollama) is asked for a context window larger than it was trained
                  for as the model settings being invalid, with the sentence of the AI library and no usable provider;
                  shall report a model that cannot take pictures as a warning that still allows a turn, combined with the
                  warning for a small context window when both apply; and shall leave the settings unchecked, as when no
                  model is named, when no catalog can be read.
                justification: |
                  Every drawing is made by calling tools, so a model that cannot call them cannot be used, and a wrong
                  model name or effort would otherwise fail in the middle of the first turn. The catalog knows what each
                  model supports, so the check asks it and shows its own explanation, which names what is supported. A
                  model that cannot see pictures still works for text and file work, so that is a warning and not a stop.
                  A server that has just listed its models but cannot describe them must not make a setting that may be
                  right look wrong, so then the first turn finds the problem, if there is one.
                tests:
                  - AgentReadiness_Copilot_ModelSettingsTheCatalogRefuses_ReportModelSettingsInvalid
                  - AgentReadiness_Copilot_ModelWithoutVisionAndUnreadableCatalog_WarnsAndReportsTheRuntime
                  - AgentReadiness_Ollama_ModelSettings_AreValidatedByTheCatalogOfTheServer
                  - AgentReadiness_Ollama_NoContextAnswer_UsesTheTrainedLengthOfTheCatalog

              - id: CanvasPilot-AgentReadiness-NeverRetainCredentials
                title: >-
                  The AgentReadiness shall look only at whether a token variable or the output of gh auth token is
                  empty, and shall not show or log a token, so that no token text is in any report.
                justification: |
                  A token is a secret that gives access to the user's GitHub account. The check needs to know only that
                  one exists, so nothing else about it is read and no report can leak one by mistake.
                tests:
                  - AgentReadiness_Copilot_GitHubCliSignedIn_CountsAsCredentialsAndNeverKeepsTheToken

              - id: CanvasPilot-AgentReadiness-CheckOllamaServerAndModel
                title: >-
                  The AgentReadiness shall, for Ollama, report settings that name no valid http or https address or no
                  model without asking the server, and otherwise ask the server for its models within 5 seconds, report
                  a server that does not answer, report a model that the server does not have with the command ollama
                  pull and the model name, and for a model that is there say that it is running (and, when the server
                  cannot describe the model, that pictures need a vision-capable model);
                  a model name without a tag shall match the latest tag, in any letter case.
                justification: |
                  A local model server may not be running, and a model has to be pulled before it can be used; the user
                  should learn that before the first message, with the command that fixes it. Pictures that the model
                  cannot see are the most common surprise with local models, so the sentence says it whenever the server
                  could not say. Matching
                  the name the way ollama pull does keeps a correct setting from being reported as missing.
                tests:
                  - AgentReadiness_Ollama_InvalidEndpoint_ReportsNotConfigured
                  - AgentReadiness_Ollama_NoModelName_ReportsNotConfigured
                  - AgentReadiness_Ollama_ServerNotReachable_ReportsUnreachable
                  - AgentReadiness_Ollama_ModelMissing_ReportsTheOllamaPullCommand
                  - AgentReadiness_Ollama_ModelPresent_ReportsReadyWithTheVisionHint

              - id: CanvasPilot-AgentReadiness-WarnSmallOllamaContext
                title: >-
                  The AgentReadiness shall report a warning that still allows a turn when the smaller of the configured
                  context window and the largest window that the model supports (when the server says) is below
                  16,384 tokens, and the sentence shall name the configured window and the setting to raise when the
                  setting is the smaller, and name the limit of the model when that is the smaller.
                justification: |
                  Drawings with pictures and tools need a long context, and a model with a window that is too short
                  fails in ways that look like a broken application. Raising the setting helps only when the setting is
                  the smaller value, so the two cases give different advice. The warning must not block the user, who
                  may know that the model copes.
                tests:
                  - AgentReadiness_Ollama_ConfiguredContext_WarnsAt16383AndNotAt16384
                  - AgentReadiness_Ollama_DetectedContext_TheSmallerOfConfiguredAndDetectedDecides
                  - AgentReadiness_DescribeSmallContext_Boundaries_AreTheRecommendedMinimum

              - id: CanvasPilot-AgentReadiness-ProbeOllamaSafely
                title: >-
                  The OllamaProbe shall read the models of a server from its tags and the context length of a model from
                  the entry of its information whose key ends in .context_length, shall treat a refused connection, an
                  error status, an answer that is not what Ollama sends, and a time out as an unreachable server or an
                  unknown length and not as an error, and shall pass on a cancellation by the caller.
                justification: |
                  The readiness check must always end with a sentence, so
                  every failure of the conversation with the server is data. The context length is optional, since the
                  shape of the answer is an assumption that only a real server can confirm, so a missing or odd value
                  must degrade to "not known" and never to a failure.
                tests:
                  - OllamaProbe_ListModels_ServerAnswers_ReturnsTheNamesFromTags
                  - OllamaProbe_ListModels_NoModels_IsReachableAndEmpty
                  - OllamaProbe_ListModels_Failure_IsAnUnreachableServer
                  - OllamaProbe_ListModels_NoAnswerInTime_IsAnUnreachableServer
                  - OllamaProbe_Cancelled_ThrowsOperationCanceled
                  - OllamaProbe_GetContextLength_ModelInfo_ReadsTheContextLengthEntry
                  - OllamaProbe_GetContextLength_UnusableAnswer_IsUnknownNotAnError
                  - OllamaProbe_GetContextLength_Failure_IsUnknownNotAnError
                  - OllamaProbe_Arguments_Invalid_AreRefused

              - id: CanvasPilot-AgentReadiness-ServeConnectionCheck
                title: >-
                  The AgentReadiness shall implement the connection check of the settings dialog by searching for the
                  Copilot CLI again, returning the sentence of the report and whether the provider can be used, shall
                  keep the answer of the CLI search between plain checks, and shall end a check with a cancellation when
                  the caller cancels it.
                justification: |
                  A user who has just installed or fixed something and chooses Check connection must see the fix, so the
                  connection check does not use a remembered answer, while the plain check that runs often does. The
                  settings dialog depends only on the interface that it owns, so the result is plain data. All one-line
                  sentences end with a full stop so that the chat can show them unchanged.
                tests:
                  - AgentReadiness_Constants_Rule_AreTheDocumentedValues
                  - AgentReadiness_Copilot_RefreshAndCheckAsync_SearchAgainOnlyWhenAsked
                  - AgentReadiness_GetReport_CancelledToken_ThrowsOperationCanceled
                  - AgentReadiness_GetReport_NullSettings_ThrowsArgumentNull
                  - AgentReadiness_CheckAsync_Ollama_MapsUsabilityAndMessage
                  - AgentReadiness_Messages_Rule_AreOneLineAndEndWithAFullStop
