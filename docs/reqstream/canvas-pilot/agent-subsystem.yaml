---
# Agent Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasPilot Agent subsystem
# - The Agent subsystem is the AI copilot behind the chat: it checks whether the chosen AI provider can be used, runs a
#   turn (a message in, a stream of events out), and holds the conversation with that provider. It has no user
#   interface, and the Chat subsystem reaches it only through the provider-independent IAgentService contract
# - This file holds the requirements of the subsystem as a whole. Its first unit is AgentContract, the contract itself;
#   the units that implement the contract (the provider, the tools, the readiness checks) add their requirements in
#   their own files and are linked here as children as they are added
# - Subsystem requirements describe the behavior of the units working together

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Agent Subsystem Requirements
        requirements:
          - id: CanvasPilot-Agent-RunTurnAsEvents
            title: >-
              The Agent subsystem shall give its consumers one interface, independent of the AI provider, that runs a
              turn for a sent message, with the text of the earlier turns when a conversation was restored, as an
              ordered stream of events (answer text, tool calls, files written, usage) that ends with completion or
              with a failure of a named kind, and that resets the conversation.
            justification: |
              The chat must work the same whichever AI provider answers, and must not depend on the libraries of any of
              them. One interface with plain records for the request and for the events lets the chat be written and
              tested against a scripted service, lets a turn be stopped by cancellation, and gives every failure a kind
              that the chat can explain to the user. Only one turn may run at a time, so a request made while a turn runs
              has its own failure kind.
            children:
              - CanvasPilot-AgentContract-StreamTurnEvents
            tests:
              - AgentSubsystem_RunTurn_ScriptedService_StreamsEventsInOrderAndReceivesTheRequest
              - AgentSubsystem_RunTurn_ScriptedBusyService_EndsWithFailedEventOfKindBusy

          - id: CanvasPilot-Agent-DescribeReadiness
            title: >-
              The Agent subsystem shall describe whether the AI provider that the settings choose can be used as a
              report with one status and one sentence for the user, and shall tell a provider that can be used, with or
              without a warning, from one that cannot.
            justification: |
              The user must learn before the first message, and not from a failed turn, that the provider is missing,
              not signed in, not running, or short of context, and what to do about it. A status that the chat can
              act on, with a sentence that it can show unchanged, keeps the explanation in one place. A warning, such as
              a small context window, must not stop the user from working, so it is a status that can still run a turn.
            children:
              - CanvasPilot-AgentContract-ReportReadiness
            tests:
              - AgentSubsystem_Readiness_ScriptedReports_SeparateUsableFromBlockedProviders

          - id: CanvasPilot-Agent-CheckProviderReadiness
            title: >-
              The Agent subsystem shall check the AI provider that the settings choose and report it as one status with
              one sentence that says what to do: for GitHub Copilot the Copilot CLI, its version, the credentials, and
              the runtime (which this build cannot start, so Copilot is never reported as ready), and for Ollama the
              settings, the server, the model, and the size of the context window.
            justification: |
              Both providers depend on things outside the application, and the user should learn what is missing before
              the first message. The subsystem owns the checks because it owns the knowledge of how each provider is
              reached, and it offers them to the settings dialog through the interface that the dialog owns. Saying
              plainly that GitHub Copilot cannot be started yet, instead of reporting it ready, keeps the user from a
              chat that cannot answer and points to the provider that can.
            children:
              - CanvasPilot-AgentReadiness-CheckCopilotInOrder
              - CanvasPilot-AgentReadiness-DetectCopilotCredentials
              - CanvasPilot-AgentReadiness-ExplainCopilotAuthentication
              - CanvasPilot-AgentReadiness-ReportGatedCopilotRuntime
              - CanvasPilot-AgentReadiness-NeverRetainCredentials
              - CanvasPilot-AgentReadiness-CheckOllamaServerAndModel
              - CanvasPilot-AgentReadiness-WarnSmallOllamaContext
              - CanvasPilot-AgentReadiness-ProbeOllamaSafely
              - CanvasPilot-AgentReadiness-ServeConnectionCheck
            tests:
              - AgentSubsystem_CheckProviderReadiness_BothProviders_ReportThroughTheSettingsInterface

          - id: CanvasPilot-Agent-ConfineToolsToProject
            title: >-
              The Agent subsystem shall build the tools that the copilot may use for one project so that they are
              confined to the project folder (with the data folder and the project files out of reach), so that the
              drawing knowledge and the style tools of the application are offered as tools of the AI library with their
              own names, words, and schemas and answer every call as text, and so that a set of tools that a provider
              could not be given is refused when it is built.
            justification: |
              The copilot may act only through the application's tools, so the building of those tools is where the
              confinement is decided. One policy built from the project folder serves every pack, the existing tool
              descriptions are reused unchanged for any provider, and a wrong set (no tool, a repeated name, a name that
              the Copilot CLI would take over) is found when it is built and not in the middle of a conversation.
            children:
              - CanvasPilot-AgentToolRegistry-ConfineToolsToProject
              - CanvasPilot-AgentToolRegistry-ProtectApplicationFiles
              - CanvasPilot-AgentToolRegistry-OfferDescribedTools
              - CanvasPilot-AgentToolRegistry-AnswerCallsWithoutThrowing
              - CanvasPilot-AgentToolRegistry-LimitToolAnswers
              - CanvasPilot-AgentToolRegistry-ComposeToolPacks
              - CanvasPilot-AgentToolRegistry-OfferOptionalPacks
              - CanvasPilot-AgentToolRegistry-ValidateToolSet
            tests:
              - AgentSubsystem_ConfineTools_ProjectFolder_OffersOnlyApplicationToolsUnderTheConfiningPolicy

          - id: CanvasPilot-Agent-ConfineProjectFileTools
            title: >-
              The Agent subsystem shall give the copilot tools that list, read, write, and draw files of the project and
              that are confined to the project folder, so that no path leaves the project or goes through a link, a name
              that means something else is refused, the data folder, the project files, and the style kits of the project
              are never written, and only text image sources and small data files are written.
            justification: |
              Writing files is the one power of the copilot that can hurt the user, and the application asks nothing before
              it replaces a file. The tools therefore decide, in one place and for every path, what may be touched, and they
              do not rest on the path policy of the AI library alone, which does not follow links. The example images of the
              active style kit are the one place outside the project that may be drawn, read only and images only.
            children:
              - CanvasPilot-ProjectTools-ConfinePaths
              - CanvasPilot-ProjectTools-RefuseDisguisedNames
              - CanvasPilot-ProjectTools-RefuseLinks
              - CanvasPilot-ProjectTools-LimitWrittenFiles
              - CanvasPilot-ProjectTools-ProtectProjectFiles
              - CanvasPilot-ProjectTools-RenderStyleKitExamples
            tests:
              - AgentSubsystem_ProjectTools_ProjectFolder_WriteListReadAndDrawStayInsideTheProject

          - id: CanvasPilot-Agent-WorkOnProjectFiles
            title: >-
              The Agent subsystem shall let the copilot work on the files of the project through tools that list the files,
              read a text file, create or replace a text file directly and say which, tell the shell which file was written,
              and draw a picture that comes back scaled for a model, with a failed drawing answered as text, and shall log
              only the metadata of each call.
            justification: |
              The copilot draws by writing the source of a picture and looking at the result, so it needs to see the
              project, to write a file, and to see what it wrote. Replacing a file directly is the user's decision, so the
              change is made visible instead: in the answer, in the chat, and in the project explorer. The log may say what
              happened and never what was in a file or a message.
            children:
              - CanvasPilot-ProjectTools-OfferTools
              - CanvasPilot-ProjectTools-ListFiles
              - CanvasPilot-ProjectTools-ReadTextFiles
              - CanvasPilot-ProjectTools-WriteDirectly
              - CanvasPilot-ProjectTools-ReportCreatedOrReplaced
              - CanvasPilot-ProjectTools-RenderPictures
              - CanvasPilot-ProjectTools-ScalePictures
              - CanvasPilot-ProjectTools-AnswerRenderFailures
              - CanvasPilot-ProjectTools-LogMetadataOnly
            tests:
              - AgentSubsystem_ProjectTools_ProjectFolder_WriteListReadAndDrawStayInsideTheProject

          - id: CanvasPilot-Agent-LocateCopilotCli
            title: >-
              The Agent subsystem shall locate the GitHub Copilot CLI that the user installed, tell it from the
              launchers that editors put on the PATH, honor a path chosen in the settings, check that the CLI reports
              a version that works, and explain what it found and what to do when it cannot be used.
            justification: |
              The application never ships the Copilot CLI, so it can only use the one that the user installed, and on
              a machine with VS Code the first copilot.exe on the PATH may be an editor launcher and not the CLI. The
              readiness checks and, later, the start of the Copilot runtime need the path and version of the real
              CLI, or a sentence that tells the user how to get one.
            children:
              - CanvasPilot-CopilotCliLocator-PreferRealCli
              - CanvasPilot-CopilotCliLocator-RejectShims
              - CanvasPilot-CopilotCliLocator-HonorSettingsOverride
              - CanvasPilot-CopilotCliLocator-ValidateVersion
              - CanvasPilot-CopilotCliLocator-DiagnoseRejections
              - CanvasPilot-CopilotCliLocator-RunProbeSafely
            tests:
              - AgentSubsystem_LocateCopilotCli_MachinesWithShim_FindsRealCliAndExplainsShimOnly
