---
# Project Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasPilot Project subsystem
# - The Project subsystem spans ProjectService (ProjectService.cs, IProjectService.cs, ProjectDocument.cs,
#   ProjectNameRules.cs), RecentProjects (RecentProjects.cs, IRecentProjects.cs), NewProjectDialog
#   (NewProjectDialogViewModel.cs, NewProjectDialogView.axaml, IFolderPicker.cs), and ProjectExplorer
#   (ProjectExplorerViewModel.cs, ProjectExplorerView.axaml, IImageSourceFilter.cs, IRefreshScheduler.cs,
#   ProjectFileItem.cs)
# - Subsystem requirements describe the project behavior that satisfies the system-level project requirements

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Project Subsystem Requirements
        requirements:
          - id: CanvasPilot-Project-ManageProjectFiles
            title: >-
              The Project subsystem shall create, open, save, and close projects, each stored as a
              folder holding a versioned project file, and shall report ordinary problems as results
              rather than failing.
            justification: |
              A project folder with one small project file is what the user's images, assets, and later
              application data are organized around. A versioned file lets the format grow, and
              returning problems as results lets the application explain them to the user instead of
              crashing on a bad name, a damaged file, or a file from a newer version.
            children:
              - CanvasPilot-ProjectService-CreateProjectFolder
              - CanvasPilot-ProjectService-RejectUnsafeProjectNames
              - CanvasPilot-ProjectService-OpenProjectFile
              - CanvasPilot-ProjectService-RejectUnusableProjectFiles
              - CanvasPilot-ProjectService-SaveProject
              - CanvasPilot-ProjectService-CloseProject
              - CanvasPilot-ProjectService-ReportFailuresAsResults
            tests:
              - ProjectSubsystem_ManageProjects_DialogCreateSaveReopen_RoundTrips

          - id: CanvasPilot-Project-CreateNewProject
            title: >-
              The Project subsystem shall let the user choose a project name and a location in a New
              Project dialog that accepts them only when a project can be created from them.
            justification: |
              Names and locations come from the user and become folder and file names. Checking them as
              they are typed, and allowing OK only for a project that can be created, keeps mistakes out
              of the file system and shows the user what is wrong before anything is written.
            children:
              - CanvasPilot-NewProjectDialog-CollectNameAndLocation
              - CanvasPilot-NewProjectDialog-ValidateEntries
              - CanvasPilot-NewProjectDialog-BrowseForLocation
              - CanvasPilot-NewProjectDialog-AcceptOrCancel
            tests:
              - ProjectSubsystem_ManageProjects_DialogCreateSaveReopen_RoundTrips

          - id: CanvasPilot-Project-RememberRecentProjects
            title: >-
              The Project subsystem shall remember the most recently opened projects between runs,
              most recent first, and shall not offer projects whose files no longer exist.
            justification: |
              Users usually return to the projects they used last. A short, ordered list kept in the
              application settings lets them reopen those projects quickly, and dropping missing files
              avoids offering choices that can only fail.
            children:
              - CanvasPilot-RecentProjects-KeepMostRecentFirst
              - CanvasPilot-RecentProjects-DropMissingProjects
              - CanvasPilot-RecentProjects-StoreInSettings
            tests:
              - ProjectSubsystem_RememberRecentProjects_OpenedProjects_ListedMostRecentFirst

          - id: CanvasPilot-Project-BrowseProjectImages
            title: >-
              The Project subsystem shall list the image source files in the root of the open project's
              folder, keep the list current as files change, and let the user select a file.
            justification: |
              The top-level image source files of a project are the things the user works on. A list that
              follows the folder as files are added, removed, or renamed, by this application or by
              other tools, stays correct without the user refreshing it, and sub-folders and application
              data stay out of the way.
            children:
              - CanvasPilot-ProjectExplorer-ListProjectImages
              - CanvasPilot-ProjectExplorer-SelectFile
              - CanvasPilot-ProjectExplorer-RefreshOnFileChanges
              - CanvasPilot-ProjectExplorer-ReleaseWatcher
            tests:
              - ProjectSubsystem_BrowseImages_ProjectFolder_ListsOnlyRootImageSources

          - id: CanvasPilot-Project-ManageImageFiles
            title: >-
              The Project subsystem shall let the user rename and delete an image source file in the open
              project's folder, keep the list current, and refuse a change that would lose or misplace a file.
            justification: |
              Managing a project's image files is part of working on them. Renaming and deleting through the
              project list keeps it current and lets the application refuse a name that is invalid, is not an
              image source file, or would replace another file, and report a file that cannot be changed.
            children:
              - CanvasPilot-ProjectExplorer-DeleteSelectedFile
              - CanvasPilot-ProjectExplorer-RenameSelectedFile
            tests:
              - ProjectSubsystem_BrowseImages_ProjectFolder_ListsOnlyRootImageSources
