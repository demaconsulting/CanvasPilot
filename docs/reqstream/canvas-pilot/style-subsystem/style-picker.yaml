---
# Software Unit Requirements for the StylePicker Unit
#
# The StylePicker unit is the pill in the title bar of the main window with which the user chooses the style kit of the
# open project. It shows the kit that the project uses by its name and the main colors of its palette, offers no style and
# every kit that is not hidden by a kit of a more local place, writes a choice into the project file through the active
# style, says so when the project names a kit that cannot be found, and ends its list with an entry that opens the window
# that manages style kits.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Style Subsystem Requirements
        sections:
          - title: StylePicker Requirements
            requirements:
              - id: CanvasPilot-StylePicker-ShowAndChangeTheActiveKit
                title: >-
                  The StylePicker shall offer no style first and then every kit that is not hidden by a kit of a more local
                  place, each with the place it comes from and with its description and folder as an explanation, show the
                  kit that the open project uses as the selected choice, show a kit that the project names and that cannot
                  be found as a choice that says it was not found, write the kit that the user chooses, or no style, into the
                  project file, show why a choice could not be kept and then what the project really uses, follow a change
                  that is made elsewhere, be shown only while a project is open, and pass on the request to give a new
                  project the default kit of the user.
                justification: |
                  The style belongs to the project, so the choice must be one step away while the user works and must always
                  show the truth: the kit that the project file names, also when that kit is gone, and not a kit that was
                  clicked and refused. A kit that is hidden by a more local copy of the same id is not a different choice, and
                  a list with no project open would offer a choice that cannot be kept.
                tests:
                  - StylePicker_Items_KitsOfTheCatalog_NoStyleFirstAndVisibleOnlyWithAProject
                  - StylePicker_Select_KitThenNoStyle_IsWrittenToTheProjectFile
                  - StylePicker_MissingKit_IsShownAsNotFoundAndGoesWhenAnotherIsChosen
                  - StylePicker_Items_KitHiddenByAMoreLocalKit_IsListedOnceWithTheLocalPlace
                  - StylePicker_Select_NoProject_ReportsTheReasonAndShowsNoStyleAgain
                  - StylePicker_SelectedItem_ChoiceMadeElsewhere_IsFollowedWithoutWritingAgain
                  - StylePicker_ApplyDefaultToNewProjectAsync_PassesOnOrDoesNothing
                  - StylePicker_PlaceText_EveryPlace_IsNamedForTheUser
                  - StylePicker_DisposeAndConstructor_StopsFollowingAndRefusesNull
                  - StylePickerView_TitleBar_ShownOnlyWithAProjectAndListsTheKits
                  - StylePickerView_ChooseKit_WritesTheProjectFile
                  - StylePickerView_MissingKit_IsShownAsNotFound

              - id: CanvasPilot-StylePicker-ShowKitAsPill
                title: >-
                  The StylePicker shall show the kit that the open project uses as a pill 26 pixels high in the title bar of
                  the main window, with the name of the kit without the place it comes from and up to three dots in the main
                  colors of its palette (the primary, secondary, and accent colors first and then others, never the
                  background or the text color), show no style as its words with no color, and name the pill Style kit for
                  assistive technology.
                justification: |
                  The kit is the look of every picture of the project, so the person at work should see it at a glance, in
                  a small place that is always there, by its name and its colors. The place of the kit is useful when
                  choosing and is noise once chosen. The background and the text color of a kit are nearly always white and
                  black, so they would make every kit look the same. A pill that has no visible label needs a name for a
                  screen reader.
                tests:
                  - StylePicker_Items_KitPalette_GivesNameAndUpToThreeMainColors
                  - StylePickerView_TitleBar_ShownOnlyWithAProjectAndListsTheKits
                  - StylePickerView_Pill_ShowsNameAndSwatchesOfTheChosenKit

              - id: CanvasPilot-StylePicker-ManageKitsFromTheList
                title: >-
                  The StylePicker shall, when the main window gives it the means, end its list with an entry named Manage
                  style kits that opens the window that manages style kits and closes the list, and shall show no such entry
                  when it has not been given the means.
                justification: |
                  A person who looks for a kit that is not in the list, or who wants to change one, should find the window
                  that manages kits where the kits are chosen. The list must close, because the window that opens needs the
                  room. The picker does not know the windows of the application, so the entry exists only when the host
                  says what it does.
                tests:
                  - StylePicker_ManageKitsCommand_SetThenCleared_IsAnnouncedAndTold
                  - StylePickerView_ManageStyleKitsEntry_OpensTheWindowThatManagesKits
