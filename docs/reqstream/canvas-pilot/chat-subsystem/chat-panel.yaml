---
# Software Unit Requirements for the ChatPanel Unit
#
# The ChatPanel unit is the panel in which the user converses: a header with the title, a menu of more actions, and a
# button that hides the panel; the conversation of the open project (the messages that were sent as bubbles, the
# answers of the AI copilot with the tools it called, and the notices), which offers example and follow-up prompts; the
# card in which the message is written, with the composer's editing control, the attach button, the button that
# listens while it is held, and the button that sends; the indicator and the button that stop the copilot; the banner
# that says whether the copilot can be used; and the joining of the marks drawn on the picture to the message. It
# follows the composer, the annotation layer, and the turn runner and decides nothing that they decide: whether a message
# can be sent, what dictation says, which marks are in the message, and what a turn does stay with the units that own
# them. The panel keeps nothing in the project and writes nothing itself: the words of a conversation are kept on the
# user's computer by the ChatHistoryStore unit, which the panel is given. The look of the panel (colors, spacing, icons,
# and the animation of the dots and the talk button) comes from the ThemeResources unit and is described in the design.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Chat Subsystem Requirements
        sections:
          - title: ChatPanel Requirements
            requirements:
              - id: CanvasPilot-ChatPanel-ListSentMessagesOnly
                title: >-
                  The ChatPanel shall list in its transcript, as the rows of the user, exactly the messages that were sent in
                  the open project, once each and oldest first, each with its words in the order they were written,
                  dictated words marked as such, the chips of its attachments and marks in their places with their
                  pictures, no button to delete them, and no way to change the notes of its marks, and a statement of how
                  many marks and attachments it carried;
                  and shall drop what it shows when the project changes or closes, so that the answer of one project is
                  never shown in another.
                justification: |
                  The transcript is the user's record of what was said to the assistant, so it must show what was
                  sent and not what is still being written, in the order it was sent, and it must show it the way it
                  was composed, with the marks and files where the user put them, so that the user recognizes the
                  message. A sent message cannot be changed, so its chips have no delete button and the notes of its
                  marks cannot be changed from them. The messages belong
                  to the project they were sent in and may hold the user's words and file names, so the transcript goes
                  with the project; what is kept of it for the next time is a separate requirement and is kept outside
                  the project.
                tests:
                  - ChatPanelViewModel_New_HasEmptyTranscriptAndCannotSend
                  - ChatPanelViewModel_Send_TypedText_AddsOneEntryAndEmptiesTheDraft
                  - ChatPanelViewModel_Transcript_TwoMessagesAndADraft_ListsOnlySentMessagesInOrder
                  - ChatPanelViewModel_Send_TypedDictatedAndMark_EntryKeepsOrderOriginsAndSummary
                  - ChatPanelViewModel_ProjectChanges_DropsTheTranscript
                  - ChatPanelViewModel_Dispose_StopsFollowingTheComposer
                  - TranscriptEntryViewModel_Summary_MarksAndAttachments_AreCountedWithTheirNouns
                  - ChatPanelView_New_ShowsEmptyTranscriptHintComposerAndButtons
                  - ChatPanelView_Send_TypedText_AppearsInTranscriptAndEmptiesTheEditor
                  - ChatPanelView_Send_TwoMessages_AreListedInOrder
                  - ChatPanelView_Send_MessageWithMarkAndFile_ShowsChipsInTranscriptWithoutDeleteButtons
                  - ChatPanelView_Send_MessageWithChip_BubbleSizesToTheChipRowAndTheWords
                  - ChatPanelView_Send_DictatedWords_AreShownWithTheDictatedBackground
                  - ChatPanelView_MarkChipDoubleClicked_OpensItsNoteAndChipShowsTheChangedNote

              - id: CanvasPilot-ChatPanel-SendFromPanel
                title: >-
                  The ChatPanel shall offer a Send button, an icon button named Send, that can be used exactly when the
                  composer can send the message, shall add the message to the transcript when it was sent and the panel's
                  editing control shall then be empty, and, when sending fails, shall leave the draft as it was, add
                  nothing to the transcript, and show the reason that the composer gives.
                justification: |
                  Sending is one decision, and the composer owns it: a project is open, the message has words or chips,
                  nobody holds the talk button, and nothing is being sent. The panel must show that decision and not
                  make its own, so that the button never promises what the composer will refuse. A message that could
                  not be sent must not be lost or half sent, so the draft stays and the user is told why.
                tests:
                  - ChatPanelViewModel_CanSend_FollowsProjectContentAndTalkButton
                  - ChatPanelViewModel_Send_BuildFails_KeepsDraftAndTranscriptUnchangedAndSaysWhy
                  - ChatPanelView_NoProject_SaysSoAndDisablesSendAndTalk
                  - ChatPanelView_Send_TypedText_AppearsInTranscriptAndEmptiesTheEditor
                  - ChatPanelView_ComposerCard_PlaceholderNamesAndHint

              - id: CanvasPilot-ChatPanel-SendWithEnterKey
                title: >-
                  The ChatPanel shall send the message when the Enter key is pressed on its own in the editing control
                  and the message can be sent, shall write a line break in the message when Enter is pressed with Shift
                  and send nothing, and shall say beside the Send button that Enter sends.
                justification: |
                  Most people expect Enter to send a message in a conversation and Shift with Enter to start a new line,
                  and the composer is also used to write longer messages with several lines, so the second way must
                  remain. The hint saves the user from finding out by sending too early. Whether the message can be sent
                  stays with the composer, so the key can never send what the button would refuse.
                tests:
                  - ChatPanelView_EnterKey_SendsTheMessageAndShiftEnterWritesALineBreak
                  - ChatPanelView_ComposerCard_PlaceholderNamesAndHint

              - id: CanvasPilot-ChatPanel-AttachFiles
                title: >-
                  The ChatPanel shall offer an Attach files button that, while a message can be written, asks the picker
                  of files that the window gives it for files, starting in the folder of the open project, and adds the
                  files that were chosen to the message as attachment chips, the same way as a drop of the files does.
                justification: |
                  Not everyone knows that files can be dropped on the message, and a drop is hard to do with the keyboard
                  or on a small screen. A button that opens the file dialog of the system makes the same thing easy to
                  find. The panel does not show the dialog itself, because a dialog needs the main window as its owner;
                  it asks through a seam, so that the button can be used and tested without a window, and it adds the
                  files the way a drop does so that the rules of the intake stay in one place.
                tests:
                  - ChatPanelView_AttachButton_AddsThePickedFilesAsChips

              - id: CanvasPilot-ChatPanel-LinkMarkChips
                title: >-
                  The ChatPanel shall add the chip of every mark that is drawn on the picture to the message at the
                  caret as one undo step, shall tell the annotation layer after every change of the message which mark
                  chips it holds and whether marks can be made, so that undoing the chip hides the mark and redoing it
                  shows the mark again, and shall leave no mark on the picture after the message is sent.
                justification: |
                  A mark is part of what the user says only while its chip is in the message, so one undo system must
                  cover the marks too. The annotation layer and the composer do not know each other, because the
                  composer already uses the annotation subsystem; the panel is where they meet, and the user must find
                  the mark where the caret was, as with any other thing that is put into the message.
                tests:
                  - ChatPanelViewModel_MarkDrawn_BecomesOneChipStepAndUndoHidesTheMark
                  - ChatPanelViewModel_DrawingAllowed_FollowsWhetherAMessageCanBeWritten
                  - ChatPanelViewModel_Send_MessageWithMark_LayerShowsNoMarkAfterwards
                  - ChatPanelView_MarkDrawn_ChipAppearsInTheEditorAndUndoRemovesIt

              - id: CanvasPilot-ChatPanel-ClearMarkChips
                title: >-
                  The ChatPanel shall take the chips of all marks out of the message when the annotation layer asks for
                  its marks to be cleared, so that the picture then shows no mark and the message holds none.
                justification: |
                  A user who has marked a picture many times and wants to start over should not have to delete each chip.
                  The annotation layer and the composer do not know each other, so the panel passes the request on and
                  the composer removes the chips as it removes any chip, which keeps one undo system for the message.
                tests:
                  - AnnotationToolbarView_ClearMarks_TakesTheMarkChipsOutOfTheMessage

              - id: CanvasPilot-ChatPanel-OpenMarkNoteFromChip
                title: >-
                  The ChatPanel shall have the annotation layer open the note of a mark for changing when the composer
                  passes on the user's request from the mark's chip; when the layer cannot open it, because no picture is
                  shown or a shape is being drawn, shall add an information notice to the transcript that names the mark
                  and says what to do, without repeating a notice that is the last row; and shall stop following the
                  requests when it is released.
                justification: |
                  The composer and the annotation layer do not know each other; the panel already joins them for the
                  chips of marks, so it also passes on the request to change a note. The note card is on the layer over
                  the picture, so it cannot open while no picture is shown or while a shape waits to be finished; a
                  request that seemed to be ignored would leave the user guessing, so the panel says why and what to do,
                  once. A released panel must not act on a composer it no longer shows.
                tests:
                  - ChatPanelViewModel_MarkNoteEditRequested_OpensTheNoteOnTheLayer
                  - ChatPanelViewModel_MarkNoteEditRequested_LayerCannotOpen_ShowsNoticeWithWhatToDo
                  - ChatPanelViewModel_Dispose_StopsFollowingTheComposer
                  - ChatPanelView_MarkChipDoubleClicked_OpensItsNoteAndChipShowsTheChangedNote

              - id: CanvasPilot-ChatPanel-HoldToTalkButton
                title: >-
                  The ChatPanel shall start listening when the pointer is pressed on the talk button, or the space or
                  enter key is pressed on it, and end it when the pointer is released wherever it is, the pointer
                  capture is lost, the button loses the focus, the key is released, or the panel is removed from the
                  window, once for each hold; shall show the words recognized so far while it listens; shall give the
                  button, which shows an icon, an accessible name that says what it is doing now; and shall leave the
                  button unusable while no message can be written.
                justification: |
                  Dictation must listen exactly as long as the user holds the button, and the microphone must never
                  stay open because a release was missed: a release outside the button, a window that loses the pointer
                  when a dialog opens, and a panel that goes away are all ways of letting go. The keyboard must be able
                  to hold the button as well, so that dictation does not need a pointer. The name tells the user, and a
                  screen reader, whether the application is starting, listening, or finishing, which can take a moment
                  the first time, although the button itself shows no text.
                tests:
                  - ChatPanelViewModel_TalkText_FollowsDictationState
                  - ChatPanelViewModel_PushToTalk_PressSpeakRelease_AddsOneDictatedBlockAsOneStep
                  - ChatPanelViewModel_PushToTalk_SecondPressWhileHeld_IsIgnored
                  - ChatPanelViewModel_CanTalk_NoProject_IsFalse
                  - ChatPanelView_HoldToTalk_PressSpeakRelease_ListensShowsWordsAndAddsOneBlock
                  - ChatPanelView_HoldToTalk_ReleaseOutsideTheButton_StillEndsListening
                  - ChatPanelView_HoldToTalk_PointerCaptureLost_EndsListening
                  - ChatPanelView_HoldToTalk_SpaceKeyHeldOnFocusedButton_ListensUntilReleased
                  - ChatPanelView_HoldToTalk_PanelRemovedWhileHeld_EndsListening
                  - PushToTalkHints_ChatPanel_KeyCapTooltipAndTipFollowTheSetting

              - id: CanvasPilot-ChatPanel-ShowWhyDictationCannotWork
                title: >-
                  The ChatPanel shall show in the panel, when the talk button is pressed while dictation cannot work,
                  the reason and what to do that the dictation service gives, without listening and without changing
                  the message, and shall prepare dictation ahead of the first press when the panel is shown, never
                  failing because of it.
                justification: |
                  Dictation depends on a downloaded model, a microphone the operating system lets the application use,
                  and files that the application ships, and any of them can be missing. A button that does nothing
                  leaves the user guessing, so the panel says which of them is the problem and where to fix it. Loading
                  the engine takes a while, so it is done ahead of time, but a machine that cannot do it must still
                  be able to type.
                tests:
                  - ChatPanelViewModel_PushToTalk_NoModelChosen_ShowsReasonAndChangesNothing
                  - ChatPanelViewModel_PrepareDictation_PreparesOnceAndSwallowsFailure
                  - ChatPanelViewModel_PrepareDictation_NoDictationService_DoesNothing
                  - ChatPanelView_HoldToTalk_NoModelChosen_ShowsReasonInPanelAndChangesNothing
                  - ChatPanelView_Shown_PreparesDictation

              - id: CanvasPilot-ChatPanel-ProvideChipPictures
                title: >-
                  The ChatPanel shall give the chips of the message being written and of the sent messages their
                  pictures: for a mark the area around it cut from the picture it was drawn on, for an attached picture
                  a small preview of the file, taken for a sent message from its copy in the project, and an icon for
                  everything else or when a picture cannot be made, without ever failing or holding up typing.
                justification: |
                  A chip that only says "Mark 2" does not tell the user which mark that is. The area around the mark
                  and the preview of the picture show it at a glance. Making them can be slow and can fail for a file
                  that is not a picture, so they are made in the background and a failure leaves the icon. A sent
                  message shows what was sent, so its pictures come from the project's copy and from the payload.
                tests:
                  - ChipThumbnailProvider_GetThumbnail_NoPictureOrFailure_GivesNullAndDoesNotThrow
                  - TranscriptEntryViewModel_Items_AttachedPicture_AsksForTheCopyInTheProject
                  - ChatPanelView_MarkChipInDraft_ShowsThePictureAroundTheMark

              - id: CanvasPilot-ChatPanel-RequestPayloadInspection
                title: >-
                  The ChatPanel shall offer on every sent message that has a payload a "View payload" command that asks
                  the payload inspector launcher to show the inspector for exactly that message's payload, shall do
                  nothing while no launcher is set, and shall not offer the command for a message without a payload.
                justification: |
                  The user must be able to see what the assistant would receive for a message, as a check that the
                  marks, the files, and the words went together as meant. The panel does not know what shows a window,
                  because that needs the main window; it asks through a seam, so it can be used and tested without
                  one.
                tests:
                  - TranscriptEntryViewModel_ViewPayloadCommand_ShowsInspectorForThePayloadOfTheMessage
                  - TranscriptEntryViewModel_ViewPayloadCommand_NoLauncherOrNoPayload_DoesNothing
                  - ChatPanelView_ViewPayloadButton_ShowsInspectorOfThatMessage

              - id: CanvasPilot-ChatPanel-HoldTranscriptRows
                title: >-
                  The ChatPanel shall hold the transcript as one family of rows of four kinds, the sent message of the
                  user, the reply of the AI copilot, the line of a tool call, and the notice, each telling its kind so that
                  the view can show it in its own way; shall keep the sent message with its payload and its summary as
                  one of them; shall make a reply grow while it streams, make its text final only when it is completed,
                  and keep the text and mark the reply when it is stopped or failed, never changing a reply that has
                  ended; shall make a tool row that says what is under way and then what was done, whether it worked or
                  failed, how long the call took when that was at least a tenth of a second, and whether it carried a
                  picture; and shall make a notice that is immutable and holds its message, what to do about it, and
                  whether the settings can help.
                justification: |
                  A conversation with a copilot is more than the messages of the user: the answer arrives piece by piece,
                  the copilot works with tools, and things go wrong. One family of rows lets the panel show them in the
                  order they happened. A reply must not look final while it is still written, because the view shows
                  final text with its formatting, and a reply that was cut short must not be shown as whole. A tool that
                  failed must be told from one that worked by more than a color, and a call that took a noticeable time
                  says so, while a call that took no time says nothing that would only be noise.
                tests:
                  - AssistantReplyViewModel_StreamThenComplete_GrowsAnnouncesAndIsFinalOnlyWhenCompleted
                  - AssistantReplyViewModel_StopOrFail_KeepsTextAndNamesWhatBecameOfIt
                  - AssistantReplyViewModel_Restored_IsInTheGivenStateAndRefusesNoText
                  - ToolActivityRowViewModel_StartFileReportAndFinish_KeepTheReportOnlyWhenTheToolWorked
                  - ToolActivityRowViewModel_RestoredAndAbandoned_AreEndedAndArgumentsAreChecked
                  - ToolActivityRowViewModel_Finish_ShowsOutcomeAndElapsedTime
                  - ToolActivityRowViewModel_DisplaySummary_ShowsNoBackticks
                  - NoticeRowViewModel_ErrorWithRemedyAndInformation_HoldWhatTheyWereGiven
                  - TranscriptRows_Kinds_TheEntryOfAMessageIsTheUserRow

              - id: CanvasPilot-ChatPanel-GroupCopilotRows
                title: >-
                  The ChatPanel shall tell each row of the transcript whether it opens a group, which the first row of
                  the transcript does and so does the first row of the copilot after a message of the user or a notice,
                  and shall tell it again whenever the rows change, so that the name of the copilot is shown once for a
                  run of replies and tool calls and the first row of a restored conversation can say that it is from
                  earlier.
                justification: |
                  A conversation reads like a chat between two people: the name of the one who speaks is given when the
                  speaker changes and not above every line, and the lines that were restored from an earlier session are
                  set apart from the new ones. Which row begins a run depends on the rows around it, which only the
                  transcript knows, so the panel decides it and the views only show it.
                tests:
                  - ChatPanelViewModel_Transcript_MarksTheRowsThatOpenAGroup

              - id: CanvasPilot-ChatPanel-ConverseWithCopilot
                title: >-
                  The ChatPanel, when it has an AI copilot, shall start a turn for every message that was sent and show
                  the answer in rows after the message in the order in which things happen: the text as plain selectable
                  text while it streams and drawn as Markdown once the reply is complete, a line for each tool call, and
                  the notices; shall block the composer from sending while the turn runs, while the message can still be
                  written, and show an indicator that the copilot is working; shall stop the turn and drop its rows when
                  the project changes, and stop it when the panel is disposed; and, when it has no copilot, shall only add
                  the entry of the message and show and block nothing of the copilot.
                justification: |
                  The user draws by talking, so a message must get an answer in the same place, as it is written, and the
                  answer must be readable: plain text is cheap to grow, and the formatting that the model meant (lists,
                  headings, code) is shown when the text is final and cannot change under the reader. Only one turn runs
                  at a time, so the panel makes the composer wait and says why instead of letting a message fail late.
                  A turn belongs to its project, so a change of project must not let the answer of one project appear in
                  another. A panel without a copilot is how the panel was tested before and must keep working.
                tests:
                  - ChatPanelViewModel_Send_WithCopilot_StartsTurnStreamsReplyAndMakesMarkdownWhenComplete
                  - ChatPanelViewModel_TurnRuns_ComposerCannotSendAndBusyIsAnnouncedUntilTheTurnEnds
                  - ChatPanelViewModel_ToolCalled_AddsToolRowInOrderWithItsResult
                  - ChatPanelViewModel_ProjectChangesWhileTurnRuns_StopsItAndDropsWhatItStillSays
                  - ChatPanelViewModel_Dispose_WhileTurnRuns_StopsTheTurn
                  - ChatPanelViewModel_NoCopilot_OnlyAppendsTheEntryAndBlocksNothing
                  - AssistantReplyViewModel_Blocks_AreMarkdownOnlyOnceCompleted
                  - ChatPanelView_CopilotAnswer_StreamsPlainTextThenMarkdownWhenComplete
                  - ChatPanelView_CopilotWorking_ShowsIndicatorAndStopAndBlocksSend
                  - ChatPanelView_ToolCalls_ShowToolRowsInOrder
                  - ChatPanelView_NoCopilot_ShowsNoBannerIndicatorOrStop

              - id: CanvasPilot-ChatPanel-StopCopilotTurn
                title: >-
                  The ChatPanel shall offer a Stop button that is shown and can be used exactly while a turn of the AI
                  copilot runs, shall stop the turn when it is pressed, keep the text written so far in a reply marked as
                  stopped, and let the composer send again, and shall show a failed turn as an error row with what
                  happened and what to do and, when the settings can help, an "Open Settings" action that raises a
                  request that the host handles.
                justification: |
                  A model that is slow or on a wrong path must be stopped at once without losing what it said, and a
                  provider that is not running or a model that is missing is an everyday event that the user can fix in
                  the settings. The panel does not know what shows the settings, so it raises a request, which keeps the
                  panel free of the application shell.
                tests:
                  - ChatPanelViewModel_Stop_KeepsPartialTextMarksItStoppedAndFreesTheComposer
                  - ChatPanelViewModel_TurnFails_ShowsNoticeWithRemedyAndOpenSettingsRaisesTheRequest
                  - NoticeRowViewModel_OpenSettingsCommand_CallsWhatItWasGivenOrNothing
                  - ChatPanelView_Stop_CancelsTurnKeepsPartialTextAndEnablesSend
                  - ChatPanelView_ProviderFails_ShowsErrorRowWithRemedyAndOpenSettings

              - id: CanvasPilot-ChatPanel-ReportProviderReadiness
                title: >-
                  The ChatPanel shall ask the AI copilot whether the configured provider can be used when it is shown, on
                  request, and whenever the host asks again, shall show the sentence of the answer, which says what to do,
                  in a banner with buttons that open the settings and check again, shall show a warning that does not
                  block sending in the same way, shall hide the banner when everything is ready, and shall show a check
                  that fails as a sentence in the banner without throwing.
                justification: |
                  A chat that fails on the first message with the error of a library is a poor first experience, and the
                  copilot already words the one sentence that says what is missing and what to do, including that GitHub
                  Copilot cannot be used in this build yet. The panel shows it where the user is about to type, without
                  knowing the settings: whoever does knows when they change and asks again.
                tests:
                  - ChatPanelViewModel_RefreshReadiness_ShowsTheActionableSentenceAndHidesItWhenReady
                  - ChatPanelViewModel_RefreshReadiness_CheckThrows_ShowsTheProblemInTheBanner
                  - ChatPanelView_Readiness_ShowsTheSentenceOffersSettingsAndHidesWhenReady

              - id: CanvasPilot-ChatPanel-RestoreChatHistory
                title: >-
                  The ChatPanel, when it is given a chat history store and the project service, shall save the words of
                  every message and of what followed it, as soon as its turn has ended or was stopped, shall show the saved
                  conversation of a project as rows of text when the project is opened (a restored message with its
                  words, the labels of its marks and attachments, and a line for each mark note and attachment, but no
                  picture and no payload), shall give the saved words to the AI copilot with the next message so that the
                  conversation can go on, shall keep the conversation of each project apart, shall say in a notice, which
                  is not saved, when the history cannot be saved, and, without a store or a project service, shall keep
                  the transcript in memory only.
                justification: |
                  A conversation that is gone when the project is closed makes the copilot start over each day, and the
                  user must be able to read what was said. Only words are kept, so that nothing large or private beyond
                  the user's own words is stored, and the restored rows say that pictures are not kept. The words are given
                  to a new provider session as text, which works with every provider. A conversation belongs to its
                  project, and a failure to save is a fact the user may need to know but must not stop the conversation.
                tests:
                  - ChatPanelViewModel_TurnCompleted_SavesTextRowsOutsideTheProject
                  - ChatPanelViewModel_TurnStopped_SavesTheStoppedReply
                  - ChatPanelViewModel_TurnFailed_SavesTheMessageButNotTheNotice
                  - ChatPanelViewModel_OpenProjectWithHistory_ShowsSavedConversationAsTextRows
                  - ChatPanelViewModel_New_ProjectAlreadyOpen_RestoresTheConversation
                  - ChatPanelViewModel_SendAfterRestore_GivesTheCopilotTheSavedTextAsRestoredHistory
                  - ChatPanelViewModel_ProjectChanges_EachProjectHasItsOwnConversation
                  - ChatPanelViewModel_ProjectChangesWhileTurnRuns_SavesNothingIntoTheNewProject
                  - ChatPanelViewModel_SaveFails_ShowsAnErrorNoticeAndTheConversationGoesOn
                  - ChatPanelViewModel_HistoryRootInsideTheProject_SaysSoAndWritesNothingIntoTheProject
                  - ChatPanelViewModel_NoCopilot_SavesTheMessageWhenItIsSent
                  - ChatPanelViewModel_NoStoreOrNoProjectService_SavesAndRestoresNothing
                  - ChatHistoryMapper_ToHistoryRows_SentMessageAndRows_KeepsWordsLabelsNotesAndPathsOnly
                  - ChatHistoryMapper_ToTranscriptRowAndToAgentTurns_CoverEveryKind
                  - RestoredEntryViewModel_New_OnlyUserRows_AndSummaryCountsMarksAndAttachments
                  - RestoredEntryViewModel_New_ChipLabelGluedToWords_GetsASpace
                  - ChatPanelView_RestoredHistory_ShowsTextRowsWithoutPayloadButtonOrPictures

              - id: CanvasPilot-ChatPanel-ClearChatHistory
                title: >-
                  The ChatPanel shall offer, in the menu of more actions in its header, a Clear chat history item that,
                  without asking first, deletes the saved history of the open project, empties the transcript except
                  for a notice that says so (which is not saved), and makes the AI copilot forget the conversation,
                  stopping a turn that runs and dropping what it still says, and shall say in an error notice when the
                  saved history could not be deleted.
                justification: |
                  The words of a conversation are the user's own, and the user must be able to get rid of them from the
                  screen, from the computer, and from the provider's session in one step. The application has no
                  confirmation dialog, and an item that is named for what it does and that sits in the menu of the
                  header of the conversation, out of the way of the buttons that are used all the time, is not chosen
                  by accident; the notice tells what happened. A turn that runs belongs to the conversation that is
                  cleared, so it must not write into the next one.
                tests:
                  - ChatPanelViewModel_ClearHistory_DeletesTheStoredHistoryEmptiesTheTranscriptAndResetsTheCopilot
                  - ChatPanelViewModel_ClearHistory_WhileTurnRuns_StopsItDropsItsRowsAndSavesNothing
                  - ChatPanelViewModel_ClearHistory_WithoutStoreAndCopilot_EmptiesTheTranscript
                  - ChatPanelViewModel_ClearHistory_StoreCannotDelete_ShowsAnErrorNotice
                  - ChatPanelView_ClearChatHistoryButton_ClearsTranscriptDeletesHistoryAndSendStaysEnabled
                  - ChatPanelView_ClearChatHistoryButton_NothingSaid_ShowsOnlyTheNotice

              - id: CanvasPilot-ChatPanel-OfferPrompts
                title: >-
                  The ChatPanel shall, while the conversation is empty, ask "What would you like to draw?", offer example
                  prompts and a tip that names the talk key, and write the prompt that the user chooses into the message,
                  ready to be sent; shall offer the prompts that fit the project (ways to start while it has no drawing,
                  ways to refine once a picture is shown, the copilot wrote a drawing, or the project folder holds one, and
                  the export only while a picture is shown), judged again when the project, the picture, or a turn changes;
                  and shall offer none while the copilot works, and shall show them above the message only once a
                  conversation exists.
                justification: |
                  A blank panel does not tell a new user what the assistant can do. Examples that fill in the message
                  show it and save typing, and because the prompt lands in the message and is not sent, the user can
                  change it first. "Add a legend" means nothing in a project with no drawing, and "Draw a flowchart" is no
                  help to someone who has one, so the prompts follow what the project has. Follow-ups are only useful
                  when there is something to follow up, so they wait for the first message.
                tests:
                  - ChatPanelView_EmptyState_ExamplePromptFillsTheMessageAndSuggestionsWaitForAConversation
                  - ChatPanelViewModel_PromptsAndCollapse_WriteTheMessageAndAnnounce
                  - ChatPanelViewModel_EmptyProject_OffersStarterPrompts
                  - ChatPanelViewModel_TurnWritesDrawing_SuggestionsHideWhileBusyThenBecomeRefinements
                  - ChatPanelViewModel_TurnWritesNotes_StillOffersStarterPrompts
                  - ChatPanelViewModel_OpenProject_WithDrawingOffersRefinementsAndEachProjectIsJudgedAlone
                  - ChatPanelViewModel_PictureShown_OffersRefinementsWithExport

              - id: CanvasPilot-ChatPanel-HideConversation
                title: >-
                  The ChatPanel shall offer in its header a button that asks the host to hide the conversation, by
                  raising a request each time it is used, and shall leave the hiding, and the way back, to the host.
                justification: |
                  The drawing is the point of the application, and the conversation takes a third of the window. The user
                  must be able to give the space to the picture. The panel does not know the window around it, so it
                  raises a request that the workspace handles, and it can be placed in any column.
                tests:
                  - ChatPanelView_CollapseButton_RaisesCollapseRequested
                  - ChatPanelViewModel_PromptsAndCollapse_WriteTheMessageAndAnnounce

              - id: CanvasPilot-ChatPanel-NameIconButtons
                title: >-
                  The ChatPanel shall give each of its buttons that shows an icon and no text, the menu of more actions,
                  the button that hides the panel, the attach button, the talk button, and the Send button, an accessible
                  name and a tooltip, a size of at least 28 by 28 pixels, and a place in the order of the keyboard, in
                  the dark and the light theme.
                justification: |
                  A button with only a picture is of no use to someone who uses a screen reader, who cannot see the
                  picture, or who has not met the symbol before, and a small target is hard to hit with a pointer or a
                  finger. The tooltip and the name tell what each button does, and the keyboard must reach all of them.
                tests:
                  - Accessibility_Windows_ControlsHaveNamesTooltipsFocusAndSize
                  - ChatPanelView_ComposerCard_PlaceholderNamesAndHint

              - id: CanvasPilot-ChatPanel-ShowBusyStatus
                title: >-
                  The ChatPanel shall show, in the row that tells that the copilot works, what the copilot is doing, the
                  time that the turn has lasted, and the hint about a long wait when there is one, shall announce each of
                  them when it changes, and shall show nothing of them when no turn runs.
                justification: |
                  The user decides whether to wait or to stop from what the busy row says, so it must follow the status of
                  the turn that the runner keeps and not a constant sentence.
                tests:
                  - ChatPanelViewModel_TurnRuns_BusyRowShowsPhaseElapsedTimeAndHint
                  - ChatPanelView_CopilotProgress_BusyRowShowsElapsedTimeAndWhatIsReported

              - id: CanvasPilot-ChatPanel-ShowStopping
                title: >-
                  The ChatPanel shall, from the moment that Stop is pressed until the turn has ended, say in the busy row
                  that the copilot is stopping and not allow Stop to be pressed again, and shall announce the change.
                justification: |
                  The user must see within one moment that Stop was heard, and a second press must not do anything else.
                tests:
                  - ChatPanelViewModel_Stop_ShowsStoppingAndDisablesStopUntilTheTurnEnds
                  - ChatPanelView_Stop_ShowsStoppingUntilTheTurnEnds
