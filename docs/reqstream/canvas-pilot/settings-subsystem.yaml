---
# Settings Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasPilot Settings subsystem
# - The Settings subsystem spans SettingsService (SettingsService.cs, ISettingsService.cs, AppSettings.cs),
#   SettingsDialog (SettingsDialogViewModel.cs, ISettingsPage.cs, SettingsDialogView.axaml), and
#   AiProviderSettingsPage (AiProviderSettingsPageViewModel.cs, AiProviderSettingsPageView.axaml)
# - Subsystem requirements describe the persistence and editing behavior that satisfies the system-level
#   settings requirements

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Settings Subsystem Requirements
        requirements:
          - id: CanvasPilot-Settings-PersistUserSettings
            title: >-
              The Settings subsystem shall persist user settings in a single versioned per-user file
              that is restored on the next run.
            justification: |
              Users expect their choices to survive a restart. One versioned file in the per-user
              application data folder needs no administrator rights and lets the format evolve without
              breaking existing installations. Settings owned by other subsystems share the file, so
              saving one subsystem's values must never discard another's.
            children:
              - CanvasPilot-SettingsService-LocateSettingsFile
              - CanvasPilot-SettingsService-RoundTripVersionedSettings
              - CanvasPilot-SettingsService-WriteAtomically
              - CanvasPilot-SettingsService-NotifyChanges
            tests:
              - SettingsSubsystem_PersistSettings_DialogOk_SurvivesRestart

          - id: CanvasPilot-Settings-ToleratePoorSettingsFiles
            title: >-
              The Settings subsystem shall keep working with defaults when the settings file is missing,
              corrupt, or from a newer version.
            justification: |
              A damaged or unexpected settings file must never prevent the application from starting or
              the user from changing settings. Keeping a corrupt file aside, rather than deleting it,
              preserves it for diagnosis.
            children:
              - CanvasPilot-SettingsService-ToleratePoorFiles
            tests:
              - SettingsSubsystem_ToleratePoorFiles_CorruptFile_DialogStillWorks

          - id: CanvasPilot-Settings-EditSettingsInDialog
            title: >-
              The Settings subsystem shall let the user edit settings in a modal dialog whose changes
              take effect only when the user chooses OK or Apply.
            justification: |
              A dialog with a page list lets each subsystem contribute its own settings page without
              the dialog depending on them. Editing a working copy lets the user back out of changes,
              and blocking invalid entries keeps bad values out of the stored settings.
            children:
              - CanvasPilot-SettingsDialog-HostPages
              - CanvasPilot-SettingsDialog-ApplyOrDiscardChanges
              - CanvasPilot-SettingsDialog-BlockInvalidSettings
              - CanvasPilot-SettingsDialog-ReportSaveFailure
              - CanvasPilot-SettingsDialog-NotifyPagesOnClose
            tests:
              - SettingsSubsystem_EditSettings_DialogCancel_LeavesStoredSettingsUnchanged

          - id: CanvasPilot-Settings-RememberLayoutAndAppearance
            title: >-
              The Settings subsystem shall remember the layout of the main window, the theme choice, the options of the
              project explorer, and when each recent project was opened, together with the other settings, and keep them when
              the user changes other settings in the dialog.
            justification: |
              A window that opens as it was left, in the theme the user chose, is part of remembering the user's settings.
              The values share the one settings file with the choices of the other subsystems, so storing the choices of one
              part must never lose the others.
            children:
              - CanvasPilot-SettingsService-KeepWindowLayout
              - CanvasPilot-SettingsService-KeepAppearance
              - CanvasPilot-SettingsService-KeepRecentProjectOpenTimes
            tests:
              - SettingsSubsystem_RememberLayoutAndAppearance_SavedWithOthers_SurviveRestartAndDialogChanges

          - id: CanvasPilot-Settings-ConfigureAiProvider
            title: >-
              The Settings subsystem shall let the user choose and store the AI provider, the model from the list that the
              provider offers (or typed when it cannot be listed), the reasoning level that the model offers, the context
              window of Ollama, the endpoint, and the Copilot tool path, show what each model can do and warn about what it
              lacks, not offer the unrestricted agent tools but keep the stored value, warn about a small context window,
              and check the connection to the provider that the entries describe.
            justification: |
              The AI provider choices must be stored so the user can configure the application once. The choices are
              validated when entered so a bad value is caught at the dialog rather than when the copilot is later
              started, a connection check shows at once whether the provider can be used, and the list of models with their
              capabilities lets the user choose a model that can do the work instead of typing an id that may not exist.
              Settings that the user cannot act on are not offered, so the user is not offered a choice that does nothing.
            children:
              - CanvasPilot-AiProviderSettingsPage-EditProviderChoices
              - CanvasPilot-AiProviderSettingsPage-ValidateContextWindow
              - CanvasPilot-AiProviderSettingsPage-ValidateOllamaEndpoint
              - CanvasPilot-AiProviderSettingsPage-CopilotCliPathOverride
              - CanvasPilot-AiProviderSettingsPage-HideUnrestrictedTools
              - CanvasPilot-AiProviderSettingsPage-ExplainEntries
              - CanvasPilot-AiProviderSettingsPage-ListModels
              - CanvasPilot-AiProviderSettingsPage-FallBackToTypingTheModel
              - CanvasPilot-AiProviderSettingsPage-ChooseReasoningEffort
              - CanvasPilot-AiProviderSettingsPage-WarnBelowRecommendedContext
              - CanvasPilot-AiProviderSettingsPage-CheckConnection
              - CanvasPilot-SettingsService-DefaultContextWindow32768
              - CanvasPilot-SettingsService-KeepStoredContextWindow
              - CanvasPilot-SettingsService-MigrateReasoningLevel
            tests:
              - SettingsSubsystem_PersistSettings_DialogOk_SurvivesRestart

          - id: CanvasPilot-Settings-KeepStyleSettings
            title: >-
              The Settings subsystem shall keep the shared style kit folders and the default style kit of the user with the
              other settings, so that they survive a restart and a change of another setting does not lose them.
            justification: |
              Where a team keeps its style kits and which kit a new project starts with are choices of the user that apply
              to every project, so they belong with the stored settings. The settings dialog and other subsystems change
              their own values only, so each must leave these alone.
            children:
              - CanvasPilot-SettingsService-KeepStyleSettings
            tests:
              - SettingsSubsystem_KeepStyleSettings_SavedWithOthers_SurviveRestartAndOtherChanges
