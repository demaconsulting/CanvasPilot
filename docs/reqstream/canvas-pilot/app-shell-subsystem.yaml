---
# AppShell Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasPilot AppShell subsystem
# - The AppShell subsystem spans MainWindowShell (MainWindowShell.cs, IDialogService.cs,
#   MainWindowView.axaml, MessageDialogViewModel.cs, MessageDialogView.axaml), ProjectWorkspace
#   (ProjectWorkspaceViewModel.cs, ProjectWorkspaceView.axaml), and AboutDialog (AboutDialogViewModel.cs,
#   AboutDialogView.axaml), plus the composition root (ApplicationComposition.cs, App.axaml.cs) and the view
#   locator (ViewLocator.cs)
# - Subsystem requirements describe the application shell behavior that satisfies the system-level requirements

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: AppShell Subsystem Requirements
        requirements:
          - id: CanvasPilot-AppShell-ProvideMainWindow
            title: >-
              The AppShell subsystem shall provide a main window with File, Edit, Image, Tools, and Help menus
              through which the user creates, opens, saves, and closes projects, undoes and redoes changes to the
              message being written, changes settings, views information about the application, and exits, with the
              open project's name in the window title.
            justification: |
              The main window is the user's way into every capability of the application. A familiar menu
              structure, a title that names the open project, and problems reported in dialogs rather than
              failures let the user work with projects without knowing how the application is built.
            children:
              - CanvasPilot-MainWindowShell-ExposeMenus
              - CanvasPilot-MainWindowShell-TitleFollowsProject
              - CanvasPilot-MainWindowShell-CreateAndOpenProjects
              - CanvasPilot-MainWindowShell-SaveAndCloseProjects
              - CanvasPilot-MainWindowShell-ListRecentProjects
              - CanvasPilot-MainWindowShell-ShowSettingsAndAbout
              - CanvasPilot-MainWindowShell-ProvideImageMenuSeam
              - CanvasPilot-MainWindowShell-TalkToUserThroughDialogService
            tests:
              - AppShellSubsystem_ProjectLifecycle_NewSaveCloseReopenFromRecent
              - AppShellSubsystem_Settings_DialogOk_StoresChoicesForNextRun

          - id: CanvasPilot-AppShell-HostProjectWorkspace
            title: >-
              The AppShell subsystem shall show the open project's image files beside a content area that
              explains what is missing, with a place for a preview of the selected file.
            justification: |
              The user works on one image source file at a time. Showing the project's files next to the
              area that will show their preview, with a plain explanation while there is no project, file, or
              preview, keeps the window understandable at every step.
            children:
              - CanvasPilot-ProjectWorkspace-HostExplorerAndPreview
              - CanvasPilot-ProjectWorkspace-FollowOpenProject
            tests:
              - AppShellSubsystem_ManageFiles_RenameAndDelete_UpdateFolderAndExplorer

          - id: CanvasPilot-AppShell-ChatColumn
            title: >-
              The AppShell subsystem shall show the chat panel in a column on the right of the preview, with a
              splitter between them, while a project is open, and show no chat column while no project is open.
            justification: |
              Writing a message needs a project, because the attachments and marks belong to it. Showing the
              chat beside the picture, where the user can resize it, keeps what the message is about in view
              while it is written, and hiding it without a project keeps the window to what can be used.
            children:
              - CanvasPilot-ProjectWorkspace-HostChatColumn
            tests:
              - MainWindowView_Workspace_ChatColumnVisibleOnlyWithProject_ThreeColumns
              - AppShellSubsystem_ComposeApplication_ChatIsTheChatColumnAndTheTalkKeyTarget

          - id: CanvasPilot-AppShell-EditMenu
            title: >-
              The AppShell subsystem shall provide an Edit menu with Undo and Redo that act on the message being
              written while its editor has the focus, and are unavailable while the focus is elsewhere or there is
              nothing to undo or redo.
            justification: |
              Users look for Undo and Redo in the Edit menu and expect them to show whether they can be used. They
              must reach the message the user is writing in and nothing else, so the menu follows what has the focus.
            children:
              - CanvasPilot-MainWindowShell-RouteUndoRedoToFocusedTarget
            tests:
              - MainWindowView_EditMenu_TypingInComposerEnablesUndoAndExplorerFocusDisables
              - MainWindowView_Menus_HaveExpectedStructureAndAutomationIds

          - id: CanvasPilot-AppShell-PushToTalkKey
            title: >-
              The AppShell subsystem shall let the user dictate into the message by holding the F8 key anywhere in the
              main window: dictation starts when the key goes down, ignores the repeats of the key, and ends when the
              key is released, the window is closed, or the window is no longer active.
            justification: |
              A talk key lets the user dictate without leaving the keyboard or the pointer. A session that is not ended
              when the window loses the focus would keep the microphone open, because the release of the key goes to
              another window.
            children:
              - CanvasPilot-MainWindowShell-StartDictationFromKey
            tests:
              - MainWindowView_PushToTalkKey_DownAndUp_DrivesTarget
              - MainWindowView_PushToTalkKey_WindowDeactivatedWhileHeld_StopsTarget
              - AppShellSubsystem_ComposeApplication_ChatIsTheChatColumnAndTheTalkKeyTarget

          - id: CanvasPilot-AppShell-HostChat
            title: >-
              The AppShell subsystem shall place the chat panel in the workspace, make it what the talk key and the
              Edit menu reach, and make the main window the place where the panel shows the payload inspector.
            justification: |
              The units of the chat are independent of the window that shows them, so one place has to join them: the
              composition root puts the panel in the workspace and the shell, and the window, which owns the dialogs,
              is what the panel asks to show the inspector.
            tests:
              - AppShellSubsystem_ComposeApplication_ChatIsTheChatColumnAndTheTalkKeyTarget
              - MainWindowView_Show_ChatPanelLaunchesInspectorThroughWindow

          - id: CanvasPilot-AppShell-ManageProjectFiles
            title: >-
              The AppShell subsystem shall let the user rename and delete the files listed in the project
              explorer, ask for confirmation before deleting, and tell the user when a change is refused.
            justification: |
              Users reorganize their image files while working on them. A deletion cannot be undone, so
              confirming it protects the user's files, and a refused name or a locked file must be explained.
            children:
              - CanvasPilot-ProjectWorkspace-ConfirmDeleteAndPromptRename
            tests:
              - AppShellSubsystem_ManageFiles_RenameAndDelete_UpdateFolderAndExplorer

          - id: CanvasPilot-AppShell-ShowApplicationInformation
            title: >-
              The AppShell subsystem shall show the application's name, tagline, version, copyright, and the
              open source libraries it is built on in an About dialog.
            justification: |
              Users and support staff need to know which version of the application they are running, and the
              open source libraries the application is built on are acknowledged where users can see them.
            children:
              - CanvasPilot-AboutDialog-ShowApplicationIdentity
              - CanvasPilot-AboutDialog-ListDependencies
              - CanvasPilot-AboutDialog-CloseDialog
            tests:
              - AppShellSubsystem_About_ComposedShell_ShowsIdentityVersionAndLibraries

          - id: CanvasPilot-AppShell-DrawingKnowledgeMenu
            title: >-
              The AppShell subsystem shall let the user open the browser of the drawing knowledge from the Help menu of the
              composed application, over the catalog of cards of the application, in a window that stays open beside the
              work.
            justification: |
              The cards are of use only when the user can reach them while working. The application is composed in one
              place, so that is where the menu is joined to the catalog of the application, and the browser is shown through
              the window of the shell so that it belongs to it.
            children:
              - CanvasPilot-MainWindowShell-ShowDrawingKnowledge
            tests:
              - AppShellSubsystem_DrawingKnowledge_ComposedShell_ShowsBrowserOnTheCatalogOfTheApplication

          - id: CanvasPilot-AppShell-ComposeApplication
            title: >-
              The AppShell subsystem shall build the application's units at startup in dependency order, load
              the stored settings, build the chat panel that joins the layer for marks on the picture to the message
              being composed, join the layer to the preview pane, record the start and stop in the application log, and
              release the units on exit.
            justification: |
              One place that creates every unit and passes each its dependencies keeps the application's
              structure visible and testable, so the application starts the same way on every platform and
              in tests without a window, and settings that are stored are in effect from the first moment. The
              units that draw the marks and that hold the message do not know each other, so the one place that
              creates them also creates the chat panel, which makes the marks become chips and lets only a message
              that can be edited take marks.
            tests:
              - AppShellSubsystem_ComposeApplication_LoadsSettingsListsRecentProjectsAndLogs
              - AppShellSubsystem_ComposeApplication_AnnotationLayerIsOnThePictureAndFollowsTheOpenProject
              - AppShellSubsystem_ComposeApplication_ChatPanelFollowsTheOpenProject
              - AppShellSubsystem_Settings_ComposedShell_HostsAiProviderAndSpeechPages
              - AppShellSubsystem_Create_NullArguments_Throw
