---
# AppShell Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasPilot AppShell subsystem
# - The AppShell subsystem spans MainWindowShell (MainWindowShell.cs, IDialogService.cs,
#   MainWindowView.axaml, MessageDialogViewModel.cs, MessageDialogView.axaml), ProjectWorkspace
#   (ProjectWorkspaceViewModel.cs, ProjectWorkspaceView.axaml, WindowLayout.cs), StatusBar, ProviderPill, Welcome
#   (the start screen with its recent project cards), and AboutDialog (AboutDialogViewModel.cs,
#   AboutDialogView.axaml), ThemeResources (Styles/Tokens.axaml, Icons.axaml, Controls.axaml and the palettes of
#   App.axaml), plus the composition root (ApplicationComposition.cs, App.axaml.cs) and the view
#   locator (ViewLocator.cs)
# - Subsystem requirements describe the application shell behavior that satisfies the system-level requirements

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: AppShell Subsystem Requirements
        requirements:
          - id: CanvasPilot-AppShell-ProvideMainWindow
            title: >-
              The AppShell subsystem shall provide a main window with File, Edit, Image, Tools, and Help menus
              through which the user creates, opens, saves, and closes projects, undoes and redoes changes to the
              message being written, changes settings, views information about the application, and exits, with the
              open project's name in the window title.
            justification: |
              The main window is the user's way into every capability of the application. A familiar menu
              structure, a title that names the open project, and problems reported in dialogs rather than
              failures let the user work with projects without knowing how the application is built.
            children:
              - CanvasPilot-MainWindowShell-ExposeMenus
              - CanvasPilot-MainWindowShell-TitleFollowsProject
              - CanvasPilot-MainWindowShell-CreateAndOpenProjects
              - CanvasPilot-MainWindowShell-SaveAndCloseProjects
              - CanvasPilot-MainWindowShell-ListRecentProjects
              - CanvasPilot-MainWindowShell-ShowSettingsAndAbout
              - CanvasPilot-MainWindowShell-ProvideImageMenuSeam
              - CanvasPilot-MainWindowShell-TalkToUserThroughDialogService
            tests:
              - AppShellSubsystem_ProjectLifecycle_NewSaveCloseReopenFromRecent
              - AppShellSubsystem_Settings_DialogOk_StoresChoicesForNextRun

          - id: CanvasPilot-AppShell-HostProjectWorkspace
            title: >-
              The AppShell subsystem shall show the open project's image files beside a content area that
              explains what is missing, with a place for a preview of the selected file.
            justification: |
              The user works on one image source file at a time. Showing the project's files next to the
              area that will show their preview, with a plain explanation while there is no project, file, or
              preview, keeps the window understandable at every step.
            children:
              - CanvasPilot-ProjectWorkspace-HostExplorerAndPreview
              - CanvasPilot-ProjectWorkspace-FollowOpenProject
            tests:
              - AppShellSubsystem_ManageFiles_RenameAndDelete_UpdateFolderAndExplorer

          - id: CanvasPilot-AppShell-ChatColumn
            title: >-
              The AppShell subsystem shall show the chat panel in a column on the right of the preview, with a
              splitter between them, while a project is open, and show no chat column while no project is open.
            justification: |
              Writing a message needs a project, because the attachments and marks belong to it. Showing the
              chat beside the picture, where the user can resize it, keeps what the message is about in view
              while it is written, and hiding it without a project keeps the window to what can be used.
            children:
              - CanvasPilot-ProjectWorkspace-HostChatColumn
              - CanvasPilot-ProjectWorkspace-HideAndRestoreChat
            tests:
              - MainWindowView_Workspace_ChatColumnVisibleOnlyWithProject_ThreeColumns
              - AppShellSubsystem_ComposeApplication_ChatIsTheChatColumnAndTheTalkKeyTarget

          - id: CanvasPilot-AppShell-EditMenu
            title: >-
              The AppShell subsystem shall provide an Edit menu with Undo and Redo that act on the message being
              written while its editor has the focus, and are unavailable while the focus is elsewhere or there is
              nothing to undo or redo.
            justification: |
              Users look for Undo and Redo in the Edit menu and expect them to show whether they can be used. They
              must reach the message the user is writing in and nothing else, so the menu follows what has the focus.
            children:
              - CanvasPilot-MainWindowShell-RouteUndoRedoToFocusedTarget
            tests:
              - MainWindowView_EditMenu_TypingInComposerEnablesUndoAndExplorerFocusDisables
              - MainWindowView_Menus_HaveExpectedStructureAndAutomationIds

          - id: CanvasPilot-AppShell-PushToTalkKey
            title: >-
              The AppShell subsystem shall let the user dictate into the message by holding the F8 key anywhere in the
              main window: dictation starts when the key goes down, ignores the repeats of the key, and ends when the
              key is released, the window is closed, or the window is no longer active.
            justification: |
              A talk key lets the user dictate without leaving the keyboard or the pointer. A session that is not ended
              when the window loses the focus would keep the microphone open, because the release of the key goes to
              another window.
            children:
              - CanvasPilot-MainWindowShell-StartDictationFromKey
            tests:
              - MainWindowView_PushToTalkKey_DownAndUp_DrivesTarget
              - MainWindowView_PushToTalkKey_WindowDeactivatedWhileHeld_StopsTarget
              - AppShellSubsystem_ComposeApplication_ChatIsTheChatColumnAndTheTalkKeyTarget

          - id: CanvasPilot-AppShell-HostChat
            title: >-
              The AppShell subsystem shall place the chat panel in the workspace, make it what the talk key and the
              Edit menu reach, and make the main window the place where the panel shows the payload inspector.
            justification: |
              The units of the chat are independent of the window that shows them, so one place has to join them: the
              composition root puts the panel in the workspace and the shell, and the window, which owns the dialogs,
              is what the panel asks to show the inspector.
            tests:
              - AppShellSubsystem_ComposeApplication_ChatIsTheChatColumnAndTheTalkKeyTarget
              - MainWindowView_Show_ChatPanelLaunchesInspectorThroughWindow

          - id: CanvasPilot-AppShell-ManageProjectFiles
            title: >-
              The AppShell subsystem shall let the user rename and delete the files listed in the project
              explorer, ask for confirmation before deleting, and tell the user when a change is refused.
            justification: |
              Users reorganize their image files while working on them. A deletion cannot be undone, so
              confirming it protects the user's files, and a refused name or a locked file must be explained.
            children:
              - CanvasPilot-ProjectWorkspace-ConfirmDeleteAndPromptRename
              - CanvasPilot-ProjectWorkspace-AskForNamesOfNewFilesAndFolders
            tests:
              - AppShellSubsystem_ManageFiles_RenameAndDelete_UpdateFolderAndExplorer

          - id: CanvasPilot-AppShell-ShowApplicationInformation
            title: >-
              The AppShell subsystem shall show the application's name, tagline, version, copyright, and the
              open source libraries it is built on in an About dialog.
            justification: |
              Users and support staff need to know which version of the application they are running, and the
              open source libraries the application is built on are acknowledged where users can see them.
            children:
              - CanvasPilot-AboutDialog-ShowApplicationIdentity
              - CanvasPilot-AboutDialog-ListDependencies
              - CanvasPilot-AboutDialog-AcknowledgeIconSet
              - CanvasPilot-AboutDialog-CloseDialog
            tests:
              - AppShellSubsystem_About_ComposedShell_ShowsIdentityVersionAndLibraries

          - id: CanvasPilot-AppShell-ProvideThemes
            title: >-
              The AppShell subsystem shall show the main window and the standard controls in a dark and a light theme
              variant, with the brand accent and text that is easy to read, and shall change them when the theme variant
              that is asked for changes.
            justification: |
              People work in rooms and at hours that suit a dark or a light screen, and the operating system says which
              they prefer. A window that follows the theme with readable text and one accent looks like part of the
              system and can be read in both.
            children:
              - CanvasPilot-ThemeResources-DefineDesignTokens
              - CanvasPilot-ThemeResources-MeetContrast
              - CanvasPilot-ThemeResources-FollowVariantSwitch
              - CanvasPilot-ThemeResources-ProvideControlThemes
              - CanvasPilot-ThemeResources-ProvideButtonLooks
              - CanvasPilot-ThemeResources-ProvideTreeRowLook
            tests:
              - AppShellSubsystem_Themes_PaletteThemesStockControlsInBothVariants
          - id: CanvasPilot-AppShell-ApplyThemeChoice
            title: >-
              The AppShell subsystem shall show the open windows in the theme that the settings choose, dark, light, or the
              one of the operating system, from the start of the application and at once when the choice changes.
            justification: |
              People who choose a theme expect the window to follow without a restart, and the application composes the
              settings and the windows, which do not know each other, so it is the place that joins them.
            children:
              - CanvasPilot-ThemeResources-ApplyThemeChoice
            tests:
              - AppShellSubsystem_Themes_SettingsChoiceChangesTheVariantOfTheOpenWindow

          - id: CanvasPilot-AppShell-ShowKeyboardFocus
            title: >-
              The AppShell subsystem shall show which of its buttons and splitters has the focus when the focus is moved
              with the keyboard, on that control only.
            justification: |
              Someone who works with the Tab key and the arrow keys has to see where the focus is, or the window cannot be
              used without a pointer. Showing it on one control only keeps the window calm.
            children:
              - CanvasPilot-ThemeResources-ShowKeyboardFocus
            tests:
              - AppShellSubsystem_Themes_TabKeyShowsTheFocusRingOnTheFocusedControlOnly
              - Accessibility_ButtonThemes_TabKeyShowsTheFocusRingOnTheFocusedButtonOnly

          - id: CanvasPilot-AppShell-ProvideTitleBar
            title: >-
              The AppShell subsystem shall show a title bar that holds the menu, the name of the open project, the style
              list, and the AI provider pill, keep room for the buttons of the system, and open the window at a size that
              shows the explorer, the picture, and the chat.
            justification: |
              The title bar is the first thing the user sees and carries the two pills that decide whether work can
              proceed: the style of the drawings and the provider that answers. Keeping the menu there saves a row of the
              window for the picture, and the system buttons must stay usable.
            children:
              - CanvasPilot-MainWindowShell-ShowTitleBar
              - CanvasPilot-MainWindowShell-KeepRoomForSystemButtons
              - CanvasPilot-MainWindowShell-HaveNoFullScreenMode
              - CanvasPilot-MainWindowShell-OpenWithDesignSizes
              - CanvasPilot-MainWindowShell-HostProviderPillInTitleBar
            tests:
              - MainWindowView_Show_HasTitleBarWithMenuAndTheDesignSizes
              - MainWindowView_TitleBar_ShowsProjectNameThenApplicationName
              - MainWindowView_ProviderPill_InTheTitleBar_OpensTheSettingsOnTheProviderPage

          - id: CanvasPilot-AppShell-ShowStatusBar
            title: >-
              The AppShell subsystem shall show a status bar at the bottom of the main window, always and at one height,
              that says whether a project is open, whether a picture is selected, and, for the picture that is shown, its
              file, size, format, render time, and notes, or that it is being rendered or failed, with words and not color
              alone, and, while a project is open, that the project is saved and which key is held to talk.
            justification: |
              The user needs to know at a glance what is on the screen and in what state, and a bar that comes and goes
              moves the window. Words as well as colors let people who cannot tell the colors apart, and screen readers,
              know the state.
            children:
              - CanvasPilot-StatusBar-AlwaysShown
              - CanvasPilot-StatusBar-SayNothingToShow
              - CanvasPilot-StatusBar-ReportThePicture
              - CanvasPilot-StatusBar-ReportRenderingAndFailure
              - CanvasPilot-StatusBar-FollowTheWorkspace
              - CanvasPilot-StatusBar-ShowProjectHints
              - CanvasPilot-StatusBar-AnnounceToScreenReader
              - CanvasPilot-MainWindowShell-ShowStatusBarAtBottom
            tests:
              - MainWindowView_StatusBar_AlwaysShownAndReportsThePicture

          - id: CanvasPilot-AppShell-ShowProviderPill
            title: >-
              The AppShell subsystem shall show in the title bar of the main window a pill that names the AI provider and
              model that the settings choose and says with words and a dot whether the provider can be used, with the
              sentence of the check as its tooltip, and that opens the settings on the AI provider page when it is used.
            justification: |
              The user must know which provider answers and whether it works, and the way to fix a problem should be one
              click away, without a search through the menus.
            children:
              - CanvasPilot-ProviderPill-ShowProviderAndModel
              - CanvasPilot-ProviderPill-ShowTheStateWithWords
              - CanvasPilot-ProviderPill-ExplainInTooltip
              - CanvasPilot-ProviderPill-ReportMissingProvider
              - CanvasPilot-ProviderPill-OpenSettings
              - CanvasPilot-ProviderPill-ShowInTitleBar
              - CanvasPilot-ProviderPill-AnnounceToScreenReader
              - CanvasPilot-ProviderPill-StopFollowingWhenDisposed
            tests:
              - MainWindowView_ProviderPill_InTheTitleBar_OpensTheSettingsOnTheProviderPage

          - id: CanvasPilot-AppShell-ShowWelcomeScreen
            title: >-
              The AppShell subsystem shall show, in place of the workspace while no project is open, a welcome screen that
              introduces the application, offers to create or open a project, lists the six most recent projects as cards
              that open them and can be removed from the list, and tells when the AI provider needs something, and shall
              not build the workspace until a project is open.
            justification: |
              A window with no project has nothing to work on, so the first screen should show the next step and the way
              back to recent work, and should say early when the AI provider is not ready.
            children:
              - CanvasPilot-MainWindowShell-ShowWelcomeOrWorkspace
              - CanvasPilot-Welcome-ShowWhileNoProject
              - CanvasPilot-Welcome-DeferWorkspace
              - CanvasPilot-Welcome-IntroduceApplication
              - CanvasPilot-Welcome-OfferStartButtons
              - CanvasPilot-Welcome-ListRecentProjects
              - CanvasPilot-Welcome-TellOpeningTimeInWords
              - CanvasPilot-Welcome-CountPictures
              - CanvasPilot-Welcome-OpenProjectFromCard
              - CanvasPilot-Welcome-MoveBetweenCardsByKeyboard
              - CanvasPilot-Welcome-RemoveCardFromList
              - CanvasPilot-Welcome-InviteFirstProject
              - CanvasPilot-Welcome-NoticeAiProviderProblem
            tests:
              - WelcomeView_RecentProjects_ListCardsAndOpenAProject
              - MainWindowView_RecentProject_Open_ListsFilesAndCloseProjectResetsWindow
              - MainWindowView_Workspace_ChatColumnVisibleOnlyWithProject_ThreeColumns

          - id: CanvasPilot-AppShell-RememberWindowLayout
            title: >-
              The AppShell subsystem shall open the window with the size, place, and state, and the widths of the explorer
              and the chat column, that the user left, fitted to the screens that are connected and to the width of the
              window, and let the user resize the columns with the pointer or the keyboard.
            justification: |
              People arrange the window once and expect to find it so, also after a screen was removed, and a window that is
              narrow must still show every part of the work without cropping.
            children:
              - CanvasPilot-MainWindowShell-RememberWindowLayout
              - CanvasPilot-ProjectWorkspace-ResizeColumns
              - CanvasPilot-ProjectWorkspace-FitColumnsToWindow
              - CanvasPilot-ProjectWorkspace-FitSavedWindowToScreens
            tests:
              - WorkspaceLayout_WindowWidth_NothingIsCroppedAndTheExplorerGivesUpRoomFirst
              - WorkspaceLayout_Splitters_SavedWidthsUsedAndKeyboardChoiceSaved
              - WorkspaceLayout_CloseWindow_SavesTheSizeAndANewWindowOpensWithIt

          - id: CanvasPilot-AppShell-MakeWindowsAccessible
            title: >-
              The AppShell subsystem shall make the windows usable with the keyboard and a screen reader: the whole menu has
              access keys, buttons that show only an icon have a name, a tooltip, and a target of at least 28 by 28 pixels,
              fields have names, and the text of notices, the amber button, and the welcome screen is readable.
            justification: |
              People who cannot use a pointer or see well must be able to reach and understand every control of the
              windows.
            children:
              - CanvasPilot-MainWindowShell-MakeMenuUsableByKeyboard
              - CanvasPilot-MainWindowShell-NameAndSizeControls
              - CanvasPilot-ThemeResources-ReadableNoticesAndWelcome
            tests:
              - Accessibility_Windows_ControlsHaveNamesTooltipsFocusAndSize
              - Accessibility_MainMenu_EveryEntryHasAUniqueAccessKey
              - Accessibility_Colors_NoticesAndWelcomeTextAreReadable

          - id: CanvasPilot-AppShell-ProvideIcons
            title: >-
              The AppShell subsystem shall give its views line icons that take the text color of the theme variant of the
              control that holds them.
            justification: |
              Icon buttons let the window show many commands in little room. Icons that follow the text color of the
              theme stay readable in both variants without a second set of pictures.
            children:
              - CanvasPilot-ThemeResources-ProvideIcons
            tests:
              - AppShellSubsystem_Icons_IconInButtonTakesThePrimaryTextColorOfTheVariant

          - id: CanvasPilot-AppShell-ShipThirdPartyNotices
            title: >-
              The AppShell subsystem shall ship the license notices of the third-party material that its views contain
              with the installed application.
            justification: |
              The icons of the views are the work of another party who allows their use on condition that their license
              notice goes with every copy, so the notice must be delivered with the application.
            children:
              - CanvasPilot-ThemeResources-ShipIconLicense
            tests:
              - windows@ThirdPartyNotices_Published

          - id: CanvasPilot-AppShell-DrawingKnowledgeMenu
            title: >-
              The AppShell subsystem shall let the user open the browser of the drawing knowledge from the Help menu of the
              composed application, over the catalog of cards of the application, in a window that stays open beside the
              work.
            justification: |
              The cards are of use only when the user can reach them while working. The application is composed in one
              place, so that is where the menu is joined to the catalog of the application, and the browser is shown through
              the window of the shell so that it belongs to it.
            children:
              - CanvasPilot-MainWindowShell-ShowDrawingKnowledge
            tests:
              - AppShellSubsystem_DrawingKnowledge_ComposedShell_ShowsBrowserOnTheCatalogOfTheApplication

          - id: CanvasPilot-AppShell-ChooseStyleInTitleBar
            title: >-
              The AppShell subsystem shall build the style kit catalog, the active style, the list that chooses it, and the
              two style tool descriptors with the other units of the application, read the kits in the background so that the
              start of the application does not wait for them, let the exporter offer the sizes of the style, and show the
              list as a pill in the title bar of the main window while a project is open.
            justification: |
              The style units do not know the window, the exporter, or each other's owners, so one place has to join them. The
              kits live in folders that may be slow to read, so reading them must never delay the start, and the user should
              find the choice of the style where the work is.
            children:
              - CanvasPilot-MainWindowShell-ShowTheActiveStyleInTheTitleBar
            tests:
              - AppShellSubsystem_ComposeApplication_StyleKitsPickerDefaultToolsAndExporterAreWired

          - id: CanvasPilot-AppShell-OpenStyleKitsWindow
            title: >-
              The AppShell subsystem shall give the Tools menu of the composed application a Style Kits item that opens the
              window that manages style kits over the catalog of kits, the active style, the render service, and the project
              service of the application, in a window that stays open beside the work.
            justification: |
              The window needs the units that know the kits, the project, and the drawing, and none of them knows the window,
              so the one place that builds the application joins them and gives the shell the way to make the window's view
              model from the dialogs that the main window implements.
            children:
              - CanvasPilot-MainWindowShell-OpenStyleKitsFromTheToolsMenu
            tests:
              - AppShellSubsystem_StyleKits_ComposedShell_ShowsTheWindowOnTheCatalogOfTheApplication

          - id: CanvasPilot-AppShell-CheckAgainstStyleMenu
            title: >-
              The AppShell subsystem shall give the Image menu of the composed application a Check Against Style item that is
              usable while a picture is shown and that checks that picture against the style kit of the open project and
              shows the result among the notes of the preview, or says why nothing was checked.
            justification: |
              The check is of use only where the picture is, so it is one command of the menu of the picture. The units that
              hold the picture, the style, and the notes do not know each other, so the one place that builds the application
              joins them.
            children:
              - CanvasPilot-MainWindowShell-CheckAgainstStyleFromTheImageMenu
            tests:
              - AppShellSubsystem_CheckAgainstStyle_ComposedShell_ShowsNotesInThePreview

          - id: CanvasPilot-AppShell-ComposeAiCopilot
            title: >-
              The AppShell subsystem shall, when it is given the folder for the local data of the application, build the AI
              copilot with the tools of the drawing knowledge, the style, and the project, give it and the chat history to the
              chat panel, give the readiness check of the copilot to the AI Provider page as its Check connection, show and
              select in the project explorer a file that the copilot writes, open the settings when the chat panel asks for
              them, make the chat panel check the provider again when the AI provider settings change, and dispose the copilot
              before the services it listens to; and shall build no copilot when it is not given the folder.
            justification: |
              The copilot, the chat, the explorer, the settings, and the shell do not know each other, so the one place that
              builds the application joins them. The copilot keeps its data in the folders that it is given, which makes the
              data of the user stay out of every project and lets a test compose the application without touching the
              computer of the person who runs it. Showing the files that the copilot writes is what makes the drawing appear.
            tests:
              - AppShellSubsystem_ComposeApplication_CopilotIsBuiltFromItsFoldersAndFeedsTheSettingsPage
              - AppShellSubsystem_ComposeApplication_CopilotAsksForSettingsAndIsCheckedAgainWhenTheyChange
              - AppShellSubsystem_ComposeApplication_CopilotWritesFile_ExplorerSelectsItAndPreviewDrawsIt
              - AppShellSubsystem_ComposeApplication_DisposeStopsTheCopilotAndTheWiring

          - id: CanvasPilot-AppShell-ComposeApplication
            title: >-
              The AppShell subsystem shall build the application's units at startup in dependency order, load
              the stored settings, build the chat panel that joins the layer for marks on the picture to the message
              being composed, join the layer to the preview pane, record the start and stop in the application log, and
              release the units on exit.
            justification: |
              One place that creates every unit and passes each its dependencies keeps the application's
              structure visible and testable, so the application starts the same way on every platform and
              in tests without a window, and settings that are stored are in effect from the first moment. The
              units that draw the marks and that hold the message do not know each other, so the one place that
              creates them also creates the chat panel, which makes the marks become chips and lets only a message
              that can be edited take marks.
            tests:
              - AppShellSubsystem_ComposeApplication_LoadsSettingsListsRecentProjectsAndLogs
              - AppShellSubsystem_ComposeApplication_AnnotationLayerIsOnThePictureAndFollowsTheOpenProject
              - AppShellSubsystem_ComposeApplication_ChatPanelFollowsTheOpenProject
              - AppShellSubsystem_Settings_ComposedShell_HostsAiProviderAndSpeechPages
              - AppShellSubsystem_Create_NullArguments_Throw
