---
# Software Unit Requirements for the PathHelpers Class
#
# The PathHelpers class provides safe path-combination utilities that protect
# against path-traversal attacks by rejecting relative paths containing ".."
# or absolute paths when a relative path is expected. It also finds a free name for a file that is copied into a folder.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Utilities Subsystem Requirements
        sections:
          - title: PathHelpers Requirements
            requirements:
              - id: CanvasPilot-PathHelpers-SafeCombine
                title: The PathHelpers class shall combine paths safely, preventing path traversal.
                justification: |
                  Prevents path-traversal vulnerabilities when constructing file paths from
                  user-supplied or external inputs. Paths containing ".." or rooted paths
                  must be rejected to ensure the combined path remains under the base directory.
                tests:
                  - PathHelpers_SafePathCombine_ValidPaths_CombinesCorrectly
                  - PathHelpers_SafePathCombine_PathTraversalWithDoubleDots_ThrowsArgumentException
                  - PathHelpers_SafePathCombine_DoubleDotsInMiddle_ThrowsArgumentException
                  - PathHelpers_SafePathCombine_AbsolutePath_ThrowsArgumentException
                  - PathHelpers_SafePathCombine_NestedPaths_CombinesCorrectly
                  - PathHelpers_SafePathCombine_CurrentDirectoryReference_CombinesCorrectly
                  - PathHelpers_SafePathCombine_EmptyRelativePath_ReturnsBasePath
                  - PathHelpers_SafePathCombine_DotDotPrefixedName_CombinesCorrectly
                  - PathHelpers_SafePathCombine_NullBasePath_ThrowsArgumentNullException
                  - PathHelpers_SafePathCombine_NullRelativePath_ThrowsArgumentNullException

              - id: CanvasPilot-PathHelpers-UniqueFileName
                title: >-
                  The PathHelpers class shall give, for a wanted file name and a folder, the wanted name when no file or
                  folder in the folder has it, and otherwise the name with a number in parentheses before the extension,
                  starting at 2, that no file or folder in the folder has.
                justification: |
                  Files that are copied into a folder, such as pictures dropped on a project, must never replace what is
                  already there. A numbered name keeps both files and keeps the extension, so the file still opens with
                  the same program.
                tests:
                  - PathHelpers_UniqueFileName_FreeAndTakenNames_NumbersBeforeTheExtension
