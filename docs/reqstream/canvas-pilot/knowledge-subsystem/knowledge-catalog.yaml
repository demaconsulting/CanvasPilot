---
# Software Unit Requirements for the KnowledgeCatalog Unit
#
# The KnowledgeCatalog unit builds the tree of knowledge cards of the application: the help cards of CanvasNet extended
# with the cards of CanvasPilot, left out where they are only about the host program, copied into values of its own, with
# the links of each body written as
# the identifiers of cards. It reads only embedded resources and has no dependency on the user interface.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Knowledge Subsystem Requirements
        sections:
          - title: KnowledgeCatalog Requirements
            requirements:
              - id: CanvasPilot-KnowledgeCatalog-ExcludeHostOnlyCards
                title: >-
                  The KnowledgeCatalog shall leave out the cards of CanvasNet that are only about the program that hosts
                  it, by identifier, shall keep every other card, including those that tell how a drawing embeds pages,
                  pictures, and files and sets a view or a param, shall keep the cards below a left-out card as cards of
                  the nearest offered card or of the top level, shall name no left-out card in any child, related card, or
                  parent, and shall refuse an identifier that is not a card.
                justification: |
                  CanvasPilot is the program that hosts CanvasNet and sets the render options itself, and the assistant
                  writes files, so the cards of the host's options, exceptions, and flattening would only take room in a
                  prompt. The tag of CanvasNet for hosting is also on cards that a drawing needs, so the exclusion is by
                  identifier, and a mistyped or renamed identifier must be an error, not a catalog that keeps everything.
                  The cards below a left-out card, such as the codes of errors, still tell the assistant what it needs,
                  and no reference may lead to a card that is not offered.
                children:
                  - CanvasPilot-OTS-CanvasNet-ProvideHelpCards
                tests:
                  - KnowledgeCatalog_Default_HostOnlyCardsAreAbsentAndAllOtherCardsRemain
                  - KnowledgeCatalog_Default_DrawingCardsThatCarryTheHostingTagRemain
                  - KnowledgeCatalog_Default_NoReferenceNamesACardThatIsLeftOut
                  - KnowledgeCatalog_Default_RelatedCardThatIsLeftOutIsDropped
                  - KnowledgeCatalog_Default_VisibleCardsBelowAHiddenCardArePromotedToRoots
                  - KnowledgeCatalog_Create_UnknownExcludedCardId_ThrowsArgumentException
                  - KnowledgeCatalog_Create_NullArguments_ThrowArgumentNullException

              - id: CanvasPilot-KnowledgeCatalog-TellWhatTheAssistantCannotRun
                title: >-
                  The KnowledgeCatalog shall offer a root card of CanvasPilot that tells the assistant that the
                  command-line tools and the host program that cards mention cannot be run, and that it uses the
                  `canvasnet_help` tool and the file tools instead.
                justification: |
                  The cards of CanvasNet that are offered still carry some wording for people who run a command-line tool,
                  Pandoc, or code against the library. The assistant cannot do that, so it is told once, at the root of the
                  cards, what to use instead.
                tests:
                  - KnowledgeCatalog_Default_RootCardOfCanvasPilotSaysWhatTheAssistantCannotRun

              - id: CanvasPilot-KnowledgeCatalog-ExtendWithApplicationCards
                title: >-
                  The KnowledgeCatalog shall add the cards that are embedded in the application to the cards of CanvasNet
                  as one tree after the trees of CanvasNet, with every file of the folder of the cards a card of the tree,
                  and with a title, a summary, tags, and a body for every card.
                justification: |
                  The cards of CanvasPilot say where files go, how to make the picture the user uses, how to read the marks
                  of a message, and what the user sees, which CanvasNet cannot know. A card file that is left out of the
                  tree, or a card without its parts, would leave the assistant without what the card is for.
                children:
                  - CanvasPilot-OTS-CanvasNet-ProvideHelpCards
                  - CanvasPilot-OTS-CanvasNet-ExtendHelpCards
                tests:
                  - KnowledgeCatalog_Default_HasTheCanvasPilotCardsAsOneTreeAfterTheLibraryRoots
                  - KnowledgeCatalog_Default_EveryCardIsComplete

              - id: CanvasPilot-KnowledgeCatalog-FindByPathOrAlias
                title: >-
                  The KnowledgeCatalog shall find a card by its path, with segments separated by a slash or by white space,
                  each the name or another name of a card, ignoring case, shall find no card for a path that names no card
                  or a card that is left out, and shall give the cards below a card and the cards related to it in order.
                justification: |
                  An assistant names cards in the way that comes to mind: a path, a name, a shorter name. Finding
                  the card in each way, and nothing for a name that is not offered, lets a request be answered or refused
                  exactly.
                tests:
                  - KnowledgeCatalog_Find_PathNameAliasAndCase_FindTheCard
                  - KnowledgeCatalog_Find_UnknownHiddenOrBlankPath_FindsNothing
                  - KnowledgeCatalog_GetChildrenAndGetSeeAlso_ReturnTheNamedCardsInOrder

              - id: CanvasPilot-KnowledgeCatalog-RewriteLinksToCardIds
                title: >-
                  The KnowledgeCatalog shall write each link in the body of a card as the identifier of the card in code
                  quotes, or as the name of the example and the identifier of the card that holds it, and shall write a
                  link to a card that is left out as the plain title of that card.
                justification: |
                  A reader of a body that is given to an assistant can follow an identifier with the tool that gives a card,
                  and cannot follow the bracket syntax of CanvasNet. A link to a card that is not offered must not send the
                  reader to a place it cannot go.
                tests:
                  - KnowledgeCatalog_Default_BodiesHaveLinksWrittenAsCardIds
                  - KnowledgeCatalog_Default_LinksToHiddenCardsAreNotCardIds

              - id: CanvasPilot-KnowledgeCatalog-ListExamplesByName
                title: >-
                  The KnowledgeCatalog shall find the examples of a name in all cards, in a card and the cards below it, or
                  in the card that a name with a card in front of it selects, ignoring case, shall find every example of
                  that name where several cards hold one, and shall give the text of each example as the library holds it.
                justification: |
                  Examples are named within one tree of cards, so a name such as the sequence diagram is the name of an
                  example of two formats. The reader must be able to see that and to choose, and the text of an example
                  must be exactly the file that the library has tested, because a copy that differs is of no use.
                tests:
                  - KnowledgeCatalog_FindExamples_SharedNameCardPrefixAndScope_SelectTheExamples
                  - KnowledgeCatalog_FindExamples_UnknownNameOrCard_FindsNothing
                  - KnowledgeCatalog_FindExamples_CanvasPilotExamples_AreTheEmbeddedFiles
                  - KnowledgeCatalog_Default_LibraryExamples_EqualTheLibraryFiles

              - id: CanvasPilot-KnowledgeCatalog-AgreeWithApplication
                title: >-
                  The KnowledgeCatalog shall hold cards of CanvasPilot whose statements about the project file, the data
                  folder, the folder of attachments, the kinds of mark, and the references of a message are those of the
                  application.
                justification: |
                  A card that says where the attachments go, or what a mark is called, steers the assistant. If the
                  application changes and the card does not, the assistant is steered wrongly, so the statements are
                  checked against the constants of the application.
                tests:
                  - KnowledgeCatalog_Default_CanvasPilotCards_AgreeWithTheApplication

              - id: CanvasPilot-KnowledgeCatalog-DescribeStyleKits
                title: >-
                  The KnowledgeCatalog shall hold a card of CanvasPilot that tells the assistant what a style kit is, where
                  kits are and which wins, that it calls style_get before it draws and style_check after, how a Mermaid file
                  and a Vega-Lite file take the style, that export sizes are for the user to choose, and that the example
                  images are files to open, and that is reached from the root card and the card about the folders of a
                  project, and shall quote the names of the two tools, the folder of the kits of a project, the style file,
                  and the sections of the style that the application uses.
                justification: |
                  The tools of the style are of no use to an assistant that is not told when to call them, and a card that
                  names a tool, a folder, or a section that the application does not have steers the assistant wrongly. The
                  card is checked against the constants of the application, so that a change of a name in the code fails
                  the build until the card is changed with it.
                tests:
                  - KnowledgeCatalog_Default_StylesCardQuotesTheNamesThatTheCodeUses
                  - KnowledgeCatalog_Default_HasTheCanvasPilotCardsAsOneTreeAfterTheLibraryRoots

              - id: CanvasPilot-KnowledgeCatalog-ExposeOwnValues
                title: >-
                  The KnowledgeCatalog shall offer its cards, examples, and results as values that do not change after they
                  are built: the lists that it hands out refuse every change.
                justification: |
                  What searches the cards, writes them for a prompt, makes skills of them, and answers the help tool
                  reads the same values from many threads and many consumers. Values that cannot change can be shared
                  between threads without a lock, and no consumer can alter what the others see.
                tests:
                  - KnowledgeCatalog_Default_ListsCannotBeChanged
