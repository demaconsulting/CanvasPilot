---
# Software Unit Requirements for the KnowledgeMarkdown Unit
#
# The KnowledgeMarkdown unit reads the small dialect of Markdown that the knowledge cards are written in, which the copilot
# writes its replies in, into blocks and runs of text, and draws those blocks as text that the user can select and copy
# (the control MarkdownBlocksPanel, which the chat panel uses for the replies of the copilot). The reader has no
# dependency on the user interface, on a Markdown library, or on any provider of a language model; only the control that
# draws the blocks depends on the user interface.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Knowledge Subsystem Requirements
        sections:
          - title: KnowledgeMarkdown Requirements
            requirements:
              - id: CanvasPilot-KnowledgeMarkdown-ParseCardDialect
                title: >-
                  The KnowledgeMarkdown unit shall read Markdown in the dialect of the cards into headings of six levels,
                  paragraphs, bulleted and numbered list items with their markers, and fenced blocks of code with their
                  language, in the order of the text, joining the lines of a paragraph or item with a space and keeping the
                  lines of code as they are, shall read bold, italic, and code text inside them into runs of one style each,
                  shall keep a marker that has no end as text, and shall lose no letter or digit of the text of any card or
                  example description of the catalog of the application.
                justification: |
                  The replies of the copilot are shown to the user, and Markdown that is shown as it was typed is hard to
                  read. The copilot writes in the dialect of the cards it reads, which uses only a few constructs, so a
                  small reader that is tested on every card does the work without adding a Markdown library and its
                  documents, and a check that no text is lost on the real cards means a new card, or a new version of
                  CanvasNet, cannot bring a construct that makes part of the text disappear unnoticed.
                tests:
                  - KnowledgeMarkdown_Parse_Headings_AreReadByLevel
                  - KnowledgeMarkdown_Parse_Paragraphs_JoinLinesAndSplitAtBlankLines
                  - KnowledgeMarkdown_Parse_Lists_ReadMarkersAndContinuations
                  - KnowledgeMarkdown_Parse_LinesThatOnlyLookLikeListItems_AreParagraphs
                  - KnowledgeMarkdown_Parse_FencedCode_IsKeptVerbatim
                  - KnowledgeMarkdown_Parse_Spans_ReadBoldItalicAndCode
                  - KnowledgeMarkdown_Parse_WholeCard_KeepsOrderAndMergesRuns
                  - KnowledgeMarkdown_Parse_RealCatalog_ReadsEveryCardWithoutLosingText

              - id: CanvasPilot-KnowledgeMarkdown-DrawBlocks
                title: >-
                  The KnowledgeMarkdown unit shall draw the blocks it reads as text that the user can select and copy: a
                  heading in semibold type, a paragraph with its bold, italic, and code text shown in those styles, a list
                  item with a dot for a bullet or its number as written, and a block of code with its lines in a fixed-width
                  font in a block of its own, and shall draw the new blocks, or nothing, when the blocks it is given change.
                justification: |
                  A reply that is shown as it was typed, with its markers, is hard to read, and the user takes words from a
                  reply back to the copilot, so the text must be selectable. The control follows the blocks it is given, so
                  that a reply is drawn again when its text is complete.
                tests:
                  - MarkdownBlocksPanel_Blocks_DrawsEveryKindOfBlock
