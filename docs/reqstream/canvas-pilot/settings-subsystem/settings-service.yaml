---
# Software Unit Requirements for the SettingsService Class
#
# The SettingsService class owns the persisted application settings: it locates, reads, validates, and
# atomically writes the per-user versioned JSON settings file and announces changes to the settings in
# effect. The AppSettings records and ISettingsService interface are part of this unit.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Settings Subsystem Requirements
        sections:
          - title: SettingsService Requirements
            requirements:
              - id: CanvasPilot-SettingsService-LocateSettingsFile
                title: >-
                  The SettingsService shall store settings in a single settings.json file in a
                  CanvasPilot folder under the per-user application data folder, creating the folder
                  when saving.
                justification: |
                  Users and maintainers need one predictable, user-writable location that does not
                  require administrator rights and survives application upgrades. A folder supplied by
                  the caller lets tests and alternate configurations avoid the real user folder.
                tests:
                  - SettingsService_DefaultSettingsFolder_Default_IsCanvasPilotUnderApplicationData
                  - SettingsService_SettingsFilePath_Folder_IsSettingsJsonInFolder
                  - SettingsService_Save_MissingFolder_CreatesFolderAndFile
                  - SettingsService_Constructor_WhitespaceFolder_ThrowsArgumentException

              - id: CanvasPilot-SettingsService-RoundTripVersionedSettings
                title: >-
                  The SettingsService shall write every setting as a versioned camel-case JSON
                  document and read it back unchanged, using defaults for values that are missing and
                  ignoring properties it does not know.
                justification: |
                  A versioned document with tolerant reading lets later builds add settings without
                  breaking earlier ones, and lets users move a file between builds. Defaults for missing
                  values mean a new setting never needs a migration step.
                tests:
                  - SettingsService_SaveLoad_AllSettings_RoundTrips
                  - SettingsService_Save_Settings_WritesVersionedCamelCaseJson
                  - SettingsService_Load_MissingFile_ReturnsDefaults
                  - SettingsService_Load_MissingProperties_UsesDefaults
                  - SettingsService_Load_UnknownProperties_AreIgnored

              - id: CanvasPilot-SettingsService-ToleratePoorFiles
                title: >-
                  The SettingsService shall continue with default settings and log the condition when
                  the settings file is unreadable, corrupt, empty, from a newer version, or holds
                  unrecognized or out-of-range values, renaming a corrupt file to settings.json.bad.
                justification: |
                  The application must start and remain usable whatever the settings file contains.
                  Renaming a corrupt file keeps the evidence for diagnosis while allowing a fresh file
                  to be written, and a log entry tells the user why their settings were reset.
                tests:
                  - SettingsService_Load_CorruptFile_RenamesToBadAndUsesDefaults
                  - SettingsService_Load_CorruptFile_LogsError
                  - SettingsService_Load_EmptyFile_TreatedAsCorrupt
                  - SettingsService_Load_NewerVersion_LoadsKnownValuesAndLogsWarning
                  - SettingsService_Load_OutOfRangeValues_ReplacedWithDefaults
                  - SettingsService_Load_UnknownEnumValue_UsesFirstValue

              - id: CanvasPilot-SettingsService-WriteAtomically
                title: >-
                  The SettingsService shall write the settings file by writing a temporary file and
                  then replacing the settings file, and shall report a failed write as an IOException
                  without changing the settings in effect or leaving a temporary file behind.
                justification: |
                  A crash or failure part way through a save must never leave a truncated settings
                  file, and a caller must be able to tell the user that their settings were not saved.
                tests:
                  - SettingsService_Save_ExistingFile_ReplacesContentAndLeavesNoTemporaryFile
                  - SettingsService_Save_WriteFails_ThrowsIOExceptionAndKeepsCurrentSettings

              - id: CanvasPilot-SettingsService-NotifyChanges
                title: >-
                  The SettingsService shall raise a Changed event carrying the new settings after they
                  are loaded, saved, or updated, and shall apply an update to the latest settings.
                justification: |
                  Other subsystems that read settings, and the settings dialog, need to react when
                  settings change. Applying updates to the latest settings lets one subsystem change
                  its own values without overwriting values changed elsewhere.
                tests:
                  - SettingsService_Save_Settings_RaisesChangedWithSavedSettings
                  - SettingsService_Update_Transform_SavesAndReturnsTransformedSettings
                  - SettingsService_Load_ExistingFile_RaisesChanged

              - id: CanvasPilot-SettingsService-DefaultContextWindow32768
                title: >-
                  The SettingsService shall give an AI context window of 32768 tokens to settings that do not state one,
                  and shall provide 16384 tokens as the smallest context window that is recommended.
                justification: |
                  Drawings with pictures and tools need a large context window, and a model that runs with a small one
                  fails in ways that are hard to explain. A new installation, and a settings file written before the
                  context window existed, therefore start with 32768 tokens. The recommended minimum is one value that
                  the readiness check and the settings page both use to warn about a smaller window.
                tests:
                  - SettingsService_DefaultContextWindow_Constants_AreThe32768DefaultAndThe16384Minimum
                  - SettingsService_Load_MissingFile_ReturnsDefaults
                  - SettingsService_Load_NoContextWindowInFile_Uses32768
                  - SettingsService_Load_MissingProperties_UsesDefaults

              - id: CanvasPilot-SettingsService-KeepStoredContextWindow
                title: >-
                  The SettingsService shall keep a stored AI context window that is within bounds, including 8192 tokens
                  that an earlier build stored as its default, and shall replace only a value outside the bounds by the
                  default.
                justification: |
                  A value that the user chose, or that an earlier build stored, is a valid choice. Replacing it when the
                  default changes would change a setting that the user did not touch. Only a value that no model can use
                  is replaced, so that the application always starts.
                tests:
                  - SettingsService_Load_StoredContextWindow8192_IsKept
                  - SettingsService_Load_OutOfRangeValues_ReplacedWithDefaults

              - id: CanvasPilot-SettingsService-KeepStyleSettings
                title: >-
                  The SettingsService shall keep the folders in which a team shares style kits, in their order, and the id of the
                  style kit that a new project starts with, store them in the settings file, read them back, give no folders and
                  no default kit for a file that has none, keep a folder once and in its first spelling, drop a folder that is
                  not a full path and log the drop, keep a folder that does not exist, and replace a default kit id that no kit
                  can have with none.
                justification: |
                  The folders of the shared kits are looked up in the order the user gave, because an earlier folder wins over a
                  later one. A folder on a network may be away for a while and must still be there when it returns, but a path
                  that is relative would mean another folder on every machine. A default kit that cannot be a kit would only
                  ever be reported as missing, so it is not kept. A settings file from before style kits must still load.
                tests:
                  - SettingsService_SaveLoad_AllSettings_RoundTrips
                  - SettingsService_Save_Settings_WritesVersionedCamelCaseJson
                  - SettingsService_Load_FileWithoutStyles_GivesNoSharedFoldersAndNoDefaultKit
                  - SettingsService_Load_SharedKitFolders_AreTrimmedFilteredAndUniqueInOrder
                  - SettingsService_Load_DefaultKitId_IsValidOrEmpty
                  - SettingsService_Update_StyleSettings_KeepsOtherSettingsAndPersists
                  - SettingsService_StyleSettings_IsValidKitId_FollowsTheRule
