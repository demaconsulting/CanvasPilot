---
# Software Unit Requirements for the AiProviderSettingsPage Unit
#
# The AiProviderSettingsPage unit is the "AI Provider" page of the settings dialog. It edits and validates
# the persisted AI provider choices and, through the IProviderCheck interface that the Settings subsystem owns,
# can check the connection to the provider. It has no dependency on the Agent subsystem that implements the check.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Settings Subsystem Requirements
        sections:
          - title: AiProviderSettingsPage Requirements
            requirements:
              - id: CanvasPilot-AiProviderSettingsPage-EditProviderChoices
                title: >-
                  The AiProviderSettingsPage shall let the user choose the provider, model name,
                  context window, and reasoning level, enable only the entry that belongs to the
                  selected provider, and merge the choices into the settings without changing values
                  it does not own.
                justification: |
                  The user configures the AI provider once, and the choices must reach the stored
                  settings exactly. Showing only the relevant provider entry avoids asking for values
                  that will not be used, and leaving other values alone keeps pages independent.
                tests:
                  - AiProviderSettingsPageViewModel_Load_DefaultSettings_ShowsDefaults
                  - AiProviderSettingsPageViewModel_LoadApply_AllValues_RoundTrips
                  - AiProviderSettingsPageViewModel_Apply_EditedValues_AreAppliedTrimmed
                  - AiProviderSettingsPageViewModel_Apply_OtherSettings_AreUnchanged
                  - AiProviderSettingsPageViewModel_SelectedProvider_Switched_EnablesMatchingEntry
                  - AiProviderSettingsPageView_SelectProvider_EnablesMatchingEntry
                  - AiProviderSettingsPageView_LoadedSettings_AreShownInControls

              - id: CanvasPilot-AiProviderSettingsPage-ValidateContextWindow
                title: >-
                  The AiProviderSettingsPage shall accept only a whole-number context window from 512
                  to 2,000,000 tokens, show an error message that states the bounds otherwise, and
                  refuse to apply an invalid page.
                justification: |
                  A context window outside the range a model can use would fail only when the agent
                  later starts. Stating the bounds in the message tells the user how to correct it.
                tests:
                  - AiProviderSettingsPageViewModel_ContextWindowText_OutOfBounds_IsInvalid
                  - AiProviderSettingsPageViewModel_ContextWindowText_AtBounds_IsValid
                  - AiProviderSettingsPageViewModel_Apply_InvalidEntries_ThrowsInvalidOperationException
                  - AiProviderSettingsPageViewModel_ContextWindowText_Edited_RaisesIsValidChanged
                  - AiProviderSettingsPageView_InvalidContextWindow_ShowsError

              - id: CanvasPilot-AiProviderSettingsPage-ValidateOllamaEndpoint
                title: >-
                  The AiProviderSettingsPage shall require the Ollama endpoint to be an absolute http
                  or https URL while Ollama is the selected provider, and shall not replace the stored
                  endpoint with an invalid entry.
                justification: |
                  A malformed endpoint would make the Ollama provider unusable. The check applies only
                  while Ollama is selected, so an entry the user cannot currently edit never blocks the
                  dialog.
                tests:
                  - AiProviderSettingsPageViewModel_OllamaEndpoint_InvalidWhenOllamaSelected_IsInvalid
                  - AiProviderSettingsPageViewModel_OllamaEndpoint_InvalidWhenCopilotSelected_IsIgnoredAndStoredValueKept

              - id: CanvasPilot-AiProviderSettingsPage-CopilotCliPathOverride
                title: >-
                  The AiProviderSettingsPage shall let the user override the path of the GitHub Copilot
                  command-line tool, treat an empty path as automatic discovery, and reject a path with
                  characters that cannot appear in a file path while GitHub Copilot is the selected
                  provider.
                justification: |
                  The command-line tool may be installed in a non-standard location. An empty value
                  keeps the default discovery behavior, and rejecting impossible paths catches typing
                  errors early.
                tests:
                  - AiProviderSettingsPageViewModel_CopilotCliPath_EditedAndCleared_IsApplied
                  - AiProviderSettingsPageViewModel_CopilotCliPath_InvalidCharacters_IsErrorOnlyForCopilot

              - id: CanvasPilot-AiProviderSettingsPage-HideUnrestrictedTools
                title: >-
                  The AiProviderSettingsPage shall not offer unrestricted agent tools, shall show no text about them, and
                  shall load and apply the stored value of that setting unchanged.
                justification: |
                  The copilot has no unrestricted tools, so a check box for them would promise a protection or a risk that
                  does not exist. The stored value is still carried through, so that a later version that offers the
                  choice finds what the user had.
                tests:
                  - AiProviderSettingsPageViewModel_UnrestrictedAgentTools_NotChosen_StaysOff
                  - AiProviderSettingsPageViewModel_UnrestrictedAgentTools_Stored_IsKeptUnchanged
                  - AiProviderSettingsPageView_UnrestrictedAgentTools_IsNotOffered

              - id: CanvasPilot-AiProviderSettingsPage-ExplainDisabledReasoning
                title: >-
                  The AiProviderSettingsPage shall show the reasoning level disabled, with the stored value and the note
                  "Not available yet: the AI library does not expose it", and shall apply the value unchanged; it shall show
                  the context window as an Ollama setting, with a note while GitHub Copilot is selected, and the path of the
                  Copilot command-line tool with a note that the installed copilot.exe of version 1.0.113 or later is used,
                  that a path set here wins, and that shims are ignored.
                justification: |
                  A choice that nothing acts on must not look like one that does. Saying why the reasoning level is disabled,
                  which provider the context window belongs to, and which executable is used keeps the page honest and
                  saves the user from setting a value that has no effect.
                tests:
                  - AiProviderSettingsPageViewModel_Notes_ReasoningAndCliPath_ExplainTheLimits
                  - AiProviderSettingsPageViewModel_CopilotCliPathNote_MinimumVersion_IsTheLocatorsMinimum
                  - AiProviderSettingsPageViewModel_UnrestrictedAgentTools_Stored_IsKeptUnchanged
                  - AiProviderSettingsPageView_ReasoningLevel_IsDisabledWithNote
                  - AiProviderSettingsPageView_CopilotCliPath_ShowsNoteOnInstalledExecutable
                  - AiProviderSettingsPageView_ContextWindow_IsOllamaOnlyAndWarnsBelowTheRecommendedMinimum

              - id: CanvasPilot-AiProviderSettingsPage-WarnBelowRecommendedContext
                title: >-
                  The AiProviderSettingsPage shall, while Ollama is selected and the context window is a valid number below
                  16,384 tokens, show a warning under the field that recommends 32,768, and shall keep the page valid.
                justification: |
                  Drawings with pictures and tools often fail in a small context window, but the user may know better, so
                  the page warns and does not block.
                tests:
                  - AiProviderSettingsPageViewModel_ContextWindowWarning_BelowRecommendedMinimum_WarnsWithoutInvalidating
                  - AiProviderSettingsPageViewModel_ContextWindowWarning_InvalidOrCopilot_GivesNoWarning
                  - AiProviderSettingsPageView_ContextWindow_IsOllamaOnlyAndWarnsBelowTheRecommendedMinimum

              - id: CanvasPilot-AiProviderSettingsPage-CheckConnection
                title: >-
                  The AiProviderSettingsPage shall, when it is given a provider check, offer a Check connection button that
                  checks the provider that the entries on the page describe without saving them, show the answer as one
                  sentence (in red when the provider cannot be used), disable the button while a check runs or the entries
                  are invalid, drop an answer that is overtaken by an edit or by closing the dialog, and offer no button when
                  there is no check.
                justification: |
                  The user should learn that the provider cannot be used at the dialog, where the fix is, and not on the
                  first message. The check owns no knowledge of the provider: the page asks through the interface that the
                  Settings subsystem owns, so it does not depend on the subsystem that implements it.
                tests:
                  - AiProviderSettingsPageViewModel_CheckConnection_NoProviderCheck_IsNotOffered
                  - AiProviderSettingsPageViewModel_CheckConnection_ValidEntries_ChecksTheEntriesAndShowsTheAnswer
                  - AiProviderSettingsPageViewModel_CheckConnection_FailureAndInvalidEntries_ShowFailureAndBlockTheButton
                  - AiProviderSettingsPageViewModel_CheckConnection_ThrowsOrIsOvertaken_ShowsSentenceOrDropsAnswer
                  - AiProviderSettingsPageView_CheckConnection_ShowsTheAnswerOfTheCheck
