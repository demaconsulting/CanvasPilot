---
# Software Unit Requirements for the AiProviderSettingsPage Unit
#
# The AiProviderSettingsPage unit is the "AI Provider" page of the settings dialog. It edits and validates
# the persisted AI provider choices, lists the models of the selected provider through the IProviderModelSource interface
# and checks the connection to the provider through the IProviderCheck interface, both of which the Settings subsystem
# owns. It has no dependency on the Agent subsystem that implements them.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Settings Subsystem Requirements
        sections:
          - title: AiProviderSettingsPage Requirements
            requirements:
              - id: CanvasPilot-AiProviderSettingsPage-EditProviderChoices
                title: >-
                  The AiProviderSettingsPage shall let the user choose the provider, model name,
                  context window, and reasoning effort, enable only the entry that belongs to the
                  selected provider, and merge the choices into the settings without changing values
                  it does not own.
                justification: |
                  The user configures the AI provider once, and the choices must reach the stored
                  settings exactly. Showing only the relevant provider entry avoids asking for values
                  that will not be used, and leaving other values alone keeps pages independent.
                tests:
                  - AiProviderSettingsPageViewModel_Load_DefaultSettings_ShowsDefaults
                  - AiProviderSettingsPageViewModel_LoadApply_AllValues_RoundTrips
                  - AiProviderSettingsPageViewModel_Apply_EditedValues_AreAppliedTrimmed
                  - AiProviderSettingsPageViewModel_Apply_OtherSettings_AreUnchanged
                  - AiProviderSettingsPageViewModel_SelectedProvider_Switched_EnablesMatchingEntry
                  - AiProviderSettingsPageView_SelectProvider_EnablesMatchingEntry
                  - AiProviderSettingsPageView_LoadedSettings_AreShownInControls

              - id: CanvasPilot-AiProviderSettingsPage-ValidateContextWindow
                title: >-
                  The AiProviderSettingsPage shall accept only a whole-number context window from 512
                  to 2,000,000 tokens, show an error message that states the bounds otherwise, and
                  refuse to apply an invalid page.
                justification: |
                  A context window outside the range a model can use would fail only when the agent
                  later starts. Stating the bounds in the message tells the user how to correct it.
                tests:
                  - AiProviderSettingsPageViewModel_ContextWindowText_OutOfBounds_IsInvalid
                  - AiProviderSettingsPageViewModel_ContextWindowText_AtBounds_IsValid
                  - AiProviderSettingsPageViewModel_Apply_InvalidEntries_ThrowsInvalidOperationException
                  - AiProviderSettingsPageViewModel_ContextWindowText_Edited_RaisesIsValidChanged
                  - AiProviderSettingsPageView_InvalidContextWindow_ShowsError

              - id: CanvasPilot-AiProviderSettingsPage-ValidateOllamaEndpoint
                title: >-
                  The AiProviderSettingsPage shall require the Ollama endpoint to be an absolute http
                  or https URL while Ollama is the selected provider, and shall not replace the stored
                  endpoint with an invalid entry.
                justification: |
                  A malformed endpoint would make the Ollama provider unusable. The check applies only
                  while Ollama is selected, so an entry the user cannot currently edit never blocks the
                  dialog.
                tests:
                  - AiProviderSettingsPageViewModel_OllamaEndpoint_InvalidWhenOllamaSelected_IsInvalid
                  - AiProviderSettingsPageViewModel_OllamaEndpoint_InvalidWhenCopilotSelected_IsIgnoredAndStoredValueKept

              - id: CanvasPilot-AiProviderSettingsPage-CopilotCliPathOverride
                title: >-
                  The AiProviderSettingsPage shall let the user override the path of the GitHub Copilot
                  command-line tool, treat an empty path as automatic discovery, and reject a path with
                  characters that cannot appear in a file path while GitHub Copilot is the selected
                  provider.
                justification: |
                  The command-line tool may be installed in a non-standard location. An empty value
                  keeps the default discovery behavior, and rejecting impossible paths catches typing
                  errors early.
                tests:
                  - AiProviderSettingsPageViewModel_CopilotCliPath_EditedAndCleared_IsApplied
                  - AiProviderSettingsPageViewModel_CopilotCliPath_InvalidCharacters_IsErrorOnlyForCopilot

              - id: CanvasPilot-AiProviderSettingsPage-HideUnrestrictedTools
                title: >-
                  The AiProviderSettingsPage shall not offer unrestricted agent tools, shall show no text about them, and
                  shall load and apply the stored value of that setting unchanged.
                justification: |
                  The copilot has no unrestricted tools, so a check box for them would promise a protection or a risk that
                  does not exist. The stored value is still carried through, so that a later version that offers the
                  choice finds what the user had.
                tests:
                  - AiProviderSettingsPageViewModel_UnrestrictedAgentTools_NotChosen_StaysOff
                  - AiProviderSettingsPageViewModel_UnrestrictedAgentTools_Stored_IsKeptUnchanged
                  - AiProviderSettingsPageView_UnrestrictedAgentTools_IsNotOffered

              - id: CanvasPilot-AiProviderSettingsPage-ExplainEntries
                title: >-
                  The AiProviderSettingsPage shall show the context window as an Ollama setting, with a note while GitHub
                  Copilot is selected, and the path of the Copilot command-line tool with a note that the installed
                  copilot.exe of version 1.0.113 or later is used, that a path set here wins, and that shims are ignored.
                justification: |
                  Which provider the context window belongs to, and which executable is used, are not obvious from the
                  entries alone. Saying so keeps the page honest and saves the user from setting a value that has no
                  effect.
                tests:
                  - AiProviderSettingsPageViewModel_Notes_CliPath_ExplainTheLimits
                  - AiProviderSettingsPageViewModel_CopilotCliPathNote_MinimumVersion_IsTheLocatorsMinimum
                  - AiProviderSettingsPageView_CopilotCliPath_ShowsNoteOnInstalledExecutable
                  - AiProviderSettingsPageView_ContextWindow_IsOllamaOnlyAndWarnsBelowTheRecommendedMinimum

              - id: CanvasPilot-AiProviderSettingsPage-ListModels
                title: >-
                  The AiProviderSettingsPage shall, when it is given a source of models, list the models of the selected
                  provider when the page is shown, when the provider changes, when the Ollama address or the Copilot tool
                  path is edited (after the user pauses), and when the user chooses Refresh models; shall show every model
                  with a note in the list for what it lacks (tool calling, pictures, availability), the capabilities of the
                  chosen model (tool calling, pictures, reasoning levels, context window), and a warning that a model
                  without tool calling cannot be used and that a model without pictures cannot see marks or drawings; shall
                  show a model that the provider says cannot be used disabled with its reason; shall keep the typed model
                  name, which chooses the entry of the list that it names and is applied as it is when it is not listed; and
                  shall drop the answer of a listing that the entries overtook.
                justification: |
                  The user should choose a model from what exists and see what each can do, because the application needs
                  tool calling for every drawing and wants pictures to see the result. Hiding a model that lacks something
                  would leave the user wondering where it went, and refusing it would stop a user who knows better, so all
                  models are listed and the page warns. The typed name stays so that a model that is not listed (just
                  pulled, or an account that the list does not show) can still be used. An answer for another provider or
                  address must never replace the list of the provider that is selected now. Entries that are not valid
                  end a listing that runs and take away its loading text, while the list that is shown stays.
                tests:
                  - AiProviderSettingsPageViewModel_Load_WithModelSource_ListsTheModelsAndChoosesTheStoredOne
                  - AiProviderSettingsPageViewModel_ModelWithoutCapabilities_IsListedWithNoteAndWarning
                  - AiProviderSettingsPageViewModel_ModelChoiceAndTypedName_StayInStep
                  - AiProviderSettingsPageViewModel_ChoosingAnUnusableModel_IsNotTakenAsTheModelName
                  - AiProviderSettingsPageViewModel_StaleAnswer_IsDroppedWhenTheProviderChanged
                  - AiProviderSettingsPageViewModel_ProviderChange_ClearsTheModelAndAsksTheNewProvider
                  - AiProviderSettingsPageViewModel_EditedAddressOrPath_ListsAgainOnlyForTheSelectedProvider
                  - AiProviderSettingsPageViewModel_InvalidEntriesDuringListing_ClearTheLoadingText
                  - AiProviderSettingsPageViewModel_NoSourceOrClosed_ShowsNoList
                  - AiProviderSettingsPageView_ModelList_ShowsCapabilitiesWarningsAndReasoningLevels

              - id: CanvasPilot-AiProviderSettingsPage-FallBackToTypingTheModel
                title: >-
                  The AiProviderSettingsPage shall, when the models cannot be listed (the provider does not answer, the
                  list is empty, or the source fails), show the sentence that says why and keep the model name to be typed,
                  with the stored model and reasoning effort kept as they are, and shall offer Refresh models to ask again
                  and show the new list.
                justification: |
                  A model server that is down, or a runtime that is not signed in, must not take the page away from the
                  user: the stored choice must survive a failed list, so that a server that is down for a minute does not
                  erase a setting, and the sentence says what to fix.
                tests:
                  - AiProviderSettingsPageViewModel_ListFails_KeepsTheTypedNameAndTheStoredEffort
                  - AiProviderSettingsPageViewModel_RefreshModels_AsksAgainWithRefreshAndShowsTheNewList
                  - AiProviderSettingsPageView_ModelListFails_KeepsTheTypedNameAndShowsTheMessage

              - id: CanvasPilot-AiProviderSettingsPage-ChooseReasoningEffort
                title: >-
                  The AiProviderSettingsPage shall enable the reasoning level only while the chosen model offers levels,
                  offer the levels that the model lists, spelled as the provider spells them, in addition to the choice that
                  leaves it to the provider, apply the id of the chosen level, reset a stored level that the chosen model
                  does not offer (with a note) when the model is known, and keep the stored level, shown and disabled, while
                  nothing is known about the model.
                justification: |
                  Which levels exist depends on the model (none, low, medium, high, xhigh, max, and others), so a fixed list
                  would offer levels that fail or hide levels that work. A choice that the model cannot honor would only
                  fail at the start of a conversation, so the page enables it only when it can work. When the list is
                  missing nothing can be said about the model, so the stored choice is kept and not erased.
                tests:
                  - AiProviderSettingsPageViewModel_ReasoningEffort_IsEnabledByTheModelAndAppliedByItsId
                  - AiProviderSettingsPageViewModel_StoredReasoningEffort_IsKeptWhenOfferedAndResetWhenNot
                  - AiProviderSettingsPageViewModel_ChangedModelOrEffort_ForgetsTheConnectionCheck
                  - AiProviderSettingsPageViewModel_UnrestrictedAgentTools_Stored_IsKeptUnchanged
                  - AiProviderSettingsPageView_ReasoningEffort_IsDisabledWhileTheModelIsNotKnown
                  - AiProviderSettingsPageView_ModelList_ShowsCapabilitiesWarningsAndReasoningLevels

              - id: CanvasPilot-AiProviderSettingsPage-WarnBelowRecommendedContext
                title: >-
                  The AiProviderSettingsPage shall, while Ollama is selected and the context window is a valid number below
                  16,384 tokens, show a warning under the field that recommends 32,768, and shall keep the page valid.
                justification: |
                  Drawings with pictures and tools often fail in a small context window, but the user may know better, so
                  the page warns and does not block.
                tests:
                  - AiProviderSettingsPageViewModel_ContextWindowWarning_BelowRecommendedMinimum_WarnsWithoutInvalidating
                  - AiProviderSettingsPageViewModel_ContextWindowWarning_InvalidOrCopilot_GivesNoWarning
                  - AiProviderSettingsPageView_ContextWindow_IsOllamaOnlyAndWarnsBelowTheRecommendedMinimum

              - id: CanvasPilot-AiProviderSettingsPage-CheckConnection
                title: >-
                  The AiProviderSettingsPage shall, when it is given a provider check, offer a Check connection button that
                  checks the provider that the entries on the page describe without saving them, show the answer as one
                  sentence (in the color of errors when the provider cannot be used), disable the button while a check runs or the entries
                  are invalid, drop an answer that is overtaken by an edit or by closing the dialog, and offer no button when
                  there is no check.
                justification: |
                  The user should learn that the provider cannot be used at the dialog, where the fix is, and not on the
                  first message. The check owns no knowledge of the provider: the page asks through the interface that the
                  Settings subsystem owns, so it does not depend on the subsystem that implements it.
                tests:
                  - AiProviderSettingsPageViewModel_CheckConnection_NoProviderCheck_IsNotOffered
                  - AiProviderSettingsPageViewModel_CheckConnection_ValidEntries_ChecksTheEntriesAndShowsTheAnswer
                  - AiProviderSettingsPageViewModel_CheckConnection_FailureAndInvalidEntries_ShowFailureAndBlockTheButton
                  - AiProviderSettingsPageViewModel_CheckConnection_ThrowsOrIsOvertaken_ShowsSentenceOrDropsAnswer
                  - AiProviderSettingsPageView_CheckConnection_ShowsTheAnswerOfTheCheck

              - id: CanvasPilot-AiProviderSettingsPage-ShowPageHeading
                title: >-
                  The AiProviderSettingsPage shall be a page titled AI Provider with a sentence that says what the page is for
                  and an icon, so that the settings dialog can show them in its list of pages and above the page.
                justification: |
                  A person who looks for the choice of the model finds the page by its title and icon, and the sentence tells
                  what can be done on it before any entry is read.
                tests:
                  - SettingsDialogView_ChosenPage_ShowsHeadingIconsAndErrorBanner

              - id: CanvasPilot-AiProviderSettingsPage-BeUsableWithAssistiveTechnology
                title: >-
                  The AiProviderSettingsPage shall give every entry (the provider, the model list, the model name, the
                  reasoning level, the context window, the Ollama endpoint, and the path of the Copilot tool) a name that
                  assistive technology can read, and let every enabled button take the keyboard focus, in both theme
                  variants.
                justification: |
                  People who use a screen reader or only the keyboard must be able to choose the provider and the model. A
                  field that has a label beside it but no name is read as nothing, and a button that cannot take the focus
                  cannot be reached by the keyboard.
                tests:
                  - Accessibility_Windows_ControlsHaveNamesTooltipsFocusAndSize

              - id: CanvasPilot-AiProviderSettingsPage-WarnAboutCostlyEffort
                title: >-
                  The AiProviderSettingsPage shall, while GitHub Copilot is the provider and the chosen model is a large one
                  (a billing multiplier of three or more, or a powerful or high-priced model) with a high reasoning level
                  (high, xhigh, or max, the level that the provider chooses included), show a warning that the choice is slow
                  and costly with the premium requests that a message counts, and shall show none otherwise.
                justification: |
                  A high reasoning level on a large model took more than three minutes for one drawing and counted fifteen
                  premium requests for each message, stopped or not. The user must be able to see this where the level is
                  chosen, and only where it applies, so that the warning keeps its meaning.
                tests:
                  - AiProviderSettingsPageViewModel_EffortCostWarning_AppearsOnlyForHighEffortOnLargeModels
                  - AiProviderSettingsPageViewModel_BuildEffortCostWarning_UsesTheDefaultEffortAndNeedsAModel
                  - AiProviderSettingsPageView_HighEffortOnLargeModel_ShowsTheCostWarning
