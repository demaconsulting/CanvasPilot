---
# Software Unit Requirements for the ImageExporter Unit
#
# The ImageExporter unit is what the Image menu exports. It saves the picture the preview shows as a PNG file the
# user chooses, or copies it to the clipboard, and is available only while a picture is shown. It asks the user and
# reaches the clipboard only through the IExportDialogs interface of the Preview subsystem (IExportDialogs.cs).

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Preview Subsystem Requirements
        sections:
          - title: ImageExporter Requirements
            requirements:
              - id: CanvasPilot-ImageExporter-EnableWhenPictureShown
                title: >-
                  The ImageExporter shall report that it can export only while the preview shows a picture,
                  and shall tell listeners whenever that changes.
                justification: |
                  Exporting and copying are meaningless without a picture. Telling listeners when the state
                  changes lets the Image menu enable and disable its items to match.
                tests:
                  - ImageExporter_CanExport_FollowsShownPicture_AndRaisesEvent
                  - MainWindowView_SelectSvg_ShowsPreviewAndEnablesImageMenu

              - id: CanvasPilot-ImageExporter-ExportPng
                title: >-
                  The ImageExporter shall ask the user where to save, suggesting the source file's name with
                  a .png extension, write the shown picture there as a valid PNG file with a .png extension,
                  write nothing when the user cancels, and tell the user when the file cannot be written.
                justification: |
                  A PNG file is the form in which the picture is used in email, presentations, and other
                  media. The user chooses the place and name, a misspelled or missing extension should not
                  produce a file that other programs do not recognize, and a failure to save must be reported
                  rather than lost.
                tests:
                  - ImageExporter_ExportPngAsync_PictureShown_WritesValidPngToChosenFile
                  - ImageExporter_ExportPngAsync_NameWithoutExtension_AppendsPng
                  - ImageExporter_ExportPngAsync_CancelledOrNoPicture_WritesNothing
                  - ImageExporter_ExportPngAsync_UnwritableTarget_ShowsMessage
                  - ImageExporter_SuggestFileName_SourcePath_ReplacesImageExtensionWithPng
                  - ImageExporter_InvalidArguments_Throw
                  - ImageExporter_ExportAndCopy_UsingExportDialogsOnly_DoNotRequireDialogService

              - id: CanvasPilot-ImageExporter-CopyToClipboard
                title: >-
                  The ImageExporter shall put the shown picture on the clipboard as an image through its
                  export dialogs, do nothing when no picture is shown, and tell the user when the clipboard
                  cannot be used.
                justification: |
                  Pasting a picture straight into another program is the quickest way to use it. The
                  clipboard belongs to the platform and can be unavailable, in which case the user needs to
                  know that nothing was copied.
                children:
                  - CanvasPilot-OTS-Avalonia-TransferPicturesViaClipboard
                tests:
                  - ImageExporter_CopyImageAsync_PictureShown_CopiesPictureToClipboard
                  - ImageExporter_CopyImageAsync_ClipboardUnavailableOrNoPicture_ShowsMessageOrDoesNothing
                  - MainWindowView_CopyImageToClipboard_Picture_ReportsResultAndIsReadable

              - id: CanvasPilot-ImageExporter-ExportAtPresetSize
                title: >-
                  The ImageExporter shall, when it has sizes to offer, ask the user how to export before it asks for a file,
                  offering the picture as it is shown first and then the sizes in the order given, remember the choice for
                  the session, and export the picture as it is shown exactly as before when that is chosen or when there are
                  no sizes; shall, when a size is chosen, draw the source file of the picture again with the size, the
                  background or transparency, and the resolution of the size, in the folder of the project, and write the
                  PNG file of that picture with the resolution; and shall write nothing when the user cancels either
                  dialog, and tell the user why when the picture cannot be drawn at the size.
                justification: |
                  The pictures of a style are made for slides, mail, and paper. Drawing the file again at the size keeps the
                  lines sharp, where stretching the shown pixels would blur them, and the background and the resolution of
                  the size make the file ready for its use. The old export must still be there for a picture that is wanted
                  as it is, and a size that cannot be drawn must be explained and must not leave a file that looks right but
                  is not.
                children:
                  - CanvasPilot-ExportPresetDialog-ChooseAnExportPreset
                tests:
                  - ImageExporter_ExportPngAsync_NoPresetSourceOrNoPresets_DoesNotAskAndExportsAsShown
                  - ImageExporter_ExportPngAsync_AsRenderedChosen_OffersListAndEncodesShownPicture
                  - ImageExporter_ExportPngAsync_PresetChosen_RendersWithExactSettingsAndWritesEncoderBytes
                  - ImageExporter_ExportPngAsync_TransparentPresetWithoutDpi_AsksForTransparencyAndNoResolution
                  - ImageExporter_ExportPngAsync_CancelAtEitherDialog_DrawsAndWritesNothing
                  - ImageExporter_ExportPngAsync_RenderFails_ShowsMessageWithReasonAndWritesNoFile
                  - ImageExporter_ExportPngAsync_RenderCancelledOrEncoderRefuses_WritesNoFile
                  - ImageExporter_ExportPngAsync_SecondExport_OffersTheLastChoice
                  - ImageExporter_ExportPngAsync_SvgAtPresetSize_WritesPngOfThatSizeWithResolution
