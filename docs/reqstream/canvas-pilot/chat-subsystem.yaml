---
# Chat Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasPilot Chat subsystem
# - The Chat subsystem is the panel in which the user converses with the AI copilot: a header with the title, a menu
#   of more actions, and a button that hides the panel, the transcript of the messages that were sent and of the answers
#   with the example and follow-up prompts, the composer card below it with the buttons that attach files, that listen
#   while held, that send, and that stop the copilot, the banner of the readiness of the provider, the joining of the
#   marks on the picture to the message, and the window that shows exactly what the assistant would receive for a
#   message. It keeps the words of the conversation of each project on the user's computer, outside the project folder,
#   restores them when the project is opened, and clears them on request. It uses the Composer, Annotation,
#   Payload, Speech, and Knowledge (Markdown only) subsystems, the Project information types, and the Agent subsystem
#   through its contract only, and
#   holds none of their rules; it does not depend on the application shell, which places it in the chat column of the
#   main window and hides and shows that column when the panel asks
# - Subsystem requirements describe the behavior of the units working together

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Chat Subsystem Requirements
        requirements:
          - id: CanvasPilot-Chat-ShowTranscriptOfSentMessages
            title: >-
              The Chat subsystem shall show the messages that were sent in the open project as a transcript, oldest
              first, each as it was composed with its words, marks, and attachments in their places and with their
              pictures, shall drop what it shows when the project changes or closes, and shall show, when a project is
              opened again, the saved text of the earlier messages and answers of that project, kept on this computer
              outside the project folder, as rows of words without pictures.
            justification: |
              A conversation needs a record of what has been said. The user composed each message from words, files, and
              marks, and recognizes it by how it looked, so the transcript keeps that form while it is on the screen.
              Messages may hold the user's words and file names and belong to a project, so what is kept for the next
              time is the words only, on the user's computer and never in the project, where it would travel with the
              project, and it can be cleared.
            children:
              - CanvasPilot-ChatPanel-ListSentMessagesOnly
              - CanvasPilot-ChatPanel-ProvideChipPictures
              - CanvasPilot-ChatPanel-RestoreChatHistory
            tests:
              - ChatSubsystem_SendMessageWithMarkAndAttachment_TranscriptAndPayloadMatchDraft
              - ChatSubsystem_KeepChatHistoryOnThisComputer_TurnSavedRestoredAndClearedOutsideTheProject

          - id: CanvasPilot-Chat-ShowCopilotConversation
            title: >-
              The Chat subsystem shall run one turn of the conversation with the AI copilot for each message that was
              sent, through the contract of the Agent subsystem only, and shall show the answer as it is written, in
              rows after the message of the user: the text of the copilot, one line for each tool it called that says
              what it did, such as that a file was created or replaced, and the notices, in the order in which they
              happened, with the text of the answer changed at most once for every 50 milliseconds.
            justification: |
              The user draws by talking, and the answer is only useful when it can be followed while it is written and
              when what the copilot did to the files of the project is plain. The chat holds the logic of a turn in one
              unit that is tested without a window and that knows the copilot only through its contract, so the panel
              stays small and no provider reaches the user interface.
            children:
              - CanvasPilot-ChatPanel-HoldTranscriptRows
              - CanvasPilot-ChatPanel-GroupCopilotRows
              - CanvasPilot-ChatPanel-ConverseWithCopilot
              - CanvasPilot-ChatTurnRunner-RunOneTurnAtATime
              - CanvasPilot-ChatTurnRunner-StreamAnswerIntoReplies
              - CanvasPilot-ChatTurnRunner-CoalesceTextUpdates
              - CanvasPilot-ChatTurnRunner-ShowToolCalls
            tests:
              - ChatSubsystem_ConverseWithCopilot_SentMessageGetsStreamedAnswerAndToolRows_ComposerWaitsMeanwhile

          - id: CanvasPilot-Chat-StopTheCopilotTurn
            title: >-
              The Chat subsystem shall stop the turn of the AI copilot on request and keep the text that was written,
              marked as stopped, shall report a turn that failed in the transcript with a message, what to do about it,
              and the offer to open the settings when they can help, without ever failing the application, and shall
              tell when a turn runs so that the next message cannot be sent before the turn has ended or was stopped.
            justification: |
              A model that is slow or on a wrong path must be stopped without losing what it said, a provider that is
              not running is an everyday event, and only one turn runs at a time. The user can keep writing the next
              message meanwhile, and it can be sent as soon as the turn is over.
            children:
              - CanvasPilot-ChatPanel-StopCopilotTurn
              - CanvasPilot-ChatTurnRunner-StopTurnAndKeepText
              - CanvasPilot-ChatTurnRunner-ReportFailureInTranscript
            tests:
              - ChatSubsystem_StopCopilotTurn_KeepsTextFreesTheComposerAndFailureHasRemedy

          - id: CanvasPilot-Chat-ShowCopilotReadiness
            title: >-
              The Chat subsystem shall tell the user, where the message is written, whether the configured AI provider
              can be used, with the sentence that says what to do, including the one of GitHub Copilot that cannot be
              used in this build yet, shall show a warning that does not block sending, shall let the user open the
              settings and check again from there, and shall show nothing when everything is ready.
            justification: |
              A first message that fails with the error of a library is a poor start, and both providers depend on
              things outside the application. The Agent subsystem checks and words the sentence; the chat shows it at the
              place where the user is about to type and asks for the settings through a request, so that it does not
              depend on the application shell.
            children:
              - CanvasPilot-ChatPanel-ReportProviderReadiness
            tests:
              - ChatSubsystem_ReportProviderReadiness_CopilotNotSignedIn_BannerSaysWhatToDoAndSettingsAreRequested

          - id: CanvasPilot-Chat-SendComposedMessage
            title: >-
              The Chat subsystem shall let the user send the composed message with one button, or with the Enter key,
              that can be used exactly when the message can be sent, shall move a sent message from the composer to the
              transcript, and shall keep the draft, add nothing to the transcript, and say why when the message cannot
              be sent.
            justification: |
              Sending is the moment when the user's words, marks, and files become one message, so it must be
              plain what can be sent, and a failure must never lose the draft or send half of it. The decision whether a
              message can be sent stays with the composer, so the button and the composer cannot disagree.
            children:
              - CanvasPilot-ChatPanel-SendFromPanel
              - CanvasPilot-ChatPanel-SendWithEnterKey
            tests:
              - ChatSubsystem_SendMessageWithMarkAndAttachment_TranscriptAndPayloadMatchDraft
              - ChatSubsystem_SendMessage_AttachmentCannotBeStaged_KeepsDraftAndTranscriptUnchanged

          - id: CanvasPilot-Chat-AttachFilesToMessage
            title: >-
              The Chat subsystem shall let the user attach files to the message with a button that opens the file
              dialog of the system from the folder of the project, and shall add the files that were chosen to the
              message as chips the way a drop of them does.
            justification: |
              Dropping files on the message is not obvious and not possible for everyone, so the same thing must be
              available as a button. The dialog needs the main window, which the chat does not know, so the chat asks
              for it through a seam and hands the files to the composer, which keeps the one set of rules for what may
              be attached.
            children:
              - CanvasPilot-ChatPanel-AttachFiles
            tests:
              - ChatPanelView_AttachButton_AddsThePickedFilesAsChips

          - id: CanvasPilot-Chat-GuideNewConversation
            title: >-
              The Chat subsystem shall, while there is no conversation, ask the user what to draw and offer example
              prompts that write themselves into the message when chosen, and shall offer follow-up prompts once a
              conversation exists.
            justification: |
              A new user who sees a blank panel does not know what to say, so the panel gives ways to start and then
              ways to go on. A prompt only fills in the message, so the user stays in control of what is sent.
            children:
              - CanvasPilot-ChatPanel-OfferPrompts
            tests:
              - ChatPanelView_EmptyState_ExamplePromptFillsTheMessageAndSuggestionsWaitForAConversation

          - id: CanvasPilot-Chat-HideConversation
            title: >-
              The Chat subsystem shall let the user ask, with a button in the header of the panel, that the conversation
              be hidden to give the room to the picture, and shall leave the hiding and the way back to the window that
              holds it.
            justification: |
              The user spends part of the time looking at the picture and part of the time talking about it, so the
              conversation must be able to give way. The chat does not know the window it is in, so it only asks.
            children:
              - CanvasPilot-ChatPanel-HideConversation
            tests:
              - ChatPanelView_CollapseButton_RaisesCollapseRequested

          - id: CanvasPilot-Chat-NameControls
            title: >-
              The Chat subsystem shall give every button of the panel that shows an icon and no text an accessible name
              and a tooltip, make it at least 28 by 28 pixels, and let the keyboard reach it.
            justification: |
              Controls that are only pictures cannot be used by everyone, and the conversation is where the user spends
              much of the time. Names, tooltips, and large enough targets make the panel usable with a screen reader,
              the keyboard, a finger, and by someone who does not know the symbols.
            children:
              - CanvasPilot-ChatPanel-NameIconButtons
            tests:
              - Accessibility_Windows_ControlsHaveNamesTooltipsFocusAndSize

          - id: CanvasPilot-Chat-LinkMarksToChips
            title: >-
              The Chat subsystem shall add a chip to the message for every mark that is drawn on the picture, as one
              undo step, shall have the picture show exactly the marks whose chips are in the message, and shall leave
              no mark on the picture after the message is sent.
            justification: |
              A mark is something the user points at while writing, so it belongs in the message at the place where the
              caret was, and undo must treat it like anything else that is put into the message. The picture must not
              show marks that are no longer part of what is being said, or marks of a message that was already sent.
            children:
              - CanvasPilot-ChatPanel-LinkMarkChips
              - CanvasPilot-ChatPanel-ClearMarkChips
            tests:
              - ChatSubsystem_SendMessageWithMarkAndAttachment_TranscriptAndPayloadMatchDraft

          - id: CanvasPilot-Chat-HoldToTalk
            title: >-
              The Chat subsystem shall offer a talk button that listens exactly while it is held, shows the words as they
              are recognized, adds them to the message as one block of dictated text when it is released, says why and
              what to do when dictation cannot work, and keeps the origin of the dictated words in the message that is
              sent.
            justification: |
              Speaking is quicker than typing for saying what is wrong with a picture, but the application must never
              listen when the user does not mean it to, so the button listens only while it is held, however the hold
              ends. A machine without a model, a microphone, or the speech files must be told what is missing, and the
              assistant must be able to tell dictated words from typed ones because recognition makes mistakes that
              typing does not.
            children:
              - CanvasPilot-ChatPanel-HoldToTalkButton
              - CanvasPilot-ChatPanel-ShowWhyDictationCannotWork
            tests:
              - ChatSubsystem_HoldToTalk_DictatedWords_AreKeptAsDictatedInTheSentPayload

          - id: CanvasPilot-Chat-InspectPayload
            title: >-
              The Chat subsystem shall let the user open, on any sent message that has a payload, a window that shows
              exactly what the assistant would receive for it: the description of the payload as read-only text and the
              pictures that it holds, each marked picture with its marks drawn on it and the area around each mark,
              and that releases what it shows when it closes.
            justification: |
              The assistant receives more than the user sees in the transcript: the picture with the marks drawn on it,
              the area around each mark, the geometry, and the parts of the source file under each mark. Letting the
              user see exactly that, and not a summary, is how the user checks that the message means what they
              intended before the assistant acts on it.
            children:
              - CanvasPilot-ChatPanel-RequestPayloadInspection
              - CanvasPilot-PayloadInspector-ShowExactPayload
              - CanvasPilot-PayloadInspector-ShowPayloadImages
              - CanvasPilot-PayloadInspector-CloseAndRelease
            tests:
              - ChatSubsystem_SendMessageWithMarkAndAttachment_TranscriptAndPayloadMatchDraft

          - id: CanvasPilot-Chat-KeepChatHistoryOnThisComputer
            title: >-
              The Chat subsystem shall keep the words of the conversation of each project, and only the words, on the
              user's computer in a folder named by a hash of the path of the project file, shall keep the newest 200 rows
              and no more than 2 MB of them, shall write whole files only, shall read the history again when the project
              is opened, and shall set aside a history file that it cannot use without losing it or stopping the
              application.
            justification: |
              A conversation that is gone with the project makes the copilot start over every day, and a history that is
              kept without care can grow without bound, be half written, or break the start of the application. The words
              are kept, and never pictures or payloads, so the file is small and nothing is kept that the user did not
              say or read. A project that is moved or renamed starts a fresh history, which is a known limit.
            children:
              - CanvasPilot-ChatHistoryStore-SaveTextOnlyOutsideProject
              - CanvasPilot-ChatHistoryStore-KeyByProjectPath
              - CanvasPilot-ChatHistoryStore-RestoreOnOpen
              - CanvasPilot-ChatHistoryStore-IgnoreCorruptHistory
            tests:
              - ChatSubsystem_KeepChatHistoryOnThisComputer_TurnSavedRestoredAndClearedOutsideTheProject

          - id: CanvasPilot-Chat-ClearChatHistory
            title: >-
              The Chat subsystem shall let the user clear the chat history with one item of the menu of the header,
              without a question first, which deletes the saved history of the open project from the computer, empties
              the transcript, and makes the AI copilot forget the conversation.
            justification: |
              The user owns the words of the conversation and must be able to remove them from the screen, from the
              computer, and from the provider's session in one step, and a conversation that is cleared must not be
              restored or continued by the next message.
            children:
              - CanvasPilot-ChatPanel-ClearChatHistory
              - CanvasPilot-ChatHistoryStore-ClearOnRequest
            tests:
              - ChatSubsystem_KeepChatHistoryOnThisComputer_TurnSavedRestoredAndClearedOutsideTheProject

          - id: CanvasPilot-Chat-KeepHistoryOutsideProject
            title: >-
              The Chat subsystem shall never write the chat history into the project folder: it shall refuse to keep the
              history in a folder that is, or lies inside, the project folder, and the project folder shall hold only the
              files that belong to it after a turn, a save, a restore, and a clear.
            justification: |
              A project folder is copied, shared, and put under source control, so the words of a conversation that landed
              in it would travel with it. The history lives with the user's computer, and a configuration mistake is
              refused instead of obeyed.
            children:
              - CanvasPilot-ChatHistoryStore-RefuseRootInsideProject
            tests:
              - ChatSubsystem_KeepChatHistoryOnThisComputer_TurnSavedRestoredAndClearedOutsideTheProject
