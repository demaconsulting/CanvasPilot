---
# Software Unit Requirements for the SpeechSettingsPage Unit
#
# The SpeechSettingsPage unit is the "Speech" page of the settings dialog. It composes the device pickers, the
# model catalog panel, and the parameter editors of the chosen models, and maps them to and from the stored
# speech settings. Nothing in the application consumes the choices yet.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Speech Subsystem Requirements
        sections:
          - title: SpeechSettingsPage Requirements
            requirements:
              - id: CanvasPilot-SpeechSettingsPage-ProvideSpeechPage
                title: >-
                  The SpeechSettingsPage shall be a page titled Speech in the settings dialog, listed after the
                  AI Provider page in the application, that accepts any entry and does not use the audio system
                  or the model store until the dialog loads it.
                justification: |
                  Speech choices belong in the same dialog as the other settings. The page has nothing the user
                  can mistype, so it never blocks OK, and loading it only when the dialog opens keeps application
                  startup fast and free of audio and file system work.
                tests:
                  - SpeechSettingsPageViewModel_New_IsTitledValidAndDoesNotUseServices
                  - AppShellSubsystem_Settings_ComposedShell_HostsAiProviderAndSpeechPages
                  - SettingsDialogView_SpeechPage_IsListedAndShownWhenChosen
                  - MainWindowView_SettingsMenuItem_OpensSettingsDialogAndCancelCloses

              - id: CanvasPilot-SpeechSettingsPage-MapSpeechSettings
                title: >-
                  The SpeechSettingsPage shall show the stored speech settings and merge the user's choices of
                  devices by name, models by identifier, and model parameter values into them, without changing
                  settings it does not own and without losing a stored choice that it could not show.
                justification: |
                  The user configures speech once and expects the choices to come back. Storing devices by name
                  and models by identifier survives changes in the order of the lists, and keeping choices that
                  the page could not show means a machine without audio hardware does not erase the settings of
                  the user's other machine.
                tests:
                  - SpeechSettingsPageViewModel_LoadApply_StoredSettings_RoundTrips
                  - SpeechSettingsPageViewModel_Apply_UserChoices_AreStored
                  - SpeechSettingsPageViewModel_Apply_OtherSettings_AreUnchanged
                  - SpeechSettingsPageViewModel_Apply_StoredChoicesNotShown_AreKept
                  - SpeechSettingsPageViewModel_InvalidArguments_Throw
                  - SettingsDialogView_OkButton_SavesSpeechChoices

              - id: CanvasPilot-SpeechSettingsPage-ShowParametersOfChosenModels
                title: >-
                  The SpeechSettingsPage shall show the parameters of the chosen speech-to-text and
                  text-to-speech models with their stored values, remember the values edited for a model when
                  another model is chosen, and show the stored values again when the dialog is opened again.
                justification: |
                  Each model has its own settings. Remembering edits while the dialog is open lets the user
                  compare models without retyping, and discarding them when the dialog closes without saving
                  keeps Cancel meaningful.
                tests:
                  - SpeechSettingsPageViewModel_SelectModel_ShowsItsParametersAndRemembersEdits
                  - SpeechSettingsPageViewModel_Load_AfterEdits_ShowsStoredValuesAgain

              - id: CanvasPilot-SpeechSettingsPage-CancelDownloadsOnClose
                title: >-
                  The SpeechSettingsPage shall cancel every model download that is still running when the
                  settings dialog closes, however it closes.
                justification: |
                  Downloads run at once and are not part of OK or Cancel. A download that continued after the
                  dialog is gone would use the network with nothing to show its progress or let the user stop it.
                tests:
                  - SpeechSettingsPageViewModel_OnClosed_RunningDownload_IsCancelled
                  - SettingsDialogView_CloseWindow_CancelsRunningDownload

              - id: CanvasPilot-SpeechSettingsPage-BeUsableWithAssistiveTechnology
                title: >-
                  The SpeechSettingsPage shall give the lists of microphones, speakers, and models a name that assistive
                  technology can read, give every button that shows no text a name and a tooltip, and let every enabled
                  button take the keyboard focus, in both theme variants.
                justification: |
                  People who use a screen reader or only the keyboard must be able to choose a microphone and a model. A list
                  that has a label beside it but no name is read as nothing, and a button that cannot take the focus cannot
                  be reached by the keyboard.
                tests:
                  - Accessibility_Windows_ControlsHaveNamesTooltipsFocusAndSize

              - id: CanvasPilot-SpeechSettingsPage-ChooseTalkKey
                title: >-
                  The SpeechSettingsPage shall let the user choose the key, or the chord of Ctrl, Alt, or Shift and a key,
                  that is held to talk, by pressing it in a box (a modifier alone is waited out and Esc cancels), show it in
                  words, store it with the speech settings (nothing for the default F9), and put the default back with a
                  reset button.
                justification: |
                  No key is free on every keyboard: F8, the first default, is swallowed by the function keys of many
                  laptops, and other keys belong to the system or to other tools. The user must be able to choose a key
                  that works for them without editing a file.
                tests:
                  - SpeechSettingsPageViewModel_PushToTalkKey_CaptureValidateResetAndStore
                  - SpeechSettingsPageViewModel_LoadApply_PushToTalkKey_RoundTripsAndUnsafeShowsDefault
                  - SpeechSettingsPageView_PushToTalkKeyBox_CapturesValidatesAndResets

              - id: CanvasPilot-SpeechSettingsPage-RefuseUnsafeTalkKeys
                title: >-
                  The SpeechSettingsPage shall refuse, with a sentence that says why and what to do, and leave the key as it
                  was, a talk key that is a modifier alone, a key of typing or moving (Esc, Enter, Tab, Backspace, the cursor
                  keys), a character key without Ctrl or Alt, Ctrl+Space, Alt+Space, Ctrl+Alt, a chord with the Windows key,
                  a shortcut of editing, Alt+F4, or one of the function keys F1, F8, F10, F11, and F12, and shall write and
                  read a key as text such as F9 or Ctrl+Shift+Space.
                justification: |
                  A key that is refused here never takes effect, so a bad choice cannot take away a key that people need to
                  type or one that the system owns. F8 is refused because it never reached the window on many laptops.
                tests:
                  - PushToTalkBinding_Default_IsF9AndSafe
                  - PushToTalkBinding_Validate_SafeKeys_AreAccepted
                  - PushToTalkBinding_Validate_UnsafeKeys_AreRefusedWithASentence
                  - PushToTalkBinding_DisplayAndParse_RoundTripAndRefuseUnsafeText
                  - PushToTalkBinding_Stored_DefaultIsEmptyAndOldF8MeansTheDefault
                  - PushToTalkBinding_MatchesAndIsPartOf_FollowTheChord
                  - PushToTalkSetting_FollowsTheSettingsAndStopsWhenDisposed
