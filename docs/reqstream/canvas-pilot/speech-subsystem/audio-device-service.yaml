---
# Software Unit Requirements for the AudioDeviceService Unit
#
# The AudioDeviceService unit lists the machine's audio devices through the Speech library's audio device
# factory. It is the one place in the application that talks to the audio system. A machine without audio
# hardware is an ordinary state that is returned as a result, never thrown.

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Speech Subsystem Requirements
        sections:
          - title: AudioDeviceService Requirements
            requirements:
              - id: CanvasPilot-AudioDeviceService-ListDevices
                title: >-
                  The AudioDeviceService shall list the capture and playback devices that the audio system
                  reports, by name and in the order it reports them, and shall scan for newly attached or removed
                  hardware on request before listing again.
                justification: |
                  The settings page offers the devices to choose from and stores the chosen name. Headsets and
                  other devices are attached while the application runs, so the user must be able to make them
                  appear without restarting the application.
                children:
                  - CanvasPilot-OTS-Speech-EnumerateAudioDevices
                tests:
                  - AudioDeviceService_Enumerate_DevicesPresent_ReturnsBothLists
                  - AudioDeviceService_Enumerate_NoDevices_IsAvailableWithEmptyLists
                  - AudioDeviceService_Refresh_Succeeds_ScansThenListsDevices

              - id: CanvasPilot-AudioDeviceService-ToleratePoorAudioSystems
                title: >-
                  The AudioDeviceService shall return an audio system that cannot be used, such as one without
                  audio hardware or without its native library, or a scan that is refused, as a result with an
                  explanation and the devices that could be listed, shall record it in the log, and shall not
                  throw.
                justification: |
                  Many machines have no audio hardware, and the application must still start and let the user
                  change every other setting. A result with an explanation lets the page say what is wrong
                  instead of failing, and the log helps support find the cause.
                children:
                  - CanvasPilot-OTS-Speech-ToleratePoorAudioSystems
                tests:
                  - AudioDeviceService_Enumerate_BackendThrows_ReturnsUnavailableWithProblem
                  - AudioDeviceService_Refresh_Refused_ReturnsProblemAndStillLists
                  - AudioDeviceService_Failure_IsLogged
                  - AudioDeviceService_RealBackend_EnumerateAndRefresh_NeverThrow

              - id: CanvasPilot-AudioDeviceService-UseAudioOnDemand
                title: >-
                  The AudioDeviceService shall use the audio system only when devices are first requested, never
                  when the service is created, and shall refuse missing arguments.
                justification: |
                  Starting the audio system loads native libraries and can be slow or fail. The application
                  creates the service at startup, so the audio system must stay untouched until the user opens
                  the Speech page.
                tests:
                  - AudioDeviceService_Constructed_DoesNotTouchAudioSystem
                  - AudioDeviceService_InvalidArguments_Throw
