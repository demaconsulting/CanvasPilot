---
# Composer Subsystem Requirements
#
# PURPOSE:
# - Define requirements for the CanvasPilot Composer subsystem
# - The Composer subsystem holds the message that the user is composing for the chat and its attachments: the message
#   as ordered segments, the undo and redo of the user's changes, and the intake and staging of dropped and pasted
#   content. The subsystem has no dependency on the user interface; the editing control that shows the message is
#   added by a later unit
# - Subsystem requirements describe the behavior of the units working together

sections:
  - title: CanvasPilot Requirements
    sections:
      - title: Composer Subsystem Requirements
        requirements:
          - id: CanvasPilot-Composer-HoldOrderedSegments
            title: >-
              The Composer subsystem shall hold the message being composed as an ordered sequence of typed text,
              dictated text, and chips for attached files, folders, and images and for marks on the picture, so
              that every part keeps its place, its origin, and its kind, and shall give an unchangeable copy of the
              message on request.
            justification: |
              The message mixes what the user wrote, what the user said, and the things the user pointed at or
              attached, and its meaning depends on where each of them is. The agent needs to know which words were
              dictated, because speech recognition makes mistakes that typing does not. An unchangeable copy lets the
              message be built and shown while the user keeps working.
            children:
              - CanvasPilot-ComposerDocument-KeepOrderedSegments
              - CanvasPilot-ComposerDocument-InsertChipsAtCaret
              - CanvasPilot-ComposerDocument-DeleteRanges
              - CanvasPilot-ComposerDocument-SanitizeText
              - CanvasPilot-ComposerDocument-SnapshotImmutably
            tests:
              - ComposerSubsystem_Compose_MixedParts_KeepOrderOriginAndKind

          - id: CanvasPilot-Composer-UndoRedoPerAction
            title: >-
              The Composer subsystem shall undo and redo the user's changes to the message one action at a time:
              each typed or deleted character, each dictated block, each drop or paste of any number of items, each
              added mark, and each deleted chip is one step, and redo gives the same steps again.
            justification: |
              Users expect undo to take back what they just did and no more or less. A dictated block or a drop of
              many files is one action to the user, so it has to be one step, while typing is undone character by
              character like in any text editor. A redo that gave different steps than the undo would lose the
              user's work.
            children:
              - CanvasPilot-ComposerHistory-StepGranularity
              - CanvasPilot-ComposerHistory-RedoSameSteps
              - CanvasPilot-ComposerHistory-DiscardRedoOnNewEdit
              - CanvasPilot-ComposerHistory-BoundedDepth
            tests:
              - ComposerSubsystem_UndoRedo_MixedSequence_ReturnsToEachStateInOrder

          - id: CanvasPilot-Composer-ForgetDraftOnSend
            title: >-
              The Composer subsystem shall keep the draft and its undo history only in memory, and shall clear both
              when the message is sent, so that nothing of a sent message can be undone or found in the next one.
            justification: |
              A draft that was written to disk could leave the user's words, and the names of the files attached, on
              the computer after the user thought they were gone. Undo after sending would bring a sent message back
              into the next one.
            children:
              - CanvasPilot-ComposerHistory-ClearOnDemand
              - CanvasPilot-ComposerHistory-StartEmpty
            tests:
              - ComposerSubsystem_Send_ClearsHistoryAndDocument
              - ComposerSubsystem_Send_SnapshotIsUnaffectedByNextDraft

          - id: CanvasPilot-Composer-AcceptDroppedAndPastedContent
            title: >-
              The Composer subsystem shall turn dropped and pasted files, folders, pictures, and text into chips and
              text for the message, referring to dropped files and folders where they are, saving pasted pictures in
              the project's private data folder, and removing saved pictures that no chip refers to any more, without
              copying anything into the project while the message is a draft.
            justification: |
              Users bring material to the assistant by dropping files and folders and by pasting screenshots. Copying
              at drop time would fill the project with material for messages that are never sent, and undoing a drop
              would have to undo the copy, so the drop only refers to the material and the copy happens when the
              message is sent. A pasted picture has no file to refer to, so it is saved, and saved pictures that no
              chip refers to must not pile up.
            children:
              - CanvasPilot-AttachmentIntake-ClassifyContent
              - CanvasPilot-AttachmentIntake-ReferenceOriginalPaths
              - CanvasPilot-AttachmentIntake-SanitizeDroppedText
              - CanvasPilot-AttachmentStore-SavePastedImages
              - CanvasPilot-AttachmentStore-RemoveLeftovers
            tests:
              - ComposerSubsystem_DropThenUndo_RemovesChipsAndCopiesNothing

          - id: CanvasPilot-Composer-TreatContentAsData
            title: >-
              The Composer subsystem shall treat everything that is dropped or pasted strictly as data: it shall
              never open, run, or render it, shall leave out paths that are not safe to refer to, and shall create
              files only inside the project, with safe names and without following links.
            justification: |
              Dropped files come from the user's computer or from websites and mail, and may be programs, scripts,
              or names built to reach devices, other drives, or other files than the ones shown. The application only
              needs their bytes at the moment they are copied into the project, so nothing that is dropped may be
              given a chance to act.
            children:
              - CanvasPilot-AttachmentIntake-RefuseUnsafeNames
              - CanvasPilot-AttachmentStore-ConfineToProject
            tests:
              - ComposerSubsystem_Drop_ProgramsScriptsAndUnsafePaths_AreOnlyDataAndNeverRun

          - id: CanvasPilot-Composer-StageAttachmentsAtSend
            title: >-
              The Composer subsystem shall, when the message is sent, copy the attachments from outside the project
              into the project's attachments folder with names that never replace another file, refer to attachments
              that are in the project where they are, move pasted pictures there, and either put all of them there
              within the limits of 500 files and 200 MB for one message or none of them, saying which attachment
              prevents it.
            justification: |
              The assistant works on the project and needs the attached material inside it. Limits keep one message
              from filling the user's disk or the assistant's context, and a message that is only partly attached
              would mislead the assistant. The user must be told which attachment is the problem, so that it can be
              removed from the message.
            children:
              - CanvasPilot-AttachmentStore-CopyIntoProjectAtSend
              - CanvasPilot-AttachmentStore-LimitCopiedSize
              - CanvasPilot-AttachmentStore-CopyAllOrNothing
              - CanvasPilot-AttachmentStore-KeepNamesUnique
            tests:
              - ComposerSubsystem_Send_CopiesExternalFilesIntoProjectAttachments
