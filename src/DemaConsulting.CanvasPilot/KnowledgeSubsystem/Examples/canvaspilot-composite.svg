<svg xmlns="http://www.w3.org/2000/svg" width="900" height="480" viewBox="0 0 900 480">
  <!-- assets/flow.mmd and assets/sales.vl.json sit in the assets folder of the project; this file sits in its root -->
  <defs>
    <linearGradient id="band" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
  </defs>
  <style>
    .title { font: bold 26px sans-serif; fill: #ffffff; }
    .caption { font: italic 14px sans-serif; fill: #475569; }
  </style>
  <rect width="900" height="480" fill="#f1f5f9"/>
  <rect x="16" y="16" width="868" height="448" rx="20" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
  <path d="M16,36 a20,20 0 0 1 20,-20 h828 a20,20 0 0 1 20,20 v44 h-868 z" fill="url(#band)"/>
  <text class="title" x="48" y="60">Orders and sales</text>
  <image id="flow" href="assets/flow.mmd" x="40" y="110" width="400" height="300"/>
  <image id="sales" href="assets/sales.vl.json" x="460" y="110" width="400" height="300"/>
  <text class="caption" x="48" y="440">Left: the order flow. Right: sales by month.</text>
</svg>
