<?xml version="1.0" encoding="UTF-8"?>
<!--
  The CanvasPilot application icon: the brand mark of the title bar of the main window, a rounded tile filled with the
  accent gradient and a white sparkle. This file is the single source of the icon: render-icon.ps1 at the root of the
  repository draws Icon.png (256 px) and Icon.ico (16, 24, 32, 48, 64, and 256 px) from it. Run
  "pwsh ./render-icon.ps1" after a change and commit the three files together; "pwsh ./render-icon.ps1 -Check" tells
  whether the committed pictures are current.

  Keep it in step with the brand mark it repeats, and redraw it when one of them changes:
  - the tile of the title bar in AppShellSubsystem/MainWindowView.axaml: 24 by 24 with a corner radius of 7, and a
    14 by 14 glyph in the middle;
  - CpAccentGradient in AppShellSubsystem/Styles/Tokens.axaml: #4f46e5 at the top left to #06b6d4 at the bottom right;
  - CpIconSparkle in AppShellSubsystem/Styles/Icons.axaml: the path below is its data without the leading "F1" (both
    fill with the nonzero rule).

  The PathIcon of the title bar stretches the glyph uniformly into its 14 by 14 box. The glyph covers 2.99 to 17.01 of
  its 20 by 20 grid, so translate(2 2) puts it within 0.02 units of where the title bar draws it.

  The path has four subpaths, in this order: the outer outline of the large sparkle, the inner outline (the hole) of
  the large sparkle, the outer outline of the small sparkle, and the inner outline of the small sparkle. At 16 and 24
  px the outline is thinner than a pixel and blurs, so render-icon.ps1 keeps the first and the third subpath only and
  draws the sparkles filled at those sizes. It fails when the path does not have four subpaths.

  The sparkle is the glyph "Sparkle" of Fluent System Icons (20 px, regular) by Microsoft Corporation,
  https://github.com/microsoft/fluentui-system-icons, rounded to two decimals, used under the MIT License (copyright
  2020 Microsoft Corporation); the license text is in THIRD-PARTY-NOTICES.md.
-->
<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 24 24">
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="7" ry="7" fill="url(#accent)"/>
