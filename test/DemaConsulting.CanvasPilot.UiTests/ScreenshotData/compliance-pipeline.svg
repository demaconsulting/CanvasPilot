<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900">
  <defs>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#1e3a8a"/>
      <stop offset="1" stop-color="#2563eb"/>
    </linearGradient>
    <marker id="arrowUp" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0 0 L10 5 L0 10 Z" fill="#94a3b8"/>
    </marker>
    <style>
      .title { font: bold 46px sans-serif; fill: #0f172a; }
      .subtitle { font: 22px sans-serif; fill: #475569; }
      .step { font: bold 13px sans-serif; fill: #2563eb; letter-spacing: 1.5px; }
      .stage { font: bold 22px sans-serif; fill: #0f172a; text-anchor: middle; }
      .desc { font: 16px sans-serif; fill: #475569; text-anchor: middle; }
      .pill { font: bold 15px sans-serif; text-anchor: middle; }
      .card { fill: #ffffff; stroke: #e2e8f0; stroke-width: 1.5; }
      .iconbg { fill: #eff6ff; stroke: #dbeafe; stroke-width: 2; }
      .icon { fill: none; stroke: #1e3a8a; stroke-width: 3.5; stroke-linecap: round; stroke-linejoin: round; }
      .loop { font: italic 15px sans-serif; fill: #64748b; text-anchor: middle; }
      .legendhead { font: bold 14px sans-serif; fill: #1e3a8a; letter-spacing: 2px; }
      .legendsub { font: 14px sans-serif; fill: #64748b; }
      .toolname { font: bold 19px sans-serif; fill: #0f172a; }
      .tooldesc { font: 14px sans-serif; fill: #475569; }
      .badge { font: bold 16px sans-serif; fill: #ffffff; text-anchor: middle; }
      .footer { font: 13px sans-serif; fill: #94a3b8; }
    </style>
  </defs>

  <!-- Page -->
  <rect width="1600" height="900" fill="#f8fafc"/>

  <!-- Header -->
  <rect x="72" y="60" width="72" height="6" rx="3" fill="url(#accent)"/>
  <text class="title" x="72" y="122">Continuous Compliance Pipeline</text>
  <text class="subtitle" x="72" y="162">Every commit produces audit-ready evidence, from source change to signed-off release documents.</text>
  <line x1="72" y1="196" x2="1528" y2="196" stroke="#e2e8f0" stroke-width="2"/>

  <!-- Stage 1: Code commit -->
  <g>
    <rect class="card" x="72" y="232" width="248" height="390" rx="16" filter="url(#shadow)"/>
    <text class="step" x="96" y="272">STEP 01</text>
    <circle class="iconbg" cx="196" cy="352" r="52"/>
    <g class="icon" transform="translate(196 352)">
      <circle cx="-14" cy="-22" r="6"/>
      <circle cx="-14" cy="22" r="6"/>
      <circle cx="16" cy="-12" r="6"/>
      <line x1="-14" y1="-16" x2="-14" y2="16"/>
      <path d="M16 -6 C16 8 -14 4 -14 14"/>
    </g>
    <text class="stage" x="196" y="454">Code Commit</text>
    <text class="desc" x="196" y="486">Changes land by pull request</text>
    <text class="desc" x="196" y="510">on a protected main branch</text>
    <rect x="111" y="560" width="170" height="34" rx="17" fill="#f1f5f9" stroke="#94a3b8" stroke-width="1.5"/>
    <text class="pill" x="196" y="582" fill="#334155">Git · Pull request</text>
  </g>

  <!-- Stage 2: Build and test -->
  <g>
    <rect class="card" x="374" y="232" width="248" height="390" rx="16" filter="url(#shadow)"/>
    <text class="step" x="398" y="272">STEP 02</text>
    <circle class="iconbg" cx="498" cy="352" r="52"/>
    <g class="icon" transform="translate(498 352)">
      <rect x="-28" y="-22" width="56" height="44" rx="6"/>
      <line x1="-28" y1="-11" x2="28" y2="-11"/>
      <path d="M-11 5 L-3 13 L12 -2"/>
    </g>
    <text class="stage" x="498" y="454">Build &amp; Test</text>
    <text class="desc" x="498" y="486">CI builds, runs the tests,</text>
    <text class="desc" x="498" y="510">and scans code quality</text>
    <rect x="385" y="560" width="108" height="34" rx="17" fill="#dbeafe" stroke="#1d4ed8" stroke-width="1.5"/>
    <text class="pill" x="439" y="582" fill="#1d4ed8">BuildMark</text>
    <rect x="503" y="560" width="108" height="34" rx="17" fill="#ffedd5" stroke="#c2410c" stroke-width="1.5"/>
    <text class="pill" x="557" y="582" fill="#c2410c">SonarMark</text>
  </g>

  <!-- Stage 3: Requirements trace -->
  <g>
    <rect class="card" x="676" y="232" width="248" height="390" rx="16" filter="url(#shadow)"/>
    <text class="step" x="700" y="272">STEP 03</text>
    <circle class="iconbg" cx="800" cy="352" r="52"/>
    <g class="icon" transform="translate(800 352)">
      <rect x="-28" y="-24" width="18" height="14" rx="3"/>
      <rect x="-28" y="10" width="18" height="14" rx="3"/>
      <circle cx="18" cy="-17" r="8"/>
      <circle cx="18" cy="17" r="8"/>
      <line x1="-10" y1="-17" x2="10" y2="-17"/>
      <line x1="-10" y1="17" x2="10" y2="17"/>
      <line x1="-10" y1="-13" x2="11" y2="12"/>
    </g>
    <text class="stage" x="800" y="454">Requirements Trace</text>
    <text class="desc" x="800" y="486">Each requirement linked to</text>
    <text class="desc" x="800" y="510">passing test evidence</text>
    <rect x="730" y="560" width="140" height="34" rx="17" fill="#ccfbf1" stroke="#0f766e" stroke-width="1.5"/>
    <text class="pill" x="800" y="582" fill="#0f766e">ReqStream</text>
  </g>

  <!-- Stage 4: Review evidence -->
  <g>
    <rect class="card" x="978" y="232" width="248" height="390" rx="16" filter="url(#shadow)"/>
    <text class="step" x="1002" y="272">STEP 04</text>
    <circle class="iconbg" cx="1102" cy="352" r="52"/>
    <g class="icon" transform="translate(1102 352)">
      <circle cx="-6" cy="-6" r="17"/>
      <line x1="7" y1="7" x2="22" y2="22" stroke-width="5"/>
      <path d="M-14 -6 L-8 0 L3 -12"/>
    </g>
    <text class="stage" x="1102" y="454">Review Evidence</text>
    <text class="desc" x="1102" y="486">Peer reviews recorded against</text>
    <text class="desc" x="1102" y="510">the current file versions</text>
    <rect x="1032" y="560" width="140" height="34" rx="17" fill="#ede9fe" stroke="#6d28d9" stroke-width="1.5"/>
    <text class="pill" x="1102" y="582" fill="#6d28d9">ReviewMark</text>
  </g>

  <!-- Stage 5: Release documents -->
  <g>
    <rect class="card" x="1280" y="232" width="248" height="390" rx="16" filter="url(#shadow)"/>
    <text class="step" x="1304" y="272">STEP 05</text>
    <circle class="iconbg" cx="1404" cy="352" r="52"/>
    <g class="icon" transform="translate(1404 352)">
      <path d="M-16 -28 H8 L22 -14 V28 H-16 Z"/>
      <path d="M8 -28 V-14 H22"/>
    </g>
    <rect x="1374" y="352" width="38" height="18" rx="3" fill="#1e3a8a"/>
    <text x="1393" y="366" font-family="sans-serif" font-weight="bold" font-size="12" fill="#ffffff" text-anchor="middle">PDF</text>
    <text class="stage" x="1404" y="454">Release Documents</text>
    <text class="desc" x="1404" y="486">Audit-ready PDFs generated</text>
    <text class="desc" x="1404" y="510">and attached to the release</text>
    <rect x="1314" y="560" width="180" height="34" rx="17" fill="#e0e7ff" stroke="#1e3a8a" stroke-width="1.5"/>
    <text class="pill" x="1404" y="582" fill="#1e3a8a">PDF evidence pack</text>
  </g>

  <!-- Connectors between stages -->
  <g>
    <circle cx="347" cy="352" r="17" fill="url(#accent)"/>
    <circle cx="649" cy="352" r="17" fill="url(#accent)"/>
    <circle cx="951" cy="352" r="17" fill="url(#accent)"/>
    <circle cx="1253" cy="352" r="17" fill="url(#accent)"/>
    <g fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="343,344 351,352 343,360"/>
      <polyline points="645,344 653,352 645,360"/>
      <polyline points="947,344 955,352 947,360"/>
      <polyline points="1249,344 1257,352 1249,360"/>
    </g>
  </g>

  <!-- Continuous loop -->
  <path d="M1404 624 V662 H196 V634" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6 6" marker-end="url(#arrowUp)"/>
  <rect x="584" y="650" width="432" height="24" fill="#f8fafc"/>
  <text class="loop" x="800" y="667">Runs on every commit: evidence is regenerated automatically</text>

  <!-- Legend -->
  <rect x="72" y="702" width="1456" height="132" rx="14" fill="#ffffff" stroke="#e2e8f0" stroke-width="1.5"/>
  <text class="legendhead" x="104" y="760">TOOLS</text>
  <text class="legendsub" x="104" y="784">Evidence generators</text>
  <line x1="272" y1="726" x2="272" y2="810" stroke="#e2e8f0" stroke-width="2"/>

  <g>
    <rect x="304" y="746" width="44" height="44" rx="10" fill="#0f766e"/>
    <text class="badge" x="326" y="774">RS</text>
    <text class="toolname" x="362" y="762">ReqStream</text>
    <text class="tooldesc" x="362" y="784">Requirements and test traceability</text>
  </g>
  <g>
    <rect x="618" y="746" width="44" height="44" rx="10" fill="#6d28d9"/>
    <text class="badge" x="640" y="774">RM</text>
    <text class="toolname" x="676" y="762">ReviewMark</text>
    <text class="tooldesc" x="676" y="784">File review tracking and evidence</text>
  </g>
  <g>
    <rect x="932" y="746" width="44" height="44" rx="10" fill="#1d4ed8"/>
    <text class="badge" x="954" y="774">BM</text>
    <text class="toolname" x="990" y="762">BuildMark</text>
    <text class="tooldesc" x="990" y="784">Build notes from version control</text>
  </g>
  <g>
    <rect x="1246" y="746" width="44" height="44" rx="10" fill="#c2410c"/>
    <text class="badge" x="1268" y="774">SM</text>
    <text class="toolname" x="1304" y="762">SonarMark</text>
    <text class="tooldesc" x="1304" y="784">SonarQube quality reports</text>
  </g>

  <!-- Footer -->
  <text class="footer" x="72" y="870">Continuous compliance · Regulated software delivery</text>
</svg>
